  { name: "STDEV.S", module: "m9", tags: ["spread", "deviation", "unusual"],
    what: "Standard deviation of a sample: roughly, how far a typical value sits from the mean.",
    syntax: "=STDEV.S(range)", example: "=STDEV.S(B2:B500)", result: "the spread of the amounts",
    note: "Use STDEV.P only when your rows are the entire population rather than a sample of it. In practice you almost always want STDEV.S." },
  { name: "PERCENTILE.INC", module: "m9", tags: ["percentile", "rank", "threshold"],
    what: "The value below which a given proportion of the data falls.",
    syntax: "=PERCENTILE.INC(range, p)", example: "=PERCENTILE.INC(B2:B500, 0.95)", result: "the 95th percentile amount" },
  { name: "STANDARDIZE", module: "m9", tags: ["z score", "anomaly"],
    what: "Converts a value into a z score: how many standard deviations it sits from the mean.",
    syntax: "=STANDARDIZE(x, mean, standard_deviation)", example: "=STANDARDIZE(9, 5, 2)", result: "2, meaning two standard deviations above the mean",
    note: "A z score above 3 is genuinely unusual for roughly bell-shaped data. Transaction amounts are rarely bell-shaped, so treat it as a ranking device rather than a probability." },
  { name: "CORREL", module: "m9", tags: ["correlation", "relationship"],
    what: "How closely two columns move together, from -1 through 0 to 1.",
    syntax: "=CORREL(range1, range2)", example: "=CORREL(B2:B100, C2:C100)", result: "a number between -1 and 1",
    note: "It measures straight-line association only, and says nothing whatever about cause. Two things can correlate at 0.9 with no connection at all." },
  { name: "LARGE", module: "m9", tags: ["top", "nth largest"],
    what: "The nth largest value in a range.",
    syntax: "=LARGE(range, n)", example: "=LARGE(B2:B500, 3)", result: "the third largest amount" },
  { name: "SMALL", module: "m9", tags: ["bottom", "nth smallest"],
    what: "The nth smallest value in a range.",
    syntax: "=SMALL(range, n)", example: "=SMALL(B2:B500, 3)", result: "the third smallest amount" },
  { name: "RANK.EQ", module: "m9", tags: ["rank", "position", "league"],
    what: "The position of a value within a list, with ties sharing a rank.",
    syntax: "=RANK.EQ(value, range, [order])", example: "=RANK.EQ(B2, B2:B500)", result: "where B2 sits, largest first by default" },

  /* ---- Module 10: analysis for writing ---- */
  { name: "SORT", module: "m10", tags: ["order", "arrange"],
    what: "Returns a range sorted, spilling into new cells and leaving the original untouched.",
    syntax: "=SORT(range, [column], [order])", example: "=SORT(A2:C50, 3, -1)", result: "the block ordered by the third column, largest first",
    note: "Safer than the Sort button when the source data must stay in its original order for an audit trail." },
  { name: "FILTER", module: "m10", tags: ["subset", "where"],
    what: "Returns only the rows meeting a condition, spilling into new cells.",
    syntax: "=FILTER(range, condition, [if_empty])", example: '=FILTER(A2:C500, C2:C500="Leeds", "none")', result: "just the Leeds rows",
    note: "Unlike the Filter button this is a live formula, so it updates when the source data changes." },
  { name: "YEAR", module: "m10", tags: ["date", "extract"],
    what: "The year from a date.",
    syntax: "=YEAR(date)", example: "=YEAR(DATE(2024,3,1))", result: "2024" },
  { name: "MONTH", module: "m10", tags: ["date", "extract"],
    what: "The month number from a date, 1 to 12.",
    syntax: "=MONTH(date)", example: "=MONTH(DATE(2024,3,1))", result: "3",
    note: "To group a chart by month, add a helper column of =TEXT(date,\"yyyy-mm\"), which sorts correctly. =TEXT(date,\"mmm\") does not, because April sorts before January." }
];

/* ============================================================
   Interview drill: a timed twenty-minute practical mixing every
   Stage 1 skill, because that is the shape of test employers set.
   One messy file, eight tasks, a clock, and a mark at the end
   broken down by module so you know what to go back to.
   ============================================================ */

let DRILL = null;
const DRILL_SECONDS = 20 * 60;

function buildDrill(seed) {
  const r = rng(seed);
  const n = 24;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const s = M5_MASTER[rInt(r, 0, M5_MASTER.length - 1)];
    rows.push({
      ref: "TX-" + (9100 + i),
      code: s.code,
      city: rPick(r, ["Leeds", "London", "Bristol", "Manchester"]),
      date: ymdToSerial(2024, 2, 1) + rInt(r, 0, 89),
      amount: xround(rInt(r, 3000, 280000) / 100, 2)
    });
  }
  /* the faults, on known rows so the key is exact */
  rows[3].code = rows[3].code + " ";      // trailing space
  rows[9].code = "SUP-999";               // not in the master
  const textAmountRow = 6;

  const sh = new Sheet("Drill", n + 26, 6);
  ["Ref", "Code", "City", "Date", "Amount", "Supplier"].forEach((h, i) => sh.set(0, i, h, { hdr: true, locked: true }));
  rows.forEach((t, i) => {
    sh.set(1 + i, 0, t.ref, { locked: true });
    sh.set(1 + i, 1, t.code, { locked: true });
    sh.set(1 + i, 2, t.city, { locked: true });
    if (i === 2) sh.set(1 + i, 3, formatDate(t.date, "dd/mm/yyyy"), { locked: true });
    else sh.set(1 + i, 3, t.date, { fmt: DATEFMT, locked: true });
    if (i === textAmountRow) sh.set(1 + i, 4, t.amount.toFixed(2) + " ", { locked: true });
    else sh.set(1 + i, 4, t.amount, { fmt: GBP2, locked: true });
  });

  const mStart = n + 4;
  const m = writeMaster(sh, mStart);
  const mCode = "$A$" + m.first + ":$A$" + m.last;
  const mName = "$B$" + m.first + ":$B$" + m.last;

  const qStart = m.last + 3;
  label(sh, "A" + qStart, "Answers");
  const qs = [
    "Rows in the file",
    "Amounts stored as text",
    "Total, all amounts",
    "Transactions over 500",
    "Total for Leeds",
    "Codes not in the master",
    "Distinct cities"
  ];
  qs.forEach((q, i) => note(sh, "A" + (qStart + 1 + i), q));
  const cells = qs.map((q, i) => "C" + (qStart + 1 + i));

  const answers = [];
  for (let i = 0; i < n; i++) answers.push("F" + (2 + i));
  cells.forEach(c => answers.push(c));
  lockSheet(sh, answers);
  sh.rows = qStart + qs.length + 2; sh.cols = 6;

  const amtR = "E2:E" + (n + 1);
  const cityR = "C2:C" + (n + 1);
  const eRows = n;
  const eTextAmounts = solve(sh, "=COUNTA(" + amtR + ")-COUNT(" + amtR + ")");
  const eTotal = solve(sh, "=SUM(" + amtR + ")");
  const eOver = solve(sh, '=COUNTIF(' + amtR + ',">500")');
  const eLeeds = solve(sh, '=SUMIFS(' + amtR + ',' + cityR + ',"Leeds")');
  const eUnmatched = rows.filter(t => !M5_MASTER.some(x => x.code === String(t.code).trim())).length;
  const eCities = solve(sh, "=COUNTA(UNIQUE(" + cityR + "))");
  const nameOf = c => { const f = M5_MASTER.find(x => x.code === String(c).trim()); return f ? f.name : "not on file"; };

  return {
    sheet: sh,
    maxRows: sh.rows, maxCols: 6, startRow: 1, startCol: 5, fillBar: true,
    highlight: answers,
    brief: "Twenty-four payments and a supplier master. Bring the supplier name across in column F, then answer the seven questions below. " +
      "The file is damaged in the usual ways and nothing is labelled. Twenty minutes.",
    checks: [
      {
        cell: "F2", module: "m5", expect: nameOf(rows[0].code), needFormula: true, mustUse: "XLOOKUP",
        task: "F2: the supplier name, filled down the column.",
        answer: '=XLOOKUP(TRIM(B2),' + mCode + ',' + mName + ',"not on file")',
        why: "TRIM handles the row with a trailing space; the if_not_found argument handles the code that is not in the master. Both faults are present, and a plain lookup fails on each."
      },
      {
        cell: "F11", module: "m5", expect: "not on file", needFormula: true, mustUse: "XLOOKUP",
        task: "F11: the row whose code is not in the master.",
        answer: '=XLOOKUP(TRIM(B11),' + mCode + ',' + mName + ',"not on file")',
        why: "A genuine gap in the reference data. The right answer is a message, not a blank and not an error."
      },
      {
        cell: cells[0], module: "m1", expect: eRows,
        task: cells[0] + ": rows in the file.",
        answer: String(eRows),
        why: "Establish the size of the data before anything else, so every later figure can be checked against it."
      },
      {
        cell: cells[1], module: "m2", expect: eTextAmounts, needFormula: true,
        task: cells[1] + ": amounts stored as text.",
        answer: "=COUNTA(" + amtR + ")-COUNT(" + amtR + ")",
        why: "COUNTA counts everything non-empty, COUNT counts only numbers, and the gap is the number of text values. This is the two-cell check from Module 2, written as one."
      },
      {
        cell: cells[2], module: "m2", expect: eTotal, tol: 0.02, needFormula: true, mustUse: "SUM",
        task: cells[2] + ": the total of all amounts.",
        answer: "=SUM(" + amtR + ")",
        why: "Note this excludes the text amount, silently. The honest answer states the total and the fact that one row could not be included."
      },
      {
        cell: cells[3], module: "m3", expect: eOver, needFormula: true, mustUse: "COUNTIF",
        task: cells[3] + ": transactions over 500.",
        answer: '=COUNTIF(' + amtR + ',">500")',
        why: "Criteria quoted, operator included. Over 500 excludes 500 exactly."
      },
      {
        cell: cells[4], module: "m3", expect: eLeeds, tol: 0.02, needFormula: true, mustUse: "SUMIFS",
        task: cells[4] + ": the total for Leeds.",
        answer: '=SUMIFS(' + amtR + ',' + cityR + ',"Leeds")',
        why: "Range being added first in SUMIFS, then range and criterion pairs."
      },
      {
        cell: cells[5], module: "m5", expect: eUnmatched,
        task: cells[5] + ": codes not in the master.",
        answer: String(eUnmatched),
        why: "Count the not-on-file results in column F. This is a data quality finding, not a nuisance to be filtered away."
      },
      {
        cell: cells[6], module: "m4", expect: eCities, needFormula: true,
        task: cells[6] + ": distinct cities.",
        answer: "=COUNTA(UNIQUE(" + cityR + "))",
        why: "UNIQUE returns the distinct list without touching the data; COUNTA counts it."
      }
    ]
  };
}

/* ---------- the view ---------- */
RENDERERS.drill = function (root) {
  clear(root);

  if (!drillUnlocked()) {
    root.appendChild(el("h1", { text: "Interview drill" }));
    root.appendChild(el("div", { class: "card", style: "margin-top:16px" }, [
      el("p", { text: "This unlocks when Module 7 is complete. Before then it would only tell you what you already know: that you have not learned it yet." })
    ]));
    return;
  }

  if (!DRILL) {
    const past = S.drills || [];
    root.appendChild(el("h1", { text: "Interview drill" }));
    root.appendChild(el("p", { class: "lede", style: "margin-top:6px", text: "Twenty minutes, one damaged file, nine answers. Everything from Stage 1, mixed and unlabelled, which is how a practical test actually arrives." }));
    root.appendChild(el("div", { class: "card", style: "margin-top:16px" }, [
      el("h3", { text: "Before you start" }),
      el("ul", { class: "prose small", style: "margin-top:8px" }, [
        el("li", { html: "The clock runs from the moment you begin and does not pause. Finishing late is not a failure; not finishing tells you where you are slow." }),
        el("li", { html: "Nothing tells you which faults are in the file. Finding them is part of the test." }),
        el("li", { html: "You can submit early. Marks are shown by module, so a low score points at what to revisit." })
      ]),
      el("div", { class: "row", style: "margin-top:18px" }, [
        el("button", { class: "btn btn-primary btn-lg", onclick: () => startDrill(), text: "Start the twenty minutes" })
      ])
    ]));

    if (past.length) {
      const h = el("div", { class: "card", style: "margin-top:16px" });
      h.appendChild(el("h3", { text: "Previous attempts" }));
      const ul = el("ul", { class: "tasks", style: "margin-top:8px" });
      past.slice(-6).reverse().forEach(d => {
        ul.appendChild(el("li", {}, [el("div", { class: "tmain" }, [
          el("div", { style: "font-weight:560", text: d.score + " of " + d.total + " correct" }),
          el("div", { class: "tiny muted", style: "margin-top:2px", text: fmtDate(d.at.slice(0, 10)) + " · " + Math.floor(d.seconds / 60) + " min " + (d.seconds % 60) + " sec" })
        ])]));
      });
      h.appendChild(ul);
      root.appendChild(h);
    }
    return;
  }

  if (DRILL.finished) { drillResults(root); return; }

  /* running */
  const left = Math.max(0, DRILL_SECONDS - Math.floor((Date.now() - DRILL.startedAt) / 1000));
  const mins = Math.floor(left / 60), secs = left % 60;
  root.appendChild(el("div", { class: "row", style: "margin-bottom:12px" }, [
    el("span", { class: "eyebrow", text: "Interview drill" }),
    el("span", {
      class: "pill row-end " + (left < 120 ? "pill-bad" : left < 360 ? "pill-warn" : "pill-accent"),
      style: "font-variant-numeric:tabular-nums;font-size:14px",
      text: mins + ":" + String(secs).padStart(2, "0") + " left"
    })
  ]));

  root.appendChild(el("div", { class: "card" }, [
    el("h2", { text: "The brief" }),
    el("p", { style: "margin-top:8px;color:var(--ink-2)", text: DRILL.data.brief })
  ]));

  const tcard = el("div", { class: "card" });
  tcard.appendChild(el("h3", { text: "Answers required" }));
  const list = el("ul", { class: "tasks", style: "margin-top:6px" });
  DRILL.data.checks.forEach(c => {
    list.appendChild(el("li", {}, [el("div", { class: "tmain" }, [
      el("div", { html: c.task })
    ])]));
  });
  tcard.appendChild(list);
  root.appendChild(tcard);

  const gcard = el("div", { class: "card" });
  gcard.appendChild(el("h3", { text: "The file" }));
  gcard.appendChild(DRILL.grid.render());
  root.appendChild(gcard);

  root.appendChild(el("div", { class: "row", style: "margin-top:16px" }, [
    el("button", { class: "btn btn-ghost", onclick: () => { DRILL = null; go("home"); }, text: "Abandon" }),
    el("button", { class: "btn btn-primary btn-lg row-end", onclick: () => finishDrill(), text: "Submit" })
  ]));
};

function startDrill() {
  const seed = "drill:" + Date.now();
  const data = buildDrill(seed);
  DRILL = {
    data, seed, startedAt: Date.now(), finished: false,
    grid: new GridView(data.sheet, {
      targets: data.highlight, maxRows: data.maxRows, maxCols: data.maxCols,
      startRow: data.startRow, startCol: data.startCol, fillBar: data.fillBar
    })
  };
  DRILL.tick = setInterval(() => {
    if (!DRILL || DRILL.finished) return;
    const left = DRILL_SECONDS - Math.floor((Date.now() - DRILL.startedAt) / 1000);
    if (left <= 0) { finishDrill(); return; }
    if (currentView === "drill") {
      const pill = $("#view-drill .pill");
      if (pill) {
        const m = Math.floor(left / 60), s = left % 60;
        pill.textContent = m + ":" + String(s).padStart(2, "0") + " left";
        pill.className = "pill row-end " + (left < 120 ? "pill-bad" : left < 360 ? "pill-warn" : "pill-accent");
      }
    }
  }, 1000);
  go("drill");
}

function finishDrill() {
  if (!DRILL || DRILL.finished) return;
  clearInterval(DRILL.tick);
  DRILL.finished = true;
  DRILL.seconds = Math.min(DRILL_SECONDS, Math.floor((Date.now() - DRILL.startedAt) / 1000));
  DRILL.results = DRILL.grid.check(DRILL.data.checks);
  const score = DRILL.results.filter(r => r.ok).length;
  S.drills = (S.drills || []).concat([{
    at: new Date().toISOString(), score, total: DRILL.results.length, seconds: DRILL.seconds
  }]);
  saveState();
  go("drill");
}

function drillResults(root) {
  const res = DRILL.results;
  const score = res.filter(r => r.ok).length;
  const mins = Math.floor(DRILL.seconds / 60), secs = DRILL.seconds % 60;

  root.appendChild(el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Drill complete" }),
    el("h1", { text: score + " of " + res.length + " correct", style: "margin-top:6px" }),
    el("p", { class: "small", style: "margin-top:6px;color:var(--ink-2)", text: "Finished in " + mins + " minutes " + secs + " seconds." +
      (DRILL.seconds >= DRILL_SECONDS ? " The clock ran out, which is worth knowing before it happens in an interview." : "") })
  ]));

  /* where the marks went, by module */
  const byMod = {};
  res.forEach(r => {
    const m = r.chk.module || "?";
    byMod[m] = byMod[m] || { ok: 0, total: 0 };
    byMod[m].total++; if (r.ok) byMod[m].ok++;
  });
  const mc = el("div", { class: "card" });
  mc.appendChild(el("h3", { text: "Where the marks went" }));
  const ul = el("ul", { class: "tasks", style: "margin-top:8px" });
  Object.keys(byMod).sort().forEach(mid => {
    const b = byMod[mid], mod = MODULES[mid];
    ul.appendChild(el("li", {}, [
      el("div", { class: "tmain" }, [
        el("div", { style: "font-weight:560", text: mod ? "Module " + mod.n + " · " + mod.title : mid }),
        el("div", { class: "tiny muted", style: "margin-top:2px", text: b.ok + " of " + b.total + " correct" })
      ]),
      el("span", { class: "pill " + (b.ok === b.total ? "pill-good" : b.ok === 0 ? "pill-bad" : "pill-warn"), text: b.ok + "/" + b.total })
    ]));
  });
  mc.appendChild(ul);
  const weakest = Object.keys(byMod).filter(m => byMod[m].ok < byMod[m].total).sort();
  if (weakest.length) {
    mc.appendChild(el("p", { class: "small", style: "margin-top:12px;color:var(--ink-2)", html:
      "Marks came off in " + weakest.map(m => MODULES[m] ? "Module " + MODULES[m].n : m).join(" and ") +
      ". That is where the next hour is worth spending, not on another drill." }));
  }
  root.appendChild(mc);

  res.forEach(r => {
    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "row" }, [
      el("span", { class: "pill " + (r.ok ? "pill-good" : "pill-bad"), text: r.ok ? "correct" : "not yet" }),
      el("span", { class: "tiny muted", text: r.chk.module && MODULES[r.chk.module] ? "Module " + MODULES[r.chk.module].n : "" })
    ]));
    card.appendChild(el("p", { style: "margin-top:10px;font-weight:560", html: r.chk.task }));
    if (!r.ok) card.appendChild(el("div", { class: "callout callout-trap", style: "margin-top:10px" }, [
      el("div", { class: "callout-h", text: "What happened" }), el("p", { text: r.note })
    ]));
    card.appendChild(el("code", { class: "f-blk", style: "margin-top:10px", text: r.chk.answer }));
    card.appendChild(el("p", { class: "small", style: "margin-top:8px;color:var(--ink-2)", html: r.chk.why }));
    root.appendChild(card);
  });

  root.appendChild(el("div", { class: "row", style: "margin-top:16px" }, [
    el("button", { class: "btn", onclick: () => { DRILL = null; go("home"); }, text: "Back to the course" }),
    el("button", { class: "btn btn-primary row-end", onclick: () => { DRILL = null; startDrill(); }, text: "Another drill, new file" })
  ]));
}

/* ============================================================
   Module 8: Finding the needle
   Synthetic transaction data with planted patterns. Nothing here
   is real or sensitive; the shapes are what matter.
   ============================================================ */

const FC_NAMES = [
  "Marlow Freight Ltd", "Brackwell Holdings", "Corvina Trading", "Delmar Logistics",
  "Ellington Supply Co", "Fairholt Metals", "Grantley Partners", "Hesketh Imports"
];
const FC_COUNTRIES = ["GB", "IE", "NL", "DE", "AE", "SG", "PL", "US"];

/* One transaction log, with the pattern under test planted deliberately. */
function fcRows(seed, opts) {
  const o = opts || {};
  const r = rng(seed);
  const rows = [];
  const day0 = ymdToSerial(2024, 3, 1);
  const push = (acct, day, amount, country, kind) => rows.push({
    ref: "P" + (100000 + rows.length),
    account: acct,
    date: day0 + day,
    amount: xround(amount, 2),
    country: country || rPick(r, FC_COUNTRIES),
    counterparty: rPick(r, FC_NAMES),
    kind: kind || "normal"
  });

  const nAcct = o.accounts || 6;
  const accts = [];
  for (let i = 0; i < nAcct; i++) accts.push("AC-" + (4400 + i));

  /* ordinary background traffic */
  const bg = o.background === undefined ? 70 : o.background;
  for (let i = 0; i < bg; i++) {
    push(rPick(r, accts), rInt(r, 0, 59), rInt(r, 1200, 780000) / 100);
  }

  /* structuring: one account, several payments just under the threshold */
  if (o.structuring) {
    const acct = accts[1];
    const thr = o.threshold || 10000;
    for (let i = 0; i < (o.structuringCount || 6); i++) {
      push(acct, rInt(r, 10, 24), thr - rInt(r, 20, 400) - r(), null, "structuring");
    }
  }
  /* velocity: one account, many payments in a few days */
  if (o.velocity) {
    const acct = accts[3];
    for (let i = 0; i < (o.velocityCount || 11); i++) {
      push(acct, 32 + rInt(r, 0, 4), rInt(r, 8000, 160000) / 100, null, "velocity");
    }
  }
  /* round amounts: suspiciously exact figures */
  if (o.round) {
    const acct = accts[4];
    [5000, 10000, 2500, 7500, 15000].forEach((v, i) => push(acct, 5 + i * 7, v, null, "round"));
  }
  /* dormancy: an account silent for weeks, then three large payments */
  if (o.dormant) {
    const acct = accts[5];
    push(acct, 1, rInt(r, 2000, 9000) / 100, null, "pre-dormant");
    for (let i = 0; i < 3; i++) push(acct, 54 + i, rInt(r, 180000, 420000) / 100, null, "dormant-wake");
  }

  return rows.sort((a, b) => a.date - b.date || (a.ref < b.ref ? -1 : 1));
}

/* Lay a transaction log out: A Ref, B Account, C Date, D Amount, E Country */
function fcSheet(name, rows, extraHeads) {
  const sh = new Sheet(name, rows.length + 20, 5 + (extraHeads || []).length);
  ["Ref", "Account", "Date", "Amount", "Country"].concat(extraHeads || [])
    .forEach((h, i) => sh.set(0, i, h, { hdr: true, locked: true }));
  rows.forEach((t, i) => {
    sh.set(1 + i, 0, t.ref, { locked: true });
    sh.set(1 + i, 1, t.account, { locked: true });
    sh.set(1 + i, 2, t.date, { fmt: DATEFMT, locked: true });
    sh.set(1 + i, 3, t.amount, { fmt: GBP2, locked: true });
    sh.set(1 + i, 4, t.country, { locked: true });
  });
  return sh;
}
function fcAnswers(sh, startRow, labels) {
  label(sh, "A" + startRow, "Answers");
  const cells = [];

/* ============================================================

   ============================================================ */
const M9S1 = {
  title: "Mean against median, and when an average lies",
  aim: "Know which average to quote, and be able to show why the other one would mislead.",
  why: "Transaction data is never symmetrical. A handful of large payments drag the mean upwards until it describes almost nobody, and quoting it without the median is the commonest quiet dishonesty in analysis.",
  concepts: ["m9.meanmedian", "m9.skew", "m9.outlierpull", "m9.whichaverage"],
  unlocks: ["MEDIAN", "MODE.SNGL"],
  lesson: [
    { lead: "The mean is what you get when you share everything out equally. Very little is shared out equally." },
    { h: "The two figures" },
    {
      ul: [
        "<strong>Mean</strong>: total divided by count. Every value pulls on it in proportion to its size.",
        "<strong>Median</strong>: line them all up in order and take the middle one. One enormous value moves it by one position and almost not at all."
      ]
    },
    { f: "=AVERAGE(D2:D500)\n=MEDIAN(D2:D500)" },
    { h: "Skew" },
    { p: "When the mean sits well above the median, a minority of large values is pulling it up. That is called right skew, and it is the normal shape of almost anything involving money: payments, incomes, company sizes, city populations." },
    { p: "The gap is the diagnosis. Mean £1,240 against median £310 is not a rounding difference; it says most payments are small and a few are very large, and any sentence beginning <em>the average payment was</em> is about to mislead somebody." },
    { pro: "Quote both, always, in the same sentence: <em>the median payment was £310, with a mean of £1,240 reflecting a small number of much larger transfers</em>. It takes eight extra words and it is unarguable." },
    { h: "Which one to use" },
    {
      table: {
        cols: ["Question", "Use"], startRow: 1,
        rows: [
          ["What does a typical payment look like?", "median"],
          ["What is the total, and how does it split?", "mean, because mean times count is the total"],
          ["Has behaviour changed since last month?", "both, because they can move in opposite directions"],
          ["How much should we budget per transaction?", "mean, since budgets need the total"]
        ]
      }
    },
    { why: "The mean is not a worse figure than the median. It answers a different question. The mean is the only one that reconstructs the total, which is why finance uses it and why it is right for budgets. The median is the only one that describes a typical case, which is why it is right for a sentence containing the word typical." },
    { h: "The mode, briefly" },
    { p: "The most frequent value. Almost useless on continuous amounts, where no two values repeat, and genuinely useful on categories and on round-number data, where a spike of identical figures is itself the finding." },
    { trap: "An average of a group with very few members is not a summary, it is one number wearing a hat. Always show the count beside any average, and treat means over fewer than about ten values as an illustration rather than a statistic." },
    { desk: "No difference on desktop. Excel's AVERAGE and MEDIAN behave identically everywhere; what varies is whether anybody looked at both." }
  ],

  practice: function (seed) {

const M9S2 = {
  title: "Spread, z scores and percentiles",
  aim: "Put a number on how unusual something is, and know when that number is not trustworthy.",
  why: "Ranking anomalies is the whole of Module 8 done properly. A z score turns how odd is this into a figure you can sort by, provided you are honest about what it assumes.",
  concepts: ["m9.stdev", "m9.zscore", "m9.percentile", "m9.notnormal"],
  unlocks: ["STDEV.S", "STDEV.P", "PERCENTILE.INC", "QUARTILE.INC", "STANDARDIZE", "LARGE", "SMALL", "RANK.EQ"],
  lesson: [
    { lead: "Standard deviation is roughly how far a typical value sits from the mean." },
    { f: "=STDEV.S(D2:D500)" },
    { p: "Use <span class='f'>STDEV.S</span> when your rows are a sample of something larger, which they nearly always are. <span class='f'>STDEV.P</span> is for when you genuinely hold the entire population. On any reasonable number of rows the two differ trivially, and picking the wrong one is a much smaller sin than not looking at spread at all." },
    { h: "The z score" },
    { p: "How many standard deviations a value sits from the mean." },
    { f: "=STANDARDIZE(D2, $H$1, $H$2)\n=(D2-$H$1)/$H$2          the same thing written out" },
    { p: "A z of 0 is exactly average. A z of 2 is two standard deviations above. Negative means below. The point is that it is comparable: a z of 3 on payment amounts and a z of 3 on transaction counts mean the same degree of unusual, so you can rank across signals of different units." },
    { h: "What z scores assume, and why it matters here" },
    { p: "The familiar rules, that about 95 per cent of values lie within two standard deviations and 99.7 within three, hold for a bell curve. Payment data is not a bell curve. It is right-skewed with a long tail, so a z of 3 is far more common than the textbook says." },
    { trap: "Do not convert a z score into a probability on financial data and say something is a one-in-a-thousand event. It is not true, it is checkable, and somebody will check it. Use z scores to <em>rank</em>, which needs no distributional assumption, and stop there." },
    { why: "This is the difference between a defensible baseline and a black box. Ranking by z score says these are the most unusual rows relative to the spread of this data, which is exactly true. Claiming a probability says something about a distribution you have not verified and almost certainly do not have." },
    { h: "Percentiles, which assume nothing" },
    { f: "=PERCENTILE.INC(D2:D500, 0.95)" },
    { p: "The value below which 95 per cent of the data falls. No assumptions about shape at all: it is a fact about the numbers in front of you. For skewed data this is usually the better tool, and it is much easier to explain: <em>the top five per cent of payments start at £4,180</em>." },
    { p: "<span class='f'>QUARTILE.INC</span> is the same idea at 0, 25, 50, 75 and 100 per cent. The 50th percentile is the median, which is a useful thing to notice." },
    { pro: "For an exception queue, percentiles beat z scores. Take the top one per cent and you know exactly how many alerts you will generate, because you chose it. Take z above 3 and you find out afterwards, and on skewed data the answer is often hundreds." },
    { h: "Careful with the mean inside the z score" },
    { p: "The mean and standard deviation you divide by are themselves pulled about by the outliers you are hunting. One enormous payment inflates the standard deviation enough to hide the merely large ones behind it. On badly skewed data, rank on percentiles, or compute the baseline with the extreme values excluded and say that you did." },
    { desk: "The Analysis ToolPak on desktop produces descriptive statistics for a column in one dialogue, which is a convenience rather than a capability. Everything here is one formula." }
  ],
  reflect: [
    "Say why you would rank by z score but not quote a probability from one.",
    "Which would you use to size an exception queue, and why?"
  ],

  practice: function (seed) {
    const rows = fcRows(seed, { dormant: true, background: 80 });
    const sh = fcSheet("Spread", rows, ["z score"]);
    const n = rows.length, last = n + 1;

    label(sh, "H1", "Mean"); label(sh, "H2", "Std dev");
    const ansStart = n + 4;
    const cells = fcAnswers(sh, ansStart, [
      "95th percentile", "Largest z score", "Payments with z above 3", "Payments in the top 1%"
    ]);
    const zCells = [];
    for (let i = 0; i < n; i++) zCells.push("F" + (2 + i));
    lockSheet(sh, zCells.concat(cells, ["I1", "I2"]));
    [cells[0]].forEach(ref => { const p = parseA1(ref); sh.ensure(p.r, p.c).fmt = GBP2; });
    sh.rows = ansStart + cells.length + 2; sh.cols = 9;

    const amtR = "$D$2:$D$" + last;
    const amounts = rows.map(t => t.amount);
    const mean = amounts.reduce((a, b) => a + b, 0) / n;
    const sd = Math.sqrt(amounts.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (n - 1));
    const z = a => (a - mean) / sd;
    const eZ0 = xround(z(amounts[0]), 4);
    const sorted = amounts.slice().sort((a, b) => a - b);
    const pct = p => {
      const idx = p * (sorted.length - 1), lo = Math.floor(idx), hi = Math.ceil(idx);
      return lo === hi ? sorted[lo] : sorted[lo] + (idx - lo) * (sorted[hi] - sorted[lo]);
    };
    const eP95 = xround(pct(0.95), 2);
    const eMaxZ = xround(Math.max.apply(null, amounts.map(z)), 4);
    const eOver3 = amounts.filter(a => z(a) > 3).length;
    const eTop1 = amounts.filter(a => a >= pct(0.99)).length;

    return {
      sheet: sh,
      maxRows: sh.rows, maxCols: 9, colWidth: 92, startRow: 0, startCol: 8,
      fillBar: true, highlight: zCells.concat(cells, ["I1", "I2"]),
      brief: {
        title: "Ranking the unusual, without pretending to know the distribution",
        body: "Put the mean and standard deviation in <strong>I1</strong> and <strong>I2</strong>, then give every payment a z score. " +
          "Then answer the same question with percentiles and compare how many rows each approach would put in front of an analyst."
      },
      hint: "Lock the two baseline cells in your z score formula so they do not drift as it fills.",
      tasks: [
        { id: "t1", text: "In I1, the mean of the amounts.", cell: "I1" },
        { id: "t2", text: "In I2, the sample standard deviation.", cell: "I2" },
        { id: "t3", text: "In F2, the z score for that payment. Fill down.", cell: "F2" },
        { id: "t4", text: "In " + cells[0] + ", the 95th percentile of the amounts.", cell: cells[0] },
        { id: "t5", text: "In " + cells[1] + ", the largest z score in the file.", cell: cells[1] },
        { id: "t6", text: "In " + cells[2] + ", how many payments have a z above 3.", cell: cells[2] },
        { id: "t7", text: "In " + cells[3] + ", how many payments are in the top one per cent. Compare with the previous figure.", cell: cells[3], ext: true }
      ],
      checks: [
        {
          cell: "I1", expect: xround(mean, 2), tol: 0.02, needFormula: true, mustUse: "AVERAGE",
          task: "I1: the mean.",
          answer: "=AVERAGE(" + amtR + ")",
          why: "The baseline the z scores are measured against. Worth remembering it is itself pulled upwards by the outliers you are looking for.",
          wrongWay: "Using the median here. The z score is defined against the mean, and swapping one in without saying so makes the figure incomparable with anybody else's."
        },
        {
          cell: "I2", expect: xround(sd, 2), tol: 0.05, needFormula: true, mustUse: "STDEV",
          task: "I2: the standard deviation.",
          answer: "=STDEV.S(" + amtR + ")",
          why: "STDEV.S treats these rows as a sample of something larger, which they are. STDEV.P would differ here by well under a per cent and is only right if this is genuinely the entire population.",
          wrongWay: "Worrying at length about which. Not looking at spread at all is the much larger error."
        },
        {
          cell: "F2", expect: eZ0, tol: 0.01, needFormula: true,
          task: "F2: the z score for the first payment.",
          answer: "=STANDARDIZE(D2,$I$1,$I$2)   or   =(D2-$I$1)/$I$2",
          why: "How many standard deviations from the mean. Both forms are correct and the second is what most analysts write, because it is obvious what it does.",
          wrongWay: "Leaving I1 and I2 unlocked, so the baseline drifts down the sheet and every z score below the first is measured against different cells."
        },
        {
          cell: cells[0], expect: eP95, tol: 0.05, needFormula: true, mustUse: "PERCENTILE",
          task: cells[0] + ": the 95th percentile.",
          answer: "=PERCENTILE.INC(" + amtR + ",0.95)",
          why: "The top five per cent of payments start at " + gbp(eP95) + ". This assumes nothing about the shape of the data, which is why it is the safer tool on anything skewed.",
          wrongWay: "Reading it as the mean plus two standard deviations. That equivalence holds for a bell curve and this data is not one."
        },
        {
          cell: cells[1], expect: eMaxZ, tol: 0.02, needFormula: true, mustUse: "MAX",
          task: cells[1] + ": the largest z score.",
          answer: "=MAX(F2:F" + last + ")",
          why: "The most unusual row relative to the spread of this data. That statement is exactly true and needs no assumption about distribution, which is why ranking is a defensible use of z scores.",
          wrongWay: "Converting it to a probability. On right-skewed financial data a z of 3 is far commoner than the textbook figure, and the claim is checkable."
        },
        {
          cell: cells[2], expect: eOver3, needFormula: true, mustUse: "COUNTIF",
          task: cells[2] + ": payments with z above 3.",
          answer: '=COUNTIF(F2:F' + last + ',">3")',
          why: "You did not choose this number; the data did. That is the drawback of a z threshold for an exception queue: you find out how many alerts you have generated only after you have generated them.",
          wrongWay: "Setting a z threshold without checking the resulting volume. A rule producing hundreds of alerts a day will not be worked."
        },
        {
          cell: cells[3], ext: true, expect: eTop1, needFormula: true,
          task: cells[3] + ": payments in the top one per cent.",
          answer: '=COUNTIF(' + amtR + ',">="&PERCENTILE.INC(' + amtR + ',0.99))',
          why: "About " + eTop1 + " of " + n + ", because you chose one per cent. For sizing an exception queue this is the better tool: the volume is a decision rather than a discovery.",
          wrongWay: "Assuming the two approaches select the same rows. They usually overlap heavily and are not identical, and which you used belongs in the write-up."
        }
      ]
    };
  },
  workbook: function (seed) { const wb = new Workbook("M9S2"); wb.add(M9S2.practice(seed).sheet); return wb; }
};

/* ============================================================
   Session 3
   ============================================================ */
const M9S3 = {
  title: "Correlation, and the four ways it is abused",
  aim: "Measure whether two columns move together, and say precisely what that does and does not license you to claim.",
  why: "Correlation is the most misused number in analysis. Being able to compute it is trivial; being able to say what it means is what makes you worth listening to.",
  concepts: ["m9.correlation", "m9.causation", "m9.linearonly", "m9.spurious"],
  unlocks: ["CORREL"],
  lesson: [
    { lead: "Correlation measures whether two columns rise and fall together, and nothing else whatsoever." },
    { f: "=CORREL(D2:D500, E2:E500)" },
    { p: "The result runs from -1 to 1. Near 1 means they rise together, near -1 means one rises as the other falls, and near 0 means no straight-line relationship. That is the entire content of the number." },
    { h: "Abuse one: reading cause into it" },
    { p: "Two columns moving together is consistent with the first causing the second, the second causing the first, a third thing causing both, or coincidence. The figure cannot distinguish between them, and no amount of decimal places will help." },
    { pro: "Write correlations as <em>A and B move together</em>, never as <em>A drives B</em>. If somebody needs the causal claim, that is a different piece of work involving a controlled comparison, and saying so is the professional answer rather than a dodge." },
    { h: "Abuse two: assuming a straight line" },
    { p: "CORREL measures straight-line association only. Two columns can be perfectly and obviously related in a curve and return a correlation near zero. The defence costs ten seconds: draw the scatter plot and look at it before you quote the number." },
    { trap: "This is why Module 7 taught the scatter chart. A correlation quoted without anybody having looked at the scatter is a number produced by a machine that nobody has checked." },
    { h: "Abuse three: outliers" },
    { p: "One extreme point can create a strong correlation out of a shapeless cloud, or destroy a real one. On small samples this happens constantly. Recompute with the extreme values removed, and if the answer changes materially, report both figures and say which rows moved it." },
    { h: "Abuse four: fishing" },
    { p: "Compare twenty pairs of unrelated columns and, by chance alone, roughly one will look impressively correlated. Trawling a wide dataset for the strongest pair and reporting it is how spurious findings enter the world." },
    { why: "The honest protection is to say what you tested before you tested it. If you compared twenty pairs, say so, because a reader judging one correlation in isolation is judging it wrongly. This is not pedantry; it is the difference between an analysis and a coincidence dressed up." },
    { h: "How large is large" },
    {
      table: {
        cols: ["Roughly", "Reasonable words"], startRow: 1,
        rows: [
          ["0.0 to 0.2", "no useful relationship"],
          ["0.2 to 0.4", "weak, worth noting, not worth acting on"],
          ["0.4 to 0.7", "moderate"],
          ["0.7 to 1.0", "strong; check for an outlier and check it is not the same thing measured twice"]
        ]
      }
    },
    { trap: "A very strong correlation between two columns of your own data usually means they are the same quantity twice. Total spend correlates with number of transactions because both are driven by size; that is not a finding, it is arithmetic." },
    { desk: "The Analysis ToolPak's correlation matrix compares every column against every other in one step. It is convenient and it is a fishing expedition by design, so decide what you are testing before you run it." }
  ],
  reflect: [
    "Say the four things a strong correlation is consistent with.",
    "Before quoting a correlation, what should you have looked at?"
  ],

  practice: function (seed) {
    const r = rng(seed + ":corr");
    const n = 40;
    const sh = new Sheet("Correlation", n + 14, 6);
    ["Account", "Payments", "Total value", "Days active", "Staff"].forEach((h, i) => sh.set(0, i, h, { hdr: true, locked: true }));
    const pay = [], val = [], days = [], staff = [];
    for (let i = 0; i < n; i++) {
      const p = rInt(r, 4, 90);
      pay.push(p);
      val.push(xround(p * rInt(r, 180, 620) + rInt(r, -900, 900), 2));   // strongly related to payments
      days.push(rInt(r, 5, 60));                                          // unrelated
      staff.push(rInt(r, 1, 40));                                         // unrelated
      sh.set(1 + i, 0, "AC-" + (5100 + i), { locked: true });
      sh.set(1 + i, 1, pay[i], { locked: true });
      sh.set(1 + i, 2, val[i], { fmt: GBP2, locked: true });
      sh.set(1 + i, 3, days[i], { locked: true });
      sh.set(1 + i, 4, staff[i], { locked: true });
    }
    const last = n + 1;
    const ansStart = n + 4;
    const cells = fcAnswers(sh, ansStart, [
      "Payments against total value", "Payments against days active", "Staff against total value", "Pairs you would report"
    ]);
    lockSheet(sh, cells);
    sh.rows = ansStart + cells.length + 2; sh.cols = 6;

    const corr = (a, b) => {
      const ma = a.reduce((x, y) => x + y, 0) / a.length, mb = b.reduce((x, y) => x + y, 0) / b.length;
      let num = 0, da = 0, db = 0;
      for (let i = 0; i < a.length; i++) { const x = a[i] - ma, y = b[i] - mb; num += x * y; da += x * x; db += y * y; }
      return num / Math.sqrt(da * db);
    };
    const c1 = xround(corr(pay, val), 4), c2 = xround(corr(pay, days), 4), c3 = xround(corr(staff, val), 4);

    return {
      sheet: sh,
      maxRows: sh.rows, maxCols: 6, startRow: parseA1(cells[0]).r, startCol: 2,
      highlight: cells,
      brief: {
        title: "Four columns, six possible pairs, one honest answer",
        body: "Compute three correlations. One will be very strong, and the interesting question is whether it is a finding or arithmetic. " +
          "Before you write anything down, build a scatter chart of the strong pair in the downloaded workbook and look at it."
      },
      hint: "CORREL takes two ranges of the same length. The last answer is a number, not a formula: how many of these three you would actually put in a report.",
      tasks: [
        { id: "t1", text: "Correlation between payments and total value.", cell: cells[0] },
        { id: "t2", text: "Correlation between payments and days active.", cell: cells[1] },
        { id: "t3", text: "Correlation between staff and total value.", cell: cells[2] },
        { id: "t4", text: "In " + cells[3] + ", how many of these three you would report as a finding.", cell: cells[3], ext: true }
      ],
      checks: [
        {
          cell: cells[0], expect: c1, tol: 0.02, needFormula: true, mustUse: "CORREL",
          task: cells[0] + ": payments against total value.",
          answer: "=CORREL(B2:B" + last + ",C2:C" + last + ")",
          why: fmtNum(c1, 2) + ", which is very strong and is not a finding. Total value is roughly the number of payments multiplied by a typical payment size, so the two columns are largely the same quantity measured twice. Arithmetic, not insight.",
          wrongWay: "Reporting it as a discovery. A very strong correlation between two of your own columns almost always means they are the same thing twice, and saying so is what shows you understand the number."
        },
        {
          cell: cells[1], expect: c2, tol: 0.02, needFormula: true, mustUse: "CORREL",
          task: cells[1] + ": payments against days active.",
          answer: "=CORREL(B2:B" + last + ",D2:D" + last + ")",
          why: fmtNum(c2, 2) + ", near zero, meaning no useful straight-line relationship. Note that near zero does not mean unrelated: a strong curved relationship would also produce a figure near zero, which is why the scatter plot comes first.",
          wrongWay: "Concluding the two are independent. CORREL rules out a straight line and nothing else."
        },
        {
          cell: cells[2], expect: c3, tol: 0.02, needFormula: true, mustUse: "CORREL",
          task: cells[2] + ": staff against total value.",
          answer: "=CORREL(E2:E" + last + ",C2:C" + last + ")",
          why: fmtNum(c3, 2) + ". With forty rows a figure of this size can arise by chance, and it is exactly the sort of result that gets reported when somebody has quietly tested six pairs and picked the best one.",
          wrongWay: "Reporting whichever pair scored highest without saying how many you compared. Test twenty pairs of unrelated columns and roughly one will look impressive."
        },
        {
          cell: cells[3], ext: true, expect: 0,
          task: cells[3] + ": how many you would report as a finding.",
          answer: "0",
          why: "None of them. The first is two measures of the same thing, the second is nothing, and the third is small enough to be chance on forty rows. Being able to say that a dataset shows nothing is a real result and it is the hardest one to write.",
          wrongWay: "Finding something because you were asked to. The pressure to produce a finding is exactly what generates spurious ones, and a reader who later checks will remember."
        }
      ]
    };
  },
  workbook: function (seed) { const wb = new Workbook("M9S3"); wb.add(M9S3.practice(seed).sheet); return wb; }
};

/* ============================================================
   Session 4: Stage 2 capstone
   ============================================================ */
const M9S4 = {
  title: "Stage 2 capstone: a thousand transactions, six planted patterns",
  aim: "Find all six, rank them by severity with evidence, and write a short summary of each.",
  why: "Everything in Stage 2 on one file, in the form the work actually takes: not what does this formula do, but what is going on here and how sure are you.",
  concepts: ["m9.capstone"],
  unlocks: [],
  lesson: [
    { lead: "One thousand synthetic transactions across twenty accounts. Six accounts are doing something worth writing up." },
    { p: "Nothing in this file is real. The shapes are what matter, and they are the shapes the tests in Module 8 were built for." },
    { h: "The six patterns, unlabelled and in no particular order" },
    {
      ul: [
        "An account making repeated payments just under a reporting threshold.",
        "An account moving an unusual number of payments in a very short window.",
        "An account whose payments are suspiciously round.",
        "An account silent for a long period and then suddenly very active.",
        "A counterparty appearing under several spellings, so its true total is understated.",
        "An account whose largest payments sit far outside the spread of everything else."
      ]
    },
    { h: "What to produce" },
    {
      ol: [
        "<strong>A tested sheet.</strong> One column per signal, each computed rather than eyeballed, with the parameters in cells.",
        "<strong>A ranked table.</strong> One row per account, one column per signal, sorted by how many signals it trips and how strongly.",
        "<strong>Six short summaries.</strong> A hundred words each, in the four-part structure: what was seen, why it stands out, what it might be including the innocent explanation, and what you checked and could not resolve.",
        "<strong>One paragraph on the limits of the whole exercise.</strong> What this data cannot tell you at all."
      ]
    },
    { h: "How to rank" },
    { p: "Count the signals per account first, because two independent signals on one account is stronger evidence than one signal being extreme. Then, within accounts tripping the same number, order by the strength of the strongest signal. Show the components, so a reader can disagree with the ordering rather than having to accept it." },
    { pro: "The last item on the list is the one that marks the work as serious. This data has no counterparty ownership, no account purpose, no customer type and no narrative field, so nothing here can distinguish structuring from a business that pays in instalments. Say that plainly. An analyst who states the limits is trusted on the parts they did claim." },
    { h: "Marking yourself" },
    { p: "The rubric is below, out of 24. Under 16 means the module the marks came off is worth redoing before you attempt Stage 3." },
    { desk: "If you want to see what this looks like at scale, the same six tests in Power Query over a hundred thousand rows will run in seconds where the formulas take minutes. The logic does not change; only the tool does." }
  ],
  reflect: [
    "Which of the six did you find last, and what would have found it sooner?",
    "Write the limits paragraph. It is the hardest hundred words in the capstone."
  ],

  practice: function (seed) {
    const rows = fcRows(seed, {
      accounts: 20, background: 940,
      structuring: true, structuringCount: 7, threshold: 10000,
      velocity: true, velocityCount: 14,
      round: true, dormant: true
    });
    const sh = new Sheet("Answers", 16, 6);
    const cells = fcAnswers(sh, 1, [
      "Rows in the file", "Distinct accounts", "Median payment", "Mean payment",
      "Payments in the band below 10,000", "Highest 7-day count", "Longest gap, in days"
    ]);
    lockSheet(sh, cells);
    [cells[2], cells[3]].forEach(ref => { const p = parseA1(ref); sh.ensure(p.r, p.c).fmt = GBP2; });
    sh.rows = cells.length + 4; sh.cols = 6;

    const n = rows.length;
    const accts = []; rows.forEach(t => { if (accts.indexOf(t.account) < 0) accts.push(t.account); });
    const amounts = rows.map(t => t.amount);
    const sorted = amounts.slice().sort((a, b) => a - b);
    const median = xround(sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
      : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2, 2);
    const mean = xround(amounts.reduce((a, b) => a + b, 0) / n, 2);
    const band = rows.filter(t => t.amount >= 9000 && t.amount < 10000).length;
    const winCount = t => rows.filter(x => x.account === t.account && x.date > t.date - 7 && x.date <= t.date).length;
    const maxWin = Math.max.apply(null, rows.map(winCount));
    const gapOf = t => {
      const prior = rows.filter(x => x.account === t.account && x.date < t.date);
      return prior.length ? t.date - Math.max.apply(null, prior.map(x => x.date)) : 0;
    };
    const maxGap = Math.max.apply(null, rows.map(gapOf));

    return {
      sheet: sh, rubric: STAGE2_RUBRIC,
      maxRows: sh.rows, maxCols: 6, startRow: parseA1(cells[0]).r, startCol: 2,
      highlight: cells,
      brief: {
        title: "One thousand transactions, six things going on",
        body: "<strong>Download the workbook and do the work there.</strong> Build the six tests, rank the accounts, write the six summaries and the limits paragraph. " +
          "Then come back and enter these seven figures to check your working, and mark yourself against the rubric. " +
          "The figures below will not find the patterns for you; they confirm you were looking at the same file."
      },
      hint: "Do the workbook first. These seven cells are a checksum on your analysis, not a shortcut to it.",
      tasks: [
        { id: "t1", text: "Rows in the file.", cell: cells[0] },
        { id: "t2", text: "Distinct accounts.", cell: cells[1] },
        { id: "t3", text: "Median payment.", cell: cells[2] },
        { id: "t4", text: "Mean payment.", cell: cells[3] },
        { id: "t5", text: "Payments in the band from 9,000 up to but not including 10,000.", cell: cells[4] },
        { id: "t6", text: "The highest seven-day payment count for any account.", cell: cells[5] },
        { id: "t7", text: "The longest gap between consecutive payments on one account.", cell: cells[6], ext: true }
      ],
      checks: [
        {
          cell: cells[0], expect: n,
          task: cells[0] + ": rows in the file.",
          answer: String(n),
          why: "Establish the size before anything else, so every later figure has something to be checked against.",
          wrongWay: "Assuming a thousand exactly. Count it."
        },
        {
          cell: cells[1], expect: accts.length,
          task: cells[1] + ": distinct accounts.",
          answer: String(accts.length),
          why: "The denominator for every per-account statement you are about to make. Six of these " + accts.length + " are doing something worth writing up.",
          wrongWay: "Counting the account column rather than its distinct values."
        },
        {
          cell: cells[2], expect: median, tol: 0.05,
          task: cells[2] + ": the median payment.",
          answer: gbp(median),
          why: "The typical payment. Compare it with the mean below: the gap tells you the shape of the file before you have run a single test.",
          wrongWay: "Skipping straight to the tests. Five minutes on the distribution tells you which tests are worth running."
        },
        {
          cell: cells[3], expect: mean, tol: 0.05,
          task: cells[3] + ": the mean payment.",
          answer: gbp(mean),
          why: gbp(mean) + " against a median of " + gbp(median) + ". The mean sits above, which is the ordinary right skew of payment data and the reason a z-score baseline here needs treating carefully.",
          wrongWay: "Quoting the mean in the summaries as though it described a typical payment."
        },
        {
          cell: cells[4], expect: band,
          task: cells[4] + ": payments in the band below 10,000.",
          answer: String(band),
          why: "The raw count across the whole book. Your finding is not this number, it is how much of it comes from one account.",
          wrongWay: "Reporting the total as the structuring finding. Without the per-account breakdown it is just a histogram bucket."
        },
        {
          cell: cells[5], expect: maxWin,
          task: cells[5] + ": the highest seven-day count.",
          answer: String(maxWin),
          why: "Against a book where most accounts sit in low single figures over a week. State the window beside the figure, because at fourteen days the answer is different and equally true.",
          wrongWay: "Quoting a velocity figure without its window. The number is meaningless on its own."
        },
        {
          cell: cells[6], ext: true, expect: maxGap,
          task: cells[6] + ": the longest gap.",
          answer: String(maxGap) + " days",
          why: "The dormancy signal. Remember the guard for the first payment on each account, or six accounts report a gap of about 45,000 days and swamp the ranking.",
          wrongWay: "Forgetting the guard and then trusting the ranking that comes out of it."
        }
      ]
    };
  },
  workbook: function (seed) {
    const p = M9S4.practice(seed);
    const wb = new Workbook("M9S4");
    const r = rng(seed + ":wb");
    const rows = fcRows(seed, {
      accounts: 20, background: 940,
      structuring: true, structuringCount: 7, threshold: 10000,
      velocity: true, velocityCount: 14,
      round: true, dormant: true
    });
    const variants = { "Marlow Freight Ltd": ["Marlow Freight Ltd", "MARLOW FREIGHT LIMITED", "Marlow Freight Ltd ", "marlow freight"] };
    const sh = new Sheet("Transactions", rows.length + 4, 6);
    ["Ref", "Account", "Date", "Amount", "Country", "Counterparty"].forEach((h, i) => sh.set(0, i, h, { hdr: true }));
    rows.forEach((t, i) => {
      sh.set(1 + i, 0, t.ref);
      sh.set(1 + i, 1, t.account);
      sh.set(1 + i, 2, t.date, { fmt: DATEFMT });
      sh.set(1 + i, 3, t.amount, { fmt: GBP2 });
      sh.set(1 + i, 4, t.country);
      const cp = t.counterparty;
      sh.set(1 + i, 5, variants[cp] ? rPick(r, variants[cp]) : cp);
    });
    sh.rows = rows.length + 1; sh.cols = 6;
    wb.add(sh);
    return wb;
  }
};

const STAGE2_RUBRIC = [

];

defModule({
  id: "m9", n: 9, stage: "s2",
  title: "Statistics for analysts",
  subtitle: "Mean against median, spread, z scores, percentiles, correlation",
  blurb: "Enough statistics to say how unusual something is and, more importantly, to say what a figure does not license you to claim. Simple defensible baselines rather than black boxes, and the Stage 2 capstone.",

  ],
  reflect: [

  practice: function (seed) {

    const sh = new Sheet("Reshape", 40, 8);
    sh.set(0, 0, "Country", { hdr: true, locked: true });
    years.forEach((y, i) => sh.set(0, 1 + i, y, { hdr: true, locked: true }));

    const vals = {};
    M10_COUNTRIES.forEach((c, i) => {
      sh.set(1 + i, 0, c.name, { locked: true });
      years.forEach((y, j) => {

        const missing = (i === 3 && j === 0) || (i === 6 && j === 2);
        if (missing) { vals[c.name + y] = null; return; }
        const v = xround(rInt(r, 1800, 96000) / 10, 1);
        vals[c.name + y] = v;
        sh.set(1 + i, 1 + j, v, { locked: true });

        body: "The indicator arrives in the shape statistical agencies publish: one column per year. " +

      tasks: [

        { id: "t4", text: "In " + cells[1] + ", how many values are actually present.", cell: cells[1] },
        { id: "t5", text: "In " + cells[2] + ", how many observations are missing. Do not fill them with zero.", cell: cells[2], ext: true }
      ],
      checks: [

          task: valCells[0] + ": the first long-form value.",
          answer: "=INDEX(" + wideRange + ",MATCH(E" + (longStart + 1) + "," + countryCol + ",0),MATCH(F" + (longStart + 1) + "," + yearRow + ",0))",
          why: "INDEX with MATCH in two dimensions: one MATCH finds the row, the other finds the column. Everything pointing at the wide table is locked; the country and year references move down with the formula.",

          answer: "=INDEX(" + wideRange + ",MATCH(E" + (longStart + nLong) + "," + countryCol + ",0),MATCH(F" + (longStart + nLong) + "," + yearRow + ",0))",
          why: "If the lower rows return #REF! or #N/A, the wide-table ranges were not locked and have slid off the data. Check the bottom of the column, as always.",
          wrongWay: "A year heading imported as text will not match a numeric year column, and every MATCH fails at once. If a whole reshape returns #N/A, check the alignment of the heading row before you touch the formula. That is Module 1 arriving in Module 10."

  practice: function (seed) {

      sh.set(1 + i, 2, v2, { locked: true, fmt: "#,##0.0" });
    });
    const nC = 6, last = nC + 1;
    const chCells = [], pcCells = [];
    for (let i = 0; i < nC; i++) { chCells.push("D" + (2 + i)); pcCells.push("E" + (2 + i)); }

    const ansStart = nC + 4;
    const cells = fcAnswers(sh, ansStart, [
      "Largest percentage rise, %", "Country with that rise", "Its 2021 value", "Countries that fell"
    ]);
    lockSheet(sh, chCells.concat(pcCells, cells));
    pcCells.forEach(ref => { const p = parseA1(ref); sh.ensure(p.r, p.c).fmt = "0.0"; });
    sh.rows = ansStart + cells.length + 2; sh.cols = 6;

    const pc = i => xround(100 * (b[i] - a[i]) / a[i], 1);
    const pcs = a.map((_, i) => pc(i));
    let bi = 0; pcs.forEach((v, i) => { if (v > pcs[bi]) bi = i; });
    const nFell = a.filter((v, i) => b[i] < v).length;

    return {
      sheet: sh,
      maxRows: sh.rows, maxCols: 6, colWidth: 96, startRow: 1, startCol: 3,
      fillBar: true, highlight: chCells.concat(pcCells, cells),
      brief: {
        title: "Six countries, and one percentage that will mislead you",
        body: "Work out the change and the percentage change for each country. One of the six has a very large percentage rise and a base so small that reporting the percentage alone would be dishonest. " +
          "Find it, and note its base, because that is the figure that has to travel with the claim."
      },
      hint: "Percentage change is the difference over the original, times 100. Fill both columns down before looking at the answers.",
      tasks: [
        { id: "t1", text: "In D2, the change from 2021 to 2022. Fill down.", cell: chCells[0] },
        { id: "t2", text: "In E2, the percentage change, to one decimal place. Fill down.", cell: pcCells[0] },
        { id: "t3", text: "In " + cells[0] + ", the largest percentage rise.", cell: cells[0] },
        { id: "t4", text: "In " + cells[1] + ", the country with it.", cell: cells[1] },
        { id: "t5", text: "In " + cells[2] + ", that country's 2021 value. This is the base you must publish alongside the percentage.", cell: cells[2] },
        { id: "t6", text: "In " + cells[3] + ", how many countries fell.", cell: cells[3], ext: true }
      ],
      checks: [
        {
          cell: chCells[0], expect: xround(b[0] - a[0], 1), tol: 0.05, needFormula: true,
          task: chCells[0] + ": the change.",
          answer: "=C2-B2",
          why: "The absolute change, in the same units as the source. Always compute this beside the percentage: on small bases it is the honest figure and the percentage is the misleading one.",
          wrongWay: "Reporting only percentages. A reader cannot reconstruct the absolute change from a percentage without the base, and most will not try."
        },
        {
          cell: pcCells[0], expect: pcs[0], tol: 0.15, needFormula: true,
          task: pcCells[0] + ": the percentage change.",
          answer: "=(C2-B2)/B2*100",
          why: "Difference over the original, not over the new value. Dividing by the wrong one is a standard error that gets the direction right and the magnitude wrong.",
          wrongWay: "<span class='f'>=(C2-B2)/C2*100</span>. It looks equally reasonable and gives a different answer, and nothing on the sheet will tell you which you used."
        },
        {
          cell: cells[0], expect: pcs[bi], tol: 0.2, needFormula: true, mustUse: "MAX",
          task: cells[0] + ": the largest percentage rise.",
          answer: "=MAX(" + pcCells[0] + ":" + pcCells[nC - 1] + ")",
          why: fmtNum(pcs[bi], 1) + " per cent. A striking figure, and on its own an unusable one until you have looked at what it is a percentage of.",
          wrongWay: "Putting this in a headline. It is the most quotable number on the sheet and the least defensible without its base."
        },
        {
          cell: cells[1], expect: M10_COUNTRIES[bi].name,
          task: cells[1] + ": the country with the largest rise.",
          answer: M10_COUNTRIES[bi].name,
          why: "Now look at its 2021 value before writing anything about it.",
          wrongWay: "Naming the country and the percentage in the same sentence with no base. That is the sentence a hostile reader will check first."
        },
        {
          cell: cells[2], expect: a[bi], tol: 0.05,
          task: cells[2] + ": its 2021 base.",
          answer: fmtNum(a[bi], 1),
          why: "A rise from " + fmtNum(a[bi], 1) + " to " + fmtNum(b[bi], 1) + ". Written honestly that is <em>up " + fmtNum(pcs[bi], 1) + " per cent, from " + fmtNum(a[bi], 1) + " to " + fmtNum(b[bi], 1) + "</em>, and the reader can judge for themselves whether it matters. One clause, and the claim becomes unarguable.",
          wrongWay: "Omitting the base because it makes the finding less exciting. A reader who finds it themselves will discount everything else you wrote."
        },
        {
          cell: cells[3], ext: true, expect: nFell, needFormula: true, mustUse: "COUNTIF",
          task: cells[3] + ": countries that fell.",
          answer: '=COUNTIF(' + chCells[0] + ':' + chCells[nC - 1] + ',"<0")',
          why: "This is the number that cuts against a story about growth, and it is the one to go looking for before publishing rather than after. If most countries fell, the headline rise is an outlier and the piece should say so.",
          wrongWay: "Not computing it. The figure that weakens your argument is the one a disagreeing reader will look up first, so you should look it up first."
        }
      ]
    };
  },
  workbook: function (seed) { const wb = new Workbook("M10S3"); wb.add(M10S3.practice(seed).sheet); return wb; }
};

    opts: ["What was seen", "Why it stands out", "What it might be", "What you checked and could not resolve"],
    a: 3,
    why: "Stating what you could not establish lets somebody pick the work up without repeating it. Its absence makes a reader wonder what else went unsaid.",
    trap: "Treating the limits as weakness. They are the part that makes the rest credible."
  },

  /* ---------------- Module 9 ---------------- */
  {
    c: "m9.meanmedian", t: "mc",
    q: "Mean £1,240, median £310. What does that tell you?",
    opts: ["Someone has made an error", "Most payments are small and a few are very large",
           "The data is symmetrical", "The median is wrong"],
    a: 1,
    why: "A mean well above the median means a minority of large values is pulling it up. That is right skew, and it is the normal shape of anything involving money.",

  {
    c: "m9.skew", t: "mc",
    q: "On a right-skewed set of payments, roughly what share sits above the mean?",

    a: 1,
    why: "The mean is dragged upwards past most of the data by the long tail. The half-and-half intuition comes from the bell curve, which financial data is not.",

  {
    c: "m9.outlierpull", t: "mc",
    q: "Why is a z score awkward on badly skewed data?",

    why: "One enormous payment inflates the standard deviation enough to hide the merely large ones behind it. Rank on percentiles, or compute the baseline with the extremes excluded and say that you did.",

  {
    c: "m9.whichaverage", t: "mc",

  {
    c: "m9.stdev", t: "mc",

    a: 1,
    why: "You almost always hold a sample of something larger. On any reasonable number of rows the two differ trivially, and not looking at spread at all is the much larger error.",

  {
    c: "m9.zscore", t: "mc",
    q: "What is a z score of 2?",
    opts: ["Twice the mean", "Two standard deviations above the mean", "The second largest value", "A 2% chance"],
    a: 1,
    why: "It measures distance from the mean in units of spread, which makes values from different columns comparable and therefore rankable together.",

  {
    c: "m9.percentile", t: "mc",

    a: 1,
    why: "With a z threshold you find out how many alerts you generated only after generating them, and on skewed data the answer is often hundreds.",

  {
    c: "m9.correlation", t: "mc",

    a: 1,

    c: "m9.spurious", t: "mc",

    a: 1,
    why: "The honest protection is to say what you tested before you tested it. A reader judging one correlation in isolation is judging it wrongly.",

    c: "m9.capstone", t: "mc",

    a: 1,
    why: "This data has no account purpose, no customer type and no narrative field, so nothing in it can distinguish structuring from a business paying in instalments. Saying so is what earns trust in the parts you did claim.",

  {

  {

    q: "Country names arrive as TÃ¼rkiye. What is wrong and what fixes it?",

  {
    c: "m10.sourcecol", t: "mc",

    opts: ["It looks better", "Because a filtered, sorted or copied subset of rows carries its provenance with it",
           "Notes are not allowed", "It saves space"],
    a: 1,

    c: "m10.reshape", t: "mc",

    a: 1,

  {
    c: "m10.blanksmissing", t: "mc",
    q: "A World Bank indicator has no value for a country in 2020. What do you put in the cell?",

    a: 1,

    q: "Which pair of figures is safe to compare across years?",

    why: "Current dollars include inflation, so a change across years mixes real change with price change. Copy the indicator's full name and unit onto the sheet verbatim.",

    c: "m10.exactfigures", t: "mc",

    c: "m10.againstyourself", t: "mc",

    q: "In the Stage 3 capstone, what are the two charts for?",
    opts: ["Two views of the same finding", "One carrying the claim, one carrying the counter-evidence",
           "One for print and one for screen", "Any two that look good"],
    a: 1,
    why: "That pairing is the structure of the whole exercise, and it is why the number is fixed at two rather than left open.",

/* ============================================================
   Course map completion.
   Every module is now built, so this file registers nothing. It
   stays because it is where an unbuilt module would be declared,
   and because the home screen and the reference both rely on
   MODULES being complete rather than on modules existing.
   ============================================================ */

const ROADMAP = [];
ROADMAP.forEach(m => {
  if (MODULES[m.id]) return;
  defModule(Object.assign({ pending: true, concepts: [], sessions: [] }, m));
});

function pendingModules() { return MODULE_ORDER.filter(id => MODULES[id].pending); }
function nextPendingModule() {
  for (const id of MODULE_ORDER) if (MODULES[id].pending) return MODULES[id];
  return null;
}

/* ============================================================
   Boot
   ============================================================ */
(function boot() {
  // the Node test runner loads these sources without a real DOM
  if (typeof window !== "undefined" && window.__DD_NO_BOOT) return;
  loadState();
  applyTheme();

  $("#themeBtn").addEventListener("click", cycleTheme);

  /* Concepts are registered by the module files, but a card only
     exists once a lesson has introduced it. Nothing to do here
     except make sure the nav reflects what is due today. */
  S.lastSeen = todayISO();
  saveState();

  renderNav();
  go("home");

  /* A quick internal check that the engine agrees with the answer
     keys shipped in this build. Logs to the console only; a learner
     never sees it, but it means a broken formula cannot ship quietly. */
  setTimeout(selfTest, 0);
})();

function selfTest() {
  const problems = [];
  let checked = 0;

  SESSION_ORDER.forEach(sid => {
    const s = SESSIONS[sid];
    if (!s.practice) return;
    let p;
    try { p = s.practice(sid + ":0"); }
    catch (e) { problems.push(sid + " practice() threw: " + e.message); return; }

    if (!p.sheet) { problems.push(sid + " practice() returned no sheet"); return; }

    /* every check must point at a real cell and carry an answer key */
    (p.checks || []).forEach(c => {
      checked++;
      const where = c.pivotSpec ? "pivot setup" : c.cell;
      if (!c.pivotSpec && !parseA1(c.cell)) problems.push(sid + " check has an unreadable cell address: " + c.cell);
      if (c.pivotSpec && !p.pivot) problems.push(sid + " has a pivot check but no pivot table");
      if (!c.answer) problems.push(sid + " check on " + where + " has no answer key");
      if (!c.why) problems.push(sid + " check on " + where + " has no reasoning");
    });

    /* every task cell should be one of the checked cells or explicitly none */
    (p.tasks || []).forEach(t => {
      if (t.cell && !(p.checks || []).some(c => c.cell === t.cell)) {
        problems.push(sid + " task points at " + t.cell + " but nothing checks that cell");
      }
    });

    /* a pivot's fields must exist on its own data */
    if (p.pivot) {
      const keys = Object.keys(p.pivot.data[0] || {});
      (p.pivot.fields || []).forEach(f => {
        if (keys.indexOf(f.name) < 0) problems.push(sid + " pivot field " + f.name + " is not in the data");
      });
      if (!p.pivot.data.length) problems.push(sid + " pivot has no data");
    }

    /* the workbook must build */
    try {
      const wb = s.workbook(sid + ":0");
      if (!wb || !wb.sheets.length) problems.push(sid + " workbook() produced nothing");
    } catch (e) { problems.push(sid + " workbook() threw: " + e.message); }
  });

  /* every question must have a concept that exists and a defensible answer */
  QUESTIONS.forEach((q, i) => {
    checked++;
    if (!CONCEPTS[q.c]) problems.push("question " + i + " tags unknown concept " + q.c);
    if (!q.why) problems.push("question " + i + " has no explanation");
    if (q.t === "mc" || q.t === "pred") {
      if (!q.opts || q.opts.length < 2) problems.push("question " + i + " has too few options");
      if (typeof q.a !== "number" || q.a < 0 || q.a >= (q.opts || []).length) problems.push("question " + i + " has an answer index outside its options");
    } else if (q.t === "type") {
      if (!q.check && !(q.accept && q.accept.length)) problems.push("question " + i + " accepts nothing");
      if (q.check) {
        const sh = new Sheet("Q", 40, 12);
        for (const ref in (q.check.sheet || {})) {
          const pos = parseA1(ref); if (!pos) continue;
          const v = q.check.sheet[ref];
          if (typeof v === "string" && v[0] === "=") sh.setFormula(pos.r, pos.c, v.slice(1)); else sh.set(pos.r, pos.c, v);
        }
        const model = q.model || (q.accept || [])[0];
        if (model) {
          const out = computeFormula(model, sh.ctx());
          if (out && out.parseError) problems.push("question " + i + " model formula does not parse: " + out.parseError);
          else if (!valueMatches(out, q.check.expect, q.check.tol)) {
            problems.push("question " + i + " model formula returns " + JSON.stringify(out) + " but the key says " + JSON.stringify(q.check.expect));
          }
        }
      }
    }
  });

  /* every concept must have at least one question, or it can never be reviewed */
  Object.keys(CONCEPTS).forEach(cid => {
    if (!questionsFor([cid]).length) problems.push("concept " + cid + " has no question, so it can never come up in review");
  });

  /* every reference entry must name a function the engine implements */
  REFERENCE.forEach(r => {
    checked++;
    if (!FN[r.name]) problems.push("reference lists " + r.name + " but the engine does not implement it");
    if (!MODULES[r.module]) problems.push("reference entry " + r.name + " points at unknown module " + r.module);
  });

  if (problems.length) {
    console.error(APP_NAME + " self-test found " + problems.length + " problem(s):");
    problems.forEach(p => console.error("  · " + p));
  } else {
    console.log(APP_NAME + " self-test passed. " + checked + " items verified across " +
      SESSION_ORDER.length + " sessions, " + QUESTIONS.length + " questions and " +
      REFERENCE.length + " reference entries.");
  }
  window.__ddSelfTest = { problems, checked };
}

</script>
