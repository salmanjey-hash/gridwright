<!doctype html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridwright</title>
<meta name="description" content="Excel and data analysis, from zero. Offline, free, no account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23155e63'/><path d='M26 26h48v48' stroke='%237fd8c4' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M26 26 74 74' stroke='%237fd8c4' stroke-width='9' stroke-linecap='round'/><circle cx='26' cy='26' r='7' fill='%23155e63' stroke='%237fd8c4' stroke-width='6'/></svg>">
<style>
/* ============================================================
   Gridwright — design tokens and base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }

:root {
  --bg:        #f6f7f5;
  --bg-sunk:   #eceee9;
  --surface:   #ffffff;
  --surface-2: #f3f4f1;
  --line:      #dcdfd8;
  --line-soft: #e8eae4;
  --ink:       #1c211d;
  --ink-2:     #4a534c;
  --ink-3:     #77807a;
  --accent:      #15605a;
  --accent-ink:  #ffffff;
  --accent-soft: #dcefe9;
  --accent-line: #a7cfc5;
  --good:      #1d6b3f;
  --good-soft: #dff0e3;
  --warn:      #8a5a06;
  --warn-soft: #fbeed2;
  --bad:       #9a2c2c;
  --bad-soft:  #f8e0dd;
  --info:      #23507e;
  --info-soft: #dfe9f5;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow:    0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.05);
  --shadow-lg: 0 2px 6px rgba(20,30,25,.08), 0 18px 40px rgba(20,30,25,.12);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --maxw: 780px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #14171a;
    --bg-sunk:   #0f1214;
    --surface:   #1c2023;
    --surface-2: #23282c;
    --line:      #333a3f;
    --line-soft: #2a3033;
    --ink:       #e7ebe8;
    --ink-2:     #b0b9b4;
    --ink-3:     #838d88;
    --accent:      #6fc9bb;
    --accent-ink:  #08201e;
    --accent-soft: #1b3733;
    --accent-line: #35635c;
    --good:      #7fd39a;
    --good-soft: #16301f;
    --warn:      #e2b45c;
    --warn-soft: #33270f;
    --bad:       #ea9188;
    --bad-soft:  #3a1e1c;
    --info:      #8fbbe8;
    --info-soft: #16283a;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg:        #14171a;
  --bg-sunk:   #0f1214;
  --surface:   #1c2023;
  --surface-2: #23282c;
  --line:      #333a3f;
  --line-soft: #2a3033;
  --ink:       #e7ebe8;
  --ink-2:     #b0b9b4;
  --ink-3:     #838d88;
  --accent:      #6fc9bb;
  --accent-ink:  #08201e;
  --accent-soft: #1b3733;
  --accent-line: #35635c;
  --good:      #7fd39a;
  --good-soft: #16301f;
  --warn:      #e2b45c;
  --warn-soft: #33270f;
  --bad:       #ea9188;
  --bad-soft:  #3a1e1c;
  --info:      #8fbbe8;
  --info-soft: #16283a;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.45);
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); color: var(--ink); }

/* ============================================================
   Shell: top bar, view container
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; border-radius: 7px; }
.brand-name { font-size: 17px; }
.brand-tag { font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
.topnav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
.topnav button {
  background: none; border: 1px solid transparent; border-radius: 8px;
  padding: 6px 11px; font-size: 14px; color: var(--ink-2); cursor: pointer; font-weight: 500;
}
.topnav button:hover { background: var(--surface-2); color: var(--ink); }
.topnav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); font-weight: 600; }
.topnav .pip {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px;
  background: var(--accent); color: var(--accent-ink);
  border-radius: 9px; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
}
.icon-btn {
  background: none; border: 1px solid var(--line); border-radius: 8px;
  width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.view { max-width: var(--maxw); margin: 0 auto; padding: 28px 18px 96px; }
.view.wide { max-width: 1120px; }
.view[hidden] { display: none; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 16px; }
.card-flat { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; }

h1 { font-size: 29px; line-height: 1.2; letter-spacing: -.02em; font-weight: 660; }
h2 { font-size: 21px; line-height: 1.28; letter-spacing: -.015em; font-weight: 640; }
h3 { font-size: 16.5px; line-height: 1.35; font-weight: 640; }
h4 { font-size: 14px; font-weight: 640; letter-spacing: .02em; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.lede { font-size: 17px; color: var(--ink-2); }
.muted { color: var(--ink-3); }
.small { font-size: 13.5px; }
.tiny { font-size: 12px; }
.stack > * + * { margin-top: 12px; }
.stack-lg > * + * { margin-top: 22px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-end { margin-left: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 560; font-size: 14.5px;
  cursor: pointer; text-decoration: none; transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn-lg { padding: 13px 22px; font-size: 16px; border-radius: 11px; }
.btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
.btn-ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-block { width: 100%; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 620;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-soft);
}
.pill-good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill-bad  { background: var(--bad-soft);  color: var(--bad);  border-color: transparent; }
.pill-info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ============================================================
   Lesson prose, callouts, formula chips, keyboard keys
   ============================================================ */
.prose { font-size: 16.5px; line-height: 1.68; color: var(--ink); }
.prose > * + * { margin-top: 14px; }
.prose h3 { margin-top: 26px; }
.prose h4 { margin-top: 20px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .07em; font-size: 12.5px; }
.prose p { max-width: 68ch; }
.prose strong { font-weight: 660; }
.prose ul, .prose ol { padding-left: 4px; max-width: 68ch; }
.prose li { position: relative; padding-left: 22px; margin-top: 7px; }
.prose ul > li::before {
  content: ""; position: absolute; left: 6px; top: .68em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent-line);
}
.prose ol { counter-reset: li; }
.prose ol > li { counter-increment: li; }
.prose ol > li::before {
  content: counter(li) "."; position: absolute; left: 0; top: 0;
  font-variant-numeric: tabular-nums; font-weight: 650; color: var(--accent); font-size: 14px;
}
.prose .lead-blunt { font-size: 19px; line-height: 1.45; font-weight: 560; letter-spacing: -.01em; }

code, .f {
  font-family: var(--mono); font-size: .875em;
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 5px; padding: 1.5px 5px; white-space: nowrap;
}
.f { color: var(--accent); font-weight: 550; }
.f-blk {
  display: block; white-space: pre-wrap; padding: 11px 13px; border-radius: 9px;
  font-family: var(--mono); font-size: 14px; line-height: 1.55;
  background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--ink);
  overflow-x: auto;
}
kbd {
  font-family: var(--sans); font-size: 12px; font-weight: 620;
  background: var(--surface); border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; white-space: nowrap;
  box-shadow: 0 1px 0 rgba(0,0,0,.04);
}

.callout {
  border-left: 3px solid var(--line); border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--surface-2); padding: 12px 15px; font-size: 15px;
}
.callout .callout-h { font-weight: 660; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; }
.callout p + p { margin-top: 8px; }
.callout-why  { border-color: var(--info);   background: var(--info-soft); }
.callout-why .callout-h { color: var(--info); }
.callout-trap { border-color: var(--bad);    background: var(--bad-soft); }
.callout-trap .callout-h { color: var(--bad); }
.callout-pro  { border-color: var(--good);   background: var(--good-soft); }
.callout-pro .callout-h { color: var(--good); }
.callout-web  { border-color: var(--warn);   background: var(--warn-soft); }
.callout-web .callout-h { color: var(--warn); }
/* an aside, not the main path: the desktop-only shortcut */
.callout-desk { border-color: var(--ink-3); border-left-style: dashed; background: var(--surface-2); }
.callout-desk .callout-h { color: var(--ink-2); }

/* click-by-click step list */
.steps { counter-reset: step; }
.steps li {
  counter-increment: step; position: relative; padding: 9px 0 9px 40px; margin: 0;
  border-top: 1px solid var(--line-soft); font-size: 15.5px;
}
.steps li::before {
  content: counter(step); position: absolute; left: 0; top: 9px;
  width: 25px; height: 25px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12.5px; font-weight: 700; display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.steps li:first-child { border-top: 0; }

/* fake Excel ribbon path, e.g. Home > Editing > Sort & Filter */
.path { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 13.5px; }
.path span {
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 5px; padding: 1px 7px; font-weight: 560;
}
.path i { color: var(--ink-3); font-style: normal; }

/* concept chips shown at lesson head */
.chipset { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  font-size: 12.5px; padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--ink-2); font-weight: 550;
}

/* ============================================================
   In-app spreadsheet grid (practice surface)
   ============================================================ */
.sheet {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); overflow: hidden; box-shadow: var(--shadow);
}
.sheet-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.sheet-addr {
  font-family: var(--mono); font-size: 12.5px; font-weight: 650;
  min-width: 62px; text-align: center; padding: 4px 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.sheet-fx { color: var(--ink-3); font-family: var(--serif); font-style: italic; font-size: 15px; padding: 0 3px; }
.sheet-input {
  flex: 1; font-family: var(--mono); font-size: 13.5px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 9px; min-width: 0;
}
.sheet-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.sheet-scroll { overflow: auto; max-height: 430px; overscroll-behavior: contain; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; }
table.grid th, table.grid td {
  border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
  padding: 0; height: 25px; overflow: hidden;
}
table.grid thead th, table.grid tbody th {
  background: var(--surface-2); color: var(--ink-3);
  font-size: 11px; font-weight: 640; text-align: center;
  position: sticky; z-index: 2; user-select: none;
}
table.grid thead th { top: 0; }
table.grid tbody th { left: 0; z-index: 3; width: 42px; min-width: 42px; }
table.grid thead th:first-child { left: 0; z-index: 4; }
table.grid td { background: var(--surface); cursor: cell; position: relative; }
table.grid td .cv {
  padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 19px; height: 25px;
}
td.num .cv   { text-align: right; font-variant-numeric: tabular-nums; }
td.txt .cv   { text-align: left; }
td.bool .cv  { text-align: center; text-transform: uppercase; letter-spacing: .04em; }
td.err .cv   { text-align: center; color: var(--bad); font-weight: 650; }
/* a long label overflowing into the empty cells beside it, as Excel does */
td.spill { overflow: visible; position: relative; z-index: 1; }
td.spill .cv { overflow: visible; text-overflow: clip; }
td.hdr { background: var(--surface-2); font-weight: 650; color: var(--ink); }
td.hdr .cv { text-align: left; }
td.locked { background: var(--bg-sunk); color: var(--ink-2); }
td.sel { box-shadow: inset 0 0 0 2px var(--accent); z-index: 1; }
td.target { background: color-mix(in srgb, var(--warn-soft) 70%, var(--surface)); }
td.target::after {
  content: ""; position: absolute; inset: 0; border: 1px dashed var(--warn); pointer-events: none;
}
td.ok-cell { background: var(--good-soft); }
td.bad-cell { background: var(--bad-soft); }
table.grid td input.editor {
  position: absolute; inset: -1px; width: calc(100% + 2px); border: 2px solid var(--accent);
  background: var(--surface); font-family: var(--mono); font-size: 12.5px; padding: 0 5px; z-index: 5;
}
.sheet-tabs { display: flex; gap: 3px; padding: 6px 8px; border-top: 1px solid var(--line); background: var(--surface-2); }
.sheet-tabs button {
  font-size: 12.5px; padding: 3px 12px; border-radius: 6px 6px 0 0;
  border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-3); font-weight: 560;
}
.sheet-tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line); border-bottom-color: var(--surface); color: var(--ink); }
.sheet-hint { padding: 7px 10px; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line-soft); }

/* ============================================================
   Quiz, tasks, self-rating, progress, dashboard, modals
   ============================================================ */
.qbox { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.qhead { padding: 12px 18px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; background: var(--surface-2); }
.qbody { padding: 18px; }
.qstem { font-size: 17px; line-height: 1.5; font-weight: 550; }
.qopts { margin-top: 16px; display: grid; gap: 8px; }
.qopt {
  display: flex; gap: 11px; align-items: flex-start; text-align: left; width: 100%;
  padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1.45;
}
.qopt:hover:not(:disabled) { border-color: var(--accent-line); background: var(--accent-soft); }
.qopt .key {
  flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line-soft); font-size: 12px; font-weight: 700; color: var(--ink-3);
}
.qopt.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.qopt.right { border-color: var(--good); background: var(--good-soft); }
.qopt.right .key { background: var(--good); color: #fff; border-color: transparent; }
.qopt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.qopt.wrong .key { background: var(--bad); color: #fff; border-color: transparent; }
.qopt:disabled { cursor: default; }
.qtype { width: 100%; font-family: var(--mono); font-size: 14.5px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.qtype:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.verdict { margin-top: 14px; padding: 13px 15px; border-radius: 10px; font-size: 15px; line-height: 1.55; }
.verdict.v-good { background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.verdict.v-bad  { background: var(--bad-soft);  border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.verdict .vh { font-weight: 680; margin-bottom: 4px; }
.qdots { display: flex; gap: 5px; margin-left: auto; }
.qdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.qdots i.done { background: var(--good); }
.qdots i.miss { background: var(--bad); }
.qdots i.now  { background: var(--accent); transform: scale(1.35); }

/* task checklist */
.tasks li {
  display: flex; gap: 11px; align-items: flex-start; padding: 12px 0;
  border-top: 1px solid var(--line-soft);
}
.tasks li:first-child { border-top: 0; }
.tasks .tbox {
  flex: none; width: 21px; height: 21px; margin-top: 1px; border-radius: 6px;
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
  display: grid; place-items: center; color: transparent; font-size: 13px; font-weight: 800;
}
.tasks .tbox[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.tasks .tmain { flex: 1; min-width: 0; }
.tasks .tcell { font-family: var(--mono); font-size: 12.5px; color: var(--accent); font-weight: 640; }

/* self-rating */
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button {
  padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-size: 13.5px; font-weight: 600; display: grid; gap: 2px; justify-items: center;
}
.rate button small { font-weight: 480; font-size: 11.5px; color: var(--ink-3); }
.rate button[data-r="3"]:hover, .rate button[data-r="3"].on { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.rate button[data-r="2"]:hover, .rate button[data-r="2"].on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.rate button[data-r="1"]:hover, .rate button[data-r="1"].on { background: var(--bad-soft);  border-color: var(--bad);  color: var(--bad); }
.rate button.on small { color: inherit; opacity: .8; }

/* progress bits */
.bar { height: 7px; border-radius: 4px; background: var(--bg-sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .35s ease; }
.stat { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 13px 15px; }
.stat .n { font-size: 27px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

/* module list */
.mods { display: grid; gap: 9px; }
.mod {
  display: flex; gap: 13px; align-items: center; width: 100%; text-align: left;
  padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); cursor: pointer;
}
.mod:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.mod[disabled] { opacity: .5; cursor: not-allowed; background: var(--surface); }
.mod .mnum {
  flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line-soft); font-weight: 700; font-size: 13.5px; color: var(--ink-3);
}
.mod.done .mnum { background: var(--good); border-color: transparent; color: #fff; }
.mod.now .mnum { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.mod .mmain { flex: 1; min-width: 0; display: block; }
.mod .mt { display: block; font-weight: 620; font-size: 15px; line-height: 1.35; }
.mod .ms { display: block; font-size: 13px; color: var(--ink-3); line-height: 1.4; margin-top: 2px; }
.mod .bar { display: block; }

/* heat map */
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 5px; max-width: 520px; }
.heat i { aspect-ratio: 1; border-radius: 5px; background: var(--bg-sunk); display: block; cursor: help; }
.heat-key { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); margin-top: 12px; }
.heat-key i { width: 13px; height: 13px; border-radius: 3px; display: block; }
i[data-m="0"] { background: var(--bg-sunk); }
i[data-m="1"] { background: color-mix(in srgb, var(--accent) 22%, var(--bg-sunk)); }
i[data-m="2"] { background: color-mix(in srgb, var(--accent) 45%, var(--bg-sunk)); }
i[data-m="3"] { background: color-mix(in srgb, var(--accent) 68%, var(--bg-sunk)); }
i[data-m="4"] { background: var(--accent); }

/* modal */
.modal-bg {
  position: fixed; inset: 0; z-index: 90; background: rgba(15,20,17,.5);
  display: grid; place-items: center; padding: 20px; backdrop-filter: blur(2px);
}
.modal-bg[hidden] { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); max-width: 560px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px;
}
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 95; background: var(--ink); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 550;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(-4px); }

/* reference table */
.reftable { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.reftable th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.reftable td { padding: 11px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.reftable tr.locked td { opacity: .4; }
.searchbox { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; }
.searchbox:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* session progress rail */
.rail { display: flex; gap: 4px; margin: 0 0 22px; }
.rail i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.rail i.on { background: var(--accent); }
.rail i.past { background: var(--accent-line); }

@media (max-width: 620px) {
  .topbar { flex-wrap: wrap; padding: 9px 12px; }
  .topnav { width: 100%; margin-left: 0; order: 3; }
  .view { padding: 20px 12px 90px; }
  .card { padding: 15px; border-radius: 12px; }
  h1 { font-size: 24px; }
  .rate { grid-template-columns: 1fr; }
}
@media print { .topbar, .btn, .topnav { display: none !important; } }

/* ============================================================
   Pivot table and charts
   ============================================================ */
.pivot { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.pivot-fields {
  display: flex; flex-wrap: wrap; gap: 10px 16px;
  padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.pv-field { display: flex; flex-direction: column; gap: 3px; min-width: 128px; }
.pv-label { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pv-hint { font-size: 11px; color: var(--ink-3); }
.pv-sel {
  border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
  padding: 5px 8px; font-size: 13.5px; min-width: 128px;
}
.pv-sel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.pivot-out { padding: 12px 14px; }
.pivot-empty { font-size: 14px; color: var(--ink-3); line-height: 1.5; }
table.pivot-table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
table.pivot-table th, table.pivot-table td { padding: 6px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
table.pivot-table tr:first-child th {
  background: var(--surface-2); font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-3); text-align: right; border-bottom: 1px solid var(--line);
}
table.pivot-table tr:first-child th:first-child { text-align: left; }
table.pivot-table th.rowhead { text-align: left; font-weight: 560; }
table.pivot-table td { text-align: right; font-variant-numeric: tabular-nums; }
table.pivot-table td.tot, table.pivot-table th.tot { font-weight: 680; }
table.pivot-table tr.grand th, table.pivot-table tr.grand td {
  border-top: 2px solid var(--line); border-bottom: 0; font-weight: 680; background: var(--surface-2);
}
.pivot-note { margin-top: 10px; font-size: 12px; color: var(--ink-3); }

/* chart specimens used in the lessons */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.chart-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); }
.chart-card h4 { font-size: 12.5px; text-transform: none; letter-spacing: 0; color: var(--ink); margin-bottom: 2px; }
.chart-card p { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; margin-top: 6px; }
.chart-card svg { width: 100%; height: auto; margin-top: 8px; }
.chart-card.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.chart-card.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.chart-verdict { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.chart-card.good .chart-verdict { color: var(--good); }
.chart-card.bad .chart-verdict { color: var(--bad); }

/* capstone rubric */
.rubric { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.rubric th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.rubric td { padding: 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.rubric td:first-child { font-weight: 600; white-space: nowrap; }
.rubric td.pts { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }

</style>
</head>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#155e63"/><path d="M26 26h48v48" stroke="#7fd8c4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M26 26 74 74" stroke="#7fd8c4" stroke-width="9" stroke-linecap="round"/><circle cx="26" cy="26" r="7" fill="#155e63" stroke="#7fd8c4" stroke-width="6"/></svg>

      <span class="brand-name" id="brandName">Gridwright</span><br>

<main>

  <section class="view" id="view-settings" hidden></section>
</main>

<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<a id="dl" style="display:none"></a>

<script>
/* SheetJS and Chart.js are optional enhancements loaded from cdnjs.
   Gridwright is fully usable without them: workbooks fall back to .csv
   and the dashboard falls back to inline SVG. Nothing blocks on them. */
window.__DD_CDN__ = { xlsx: false, chart: false };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
        onload="window.__DD_CDN__.xlsx=true" onerror="window.__DD_CDN__.xlsx=false"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        onload="window.__DD_CDN__.chart=true" onerror="window.__DD_CDN__.chart=false"></script>
<script>
/* ============================================================
   Gridwright core: utilities, persistent state, router
   ============================================================ */
"use strict";

/* ---------- tiny DOM helpers ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "data") for (const d in v) n.dataset[d] = v[d];
    else n.setAttribute(k, v === true ? "" : v);
  }
  if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c == null || c === false) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

/* ---------- numbers, dates, formatting ---------- */
const DAY_MS = 86400000;
function todayISO(d) { return (d || new Date()).toISOString().slice(0, 10); }
function addDays(iso, n) { return new Date(new Date(iso + "T00:00:00Z").getTime() + n * DAY_MS).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / DAY_MS); }
function plural(n, one, many) { return n === 1 ? one : (many || one + "s"); }

/* Round half away from zero, the way Excel ROUND does, and without
   the floating-point drift that (Math.round(x*100)/100) suffers. */
function xround(x, digits) {
  if (!isFinite(x)) return x;
  const f = Math.pow(10, digits || 0);
  const y = x * f;
  const r = Math.sign(y) * Math.round(Math.abs(y) + Number.EPSILON * Math.abs(y));
  return r / f;
}
function fmtNum(n, dp) {
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  return n.toLocaleString("en-GB", { minimumFractionDigits: dp || 0, maximumFractionDigits: dp == null ? 10 : dp });
}
function gbp(n) { return "£" + fmtNum(xround(n, 2), 2); }

/* ---------- seeded randomness (mulberry32) ---------- */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed) {
  let a = typeof seed === "number" ? seed >>> 0 : hashStr(String(seed));
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rInt(r, lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); }
function rPick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
function rShuffle(r, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Weighted pick: items is [[value, weight], ...] */
function rWeighted(r, items) {
  let total = 0; for (const it of items) total += it[1];
  let x = r() * total;
  for (const it of items) { x -= it[1]; if (x <= 0) return it[0]; }
  return items[items.length - 1][0];
}

/* ============================================================
   Persistent state
   ============================================================ */
/* The app is named in one place. Change these two lines and the browser
   tab, the wordmark and the download filenames all follow. */
const APP_NAME = "Gridwright";
const APP_SLUG = "gridwright";

const STORE_KEY = APP_SLUG + ".v1";
const LEGACY_KEYS = ["datadojo.v1"];
const STATE_VERSION = 1;

function blankState() {
  return {
    v: STATE_VERSION,
    created: todayISO(),
    theme: "auto",
    cards: {},          // conceptId -> {box, due, seen, right, wrong, last}
    sessions: {},       // sessionId -> {done, at, quiz:{right,total}, tasks:n, ratings:{}}
    modules: {},        // moduleId -> {completed, at}
    stats: { minutes: 0, sessionsDone: 0, exercisesChecked: 0 },
    fns: {},            // function name -> iso first taught
    prefs: { length: "full", handholding: "auto" },
    drills: [],         // interview drill results
    lastSeen: todayISO()
  };
}

let S = blankState();
let STORAGE_OK = true;

/* Some browsers refuse localStorage on file:// pages, and private
   windows refuse it everywhere. Find out once, at boot, rather than
   discovering it after an hour of work has evaporated. */
function checkStorage() {
  try {
    localStorage.setItem(APP_SLUG + ".probe", "1");
    localStorage.removeItem(APP_SLUG + ".probe");
    STORAGE_OK = true;
  } catch (e) { STORAGE_OK = false; }
  return STORAGE_OK;
}

function saveState() {
  if (!STORAGE_OK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { STORAGE_OK = false; console.warn("Could not save progress:", e); toast("Progress could not be saved in this browser.", 5000); }
}
function loadState() {
  checkStorage();
  let raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
    /* Carry progress over from a previous name of the app rather than
       silently starting somebody from scratch. */
    if (!raw) {
      for (const k of LEGACY_KEYS) {
        const old = localStorage.getItem(k);
        if (old) { raw = old; localStorage.setItem(STORE_KEY, old); break; }
      }
    }
  } catch (e) { /* storage blocked */ }
  if (!raw) { S = blankState(); return; }
  try {
    const parsed = JSON.parse(raw);
    S = Object.assign(blankState(), parsed);
    S.stats = Object.assign(blankState().stats, parsed.stats || {});
    S.prefs = Object.assign(blankState().prefs, parsed.prefs || {});
  } catch (e) { console.warn("Saved progress was unreadable, starting fresh."); S = blankState(); }
}
function resetState() { S = blankState(); saveState(); }

/* ---------- theme ---------- */
function applyTheme() {
  const t = S.theme || "auto";
  document.documentElement.setAttribute("data-theme", t === "auto" ? "auto" : t);
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
}
function cycleTheme() {
  const order = ["auto", "light", "dark"];
  S.theme = order[(order.indexOf(S.theme || "auto") + 1) % 3];
  applyTheme(); saveState();
  toast("Theme: " + S.theme);
}

/* ---------- toast + modal ---------- */
let toastTimer = null;
function toast(msg, ms) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), ms || 2400);
}
function openModal(build) {
  const bg = $("#modalBg"), m = $("#modal");
  clear(m); build(m, closeModal);
  bg.hidden = false;
  const first = m.querySelector("button, input, a"); if (first) first.focus();
}
function closeModal() { $("#modalBg").hidden = true; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modalBg").hidden) closeModal(); });

/* ============================================================
   Router
   ============================================================ */
const VIEWS = {
  home:      { id: "view-home",      label: "Home" },
  session:   { id: "view-session",   label: "Session", hideNav: true },
  review:    { id: "view-review",    label: "Review" },
  progress:  { id: "view-progress",  label: "Progress" },
  reference: { id: "view-reference", label: "Reference" },
  drill:     { id: "view-drill",     label: "Drill" },
  settings:  { id: "view-settings",  label: "Settings" }
};
let currentView = "home";
let routeArg = null;

function go(view, arg) {
  currentView = view; routeArg = arg || null;
  for (const k in VIEWS) $("#" + VIEWS[k].id).hidden = (k !== view);
  renderNav();
  const r = RENDERERS[view];
  if (r) r($("#" + VIEWS[view].id), routeArg);
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function renderNav() {
  const nav = clear($("#nav"));
  const due = dueCount();
  for (const k in VIEWS) {
    const v = VIEWS[k];
    if (v.hideNav) continue;
    if (k === "drill" && !drillUnlocked()) continue;
    const b = el("button", { onclick: () => go(k) }, [v.label]);
    if (k === currentView) b.setAttribute("aria-current", "page");
    if (k === "review" && due > 0) b.appendChild(el("span", { class: "pip", text: String(due) }));
    nav.appendChild(b);
  }
}

const RENDERERS = {}; // filled in by view modules

/* ============================================================
   Leitner spaced repetition
   Boxes 1..5 with intervals 1, 3, 7, 16, 35 days.
   A correct answer promotes one box. A wrong answer drops to box 1,
   due again the same day. Box 6 means retired: mastered, still
   sampled occasionally so it does not rot.
   ============================================================ */
const LEITNER_INTERVALS = [0, 1, 3, 7, 16, 35, 90];

/* CONCEPTS is populated by the curriculum modules:
   { id, label, module, blurb } */
const CONCEPTS = {};
function defConcepts(moduleId, list) {
  list.forEach(c => { CONCEPTS[c.id] = Object.assign({ module: moduleId }, c); });
}

function card(id) {
  if (!S.cards[id]) S.cards[id] = { box: 0, due: todayISO(), seen: 0, right: 0, wrong: 0, last: null };
  return S.cards[id];
}
function cardExists(id) { return !!S.cards[id]; }

/* Introduce a concept the first time it is taught. */
function introduceConcept(id) {
  if (!CONCEPTS[id]) return;
  const c = card(id);
  if (c.box === 0) { c.box = 1; c.due = addDays(todayISO(), 1); }
}

/* Record an attempt. correct = true/false. Returns the updated card. */
function gradeCard(id, correct) {
  if (!CONCEPTS[id]) return null;
  const c = card(id);
  c.seen++;
  c.last = todayISO();
  if (correct) {
    c.right++;
    c.box = Math.min(6, Math.max(1, c.box) + 1);
  } else {
    c.wrong++;
    c.box = 1;
  }
  c.due = addDays(todayISO(), LEITNER_INTERVALS[c.box]);
  saveState();
  return c;
}

/* The three-way self-rating after a lesson feeds the same cards.
   3 = I got it, 2 = shaky, 1 = lost. */
function rateConcept(id, r) {
  if (!CONCEPTS[id]) return;
  const c = card(id);
  c.last = todayISO();
  if (r === 3) c.box = Math.min(6, Math.max(1, c.box) + 1);
  else if (r === 2) c.box = Math.max(1, c.box);
  else c.box = 1;
  c.due = addDays(todayISO(), LEITNER_INTERVALS[c.box]);
  saveState();
}

function dueCards(onDate) {
  const d = onDate || todayISO();
  return Object.keys(S.cards)
    .filter(id => CONCEPTS[id] && S.cards[id].box > 0 && S.cards[id].due <= d)
    .sort((a, b) => (S.cards[a].box - S.cards[b].box) || (S.cards[a].due < S.cards[b].due ? -1 : 1));
}
function dueCount() { return dueCards().length; }

/* Rank every concept you have met, weakest first. A low box always

    .filter(id => CONCEPTS[id] && S.cards[id].box > 0)
    .map(id => {

/* ============================================================
   Formula engine: values, tokenizer, parser, evaluator.

   Deliberately close to real Excel semantics, because a learning
   tool that accepts a formula Excel would reject teaches a lie.
   Covered: operator precedence including unary minus above ^,
   error propagation, Excel comparison ordering (number < text <
   FALSE < TRUE), blank-as-zero, 1900 date serials, and wildcards
   in criteria arguments.
   ============================================================ */

/* ---------- error values ---------- */
const ERR = {
  VALUE: "#VALUE!", REF: "#REF!", DIV0: "#DIV/0!", NAME: "#NAME?",

/* ---------- ranges ---------- */
function isRange(v) { return v !== null && typeof v === "object" && v.rng === true; }

        if (typeof v === "number") out.push(v);
        else if (isErr(v)) return v;
      }
    } else {
      if (isErr(a)) return a;
      if (a === null) continue;
      const n = toNum(a);
      if (isErr(n)) return n;

/* ---------- coercion ---------- */
const NUMRE = /^\s*[-+]?(\d{1,3}(,\d{3})+|\d*)(\.\d+)?\s*$/;

  if (isErr(v)) return v;
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v;
  if (typeof v === "boolean") return v ? 1 : 0;
  if (typeof v === "string") {
    let s = v.trim();
    if (s === "") return 0;
    let pct = false;
    if (s.endsWith("%")) { pct = true; s = s.slice(0, -1).trim(); }
    let cur = false;
    if (/^[£$€]/.test(s)) { cur = true; s = s.slice(1).trim(); }

  if (typeof v === "number") return numToGeneral(v);

}
function toBool(v) {

  if (typeof v === "boolean") return v;

/* ---------- Excel comparison ordering ---------- */
/* number(0) < text(1) < FALSE(2) < TRUE(3) */
function typeRank(v) {

  if (b === null) b = typeof a === "number" ? 0 : (typeof a === "boolean" ? false : "");

  if (ra !== rb) return ra < rb ? -1 : 1;
  if (ra === 0) return a === b ? 0 : (a < b ? -1 : 1);

/* ---------- dates: Excel 1900 serial system ---------- */
const EPOCH = Date.UTC(1899, 11, 30);

/* ============================================================
   Tokenizer
   ============================================================ */
const T = { NUM: "num", STR: "str", BOOL: "bool", ERR: "err", REF: "ref", NAME: "name", OP: "op", LP: "(", RP: ")", COMMA: ",", COLON: ":" };

function tokenize(src) {
  const t = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\n" || c === "\r") { i++; continue; }
    // string
    if (c === '"') {
      let j = i + 1, out = "";
      while (j < n) {
        if (src[j] === '"') {
          if (src[j + 1] === '"') { out += '"'; j += 2; continue; }
          break;
        }
        out += src[j++];
      }
      if (j >= n) throw new FormulaError("A quotation mark is not closed.");
      t.push({ k: T.STR, v: out }); i = j + 1; continue;
    }
    // error literal
    if (c === "#") {
      const up = src.slice(i).toUpperCase();
      const hit = ERR_LIST.find(e => up.startsWith(e));
      if (hit) { t.push({ k: T.ERR, v: hit }); i += hit.length; continue; }
      throw new FormulaError("Unknown error value starting at '#'.");
    }
    // number
    if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
      let j = i;
      while (j < n && /[0-9]/.test(src[j])) j++;
      if (src[j] === ".") { j++; while (j < n && /[0-9]/.test(src[j])) j++; }
      if (/[eE]/.test(src[j] || "")) {
        let k = j + 1;
        if (/[+\-]/.test(src[k] || "")) k++;
        if (/[0-9]/.test(src[k] || "")) { k++; while (k < n && /[0-9]/.test(src[k])) k++; j = k; }
      }
      t.push({ k: T.NUM, v: parseFloat(src.slice(i, j)) }); i = j; continue;
    }
    // operators
    const two = src.substr(i, 2);
    if (two === "<=" || two === ">=" || two === "<>") { t.push({ k: T.OP, v: two }); i += 2; continue; }
    if ("+-*/^&=<>%".includes(c)) { t.push({ k: T.OP, v: c }); i++; continue; }
    if (c === "(") { t.push({ k: T.LP }); i++; continue; }
    if (c === ")") { t.push({ k: T.RP }); i++; continue; }
    if (c === "," || c === ";") { t.push({ k: T.COMMA }); i++; continue; }
    if (c === ":") { t.push({ k: T.COLON }); i++; continue; }

function FormulaError(msg) { this.message = msg; this.isFormulaError = true; }

function colToIndex(letters) {

/* ============================================================

function parseFormula(src) {

  const next = () => toks[p++];

    let left = parseConcat();
    while (at(T.OP) && ["=", "<>", "<", ">", "<=", ">="].includes(peek().v)) {

    case "missing": return null;
    case "name": return mkErr(ERR.NAME);
    case "ref": {
      const t = node.t;
      if (t.row < 0 || t.col < 0) return mkErr(ERR.REF);
      return ctx.get(t.row, t.col);

    case "range": {

      }
      return mkRange(cells, r1, c1, r2, c2);
    }
    case "pct": {
      const v = evalAst(node.a, ctx);
      return mapVal(v, x => { const n = toNum(x); return isErr(n) ? n : n / 100; });
    }
    case "unop": {
      const v = evalAst(node.a, ctx);

    case "fn": return evalFn(node, ctx);

/* A range used where a single value is expected collapses to its

function binop(a, b, op) {
  const e = firstErr(a, b); if (e) return e;
  if (op === "&") {
    const x = toText(a), y = toText(b);
    const e2 = firstErr(x, y); if (e2) return e2;
    return x + y;
  }
  if (["=", "<>", "<", ">", "<=", ">="].includes(op)) {
    const c = cmpValues(a, b);

      case "=": return c === 0; case "<>": return c !== 0;
      case "<": return c < 0; case ">": return c > 0;
      case "<=": return c <= 0; case ">=": return c >= 0;

    ctx,
    raw: node.args,
    ev: i => (node.args[i] === undefined ? undefined : evalAst(node.args[i], ctx)),
    evs: i => (node.args[i] === undefined ? undefined : scalar(evalAst(node.args[i], ctx))),
    n: node.args.length

  for (const v of vals) if (isErr(v)) return v;
  return def.fn(vals, helper);

/* ============================================================
   Reference shifting: what happens when a formula is filled or
   copied. A reference with no dollar sign moves with the formula;
   one with a dollar sign in front of that part stays put. This is
   the whole of Module 2 Session 3 in twenty lines.
   ============================================================ */
const REF_RE = /^(\$?)([A-Za-z]{1,3})(\$?)([0-9]{1,7})(?![A-Za-z0-9_.(])/;

function offsetFormula(src, dr, dc) {
  const s = String(src);
  let out = "", i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === '"') {                        // never rewrite inside a text literal
      let j = i + 1;
      while (j < s.length) {
        if (s[j] === '"') { if (s[j + 1] === '"') { j += 2; continue; } break; }
        j++;
      }
      out += s.slice(i, Math.min(j + 1, s.length));
      i = j + 1; continue;
    }
    const prev = i > 0 ? s[i - 1] : "";
    if (/[A-Za-z_$0-9.]/.test(prev) === false || i === 0) {
      const m = REF_RE.exec(s.slice(i));
      if (m) {
        const absC = m[1] === "$", absR = m[3] === "$";
        let col = colToIndex(m[2]), row = parseInt(m[4], 10) - 1;
        if (!absC) col += dc;
        if (!absR) row += dr;
        if (col < 0 || row < 0) { out += ERR.REF; i += m[0].length; continue; }
        out += (absC ? "$" : "") + indexToCol(col) + (absR ? "$" : "") + (row + 1);
        i += m[0].length; continue;
      }

    out += c; i++;

/* ---------- public: compute a formula string against a context ---------- */
function computeFormula(src, ctx) {
  let body = String(src).trim();
  if (body.startsWith("=")) body = body.slice(1);
  if (body === "") return null;
  let ast;
  try { ast = parseFormula(body); }
  catch (e) { if (e && e.isFormulaError) return { parseError: e.message }; throw e; }
  try { return evalAst(ast, ctx); }
  catch (e) {
