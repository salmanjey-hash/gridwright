    { h: "Three: the key is dirty on the master side" },
    { p: "Exactly the same symptom, and TRIM on the lookup value does nothing, because the fault is in the table you are searching. This one catches people for a long time, because the obvious fix has already been applied and appears not to work." },
    { p: "The answer is to clean the master. Add a helper column beside it holding a trimmed copy of the code, and point the lookup at that instead of the original." },
    { why: "Which is the general lesson of this session: when a join fails, the fault can be on either side of it, and the side you did not clean is the one you will not think of. Clean both, then join. Module 4 comes before Module 5 for exactly this reason." },
    { h: "Telling them apart quickly" },
    { p: "Take one failing code and search for it in the master with COUNTIF." },
    { f: "=COUNTIF($A$17:$A$23, C5)          0 means no match\n=COUNTIF($A$17:$A$23, \"*\"&TRIM(C5)&\"*\")   1 means it is there, but not cleanly" },
    { p: "If the first is 0 and the second is 1, the value exists and one side is dirty. If both are 0, it genuinely is not there. That is a thirty-second diagnosis and it saves an hour of guessing." },
    { h: "IFNA rather than IFERROR" },
    { p: "If you must wrap a lookup, wrap it in IFNA. It catches only #N/A and lets a genuine #REF! or #VALUE! still show, so a mistyped range still announces itself instead of being swallowed by your tidy message." },
    { trap: "Wrapping a lookup in IFERROR while you are still building it will hide a broken range as willingly as a missing key, and you will spend an afternoon wondering why every row says not on file." },
    { web: "No difference in Excel for the web." },
    { desk: "Power Query's Merge Queries will not silently drop unmatched rows if you choose a Left Outer join, and it shows you the match count for each step, which makes this class of problem visible before you have written anything. It is worth the twenty minutes once you meet a join that will run every month." }
  ],
  reflect: [
    "Name the three causes of #N/A and the fix for each.",
    "Which of the three does TRIM on the lookup value not solve?"
  ],

  practice: function (seed) {
    const r = rng(seed);
    const n = 10;
    /* master with one dirty code, so the fault sits on the far side of the join */
    const codes = M5_MASTER.map(m => m.code);
    const dirtyMasterIdx = 4;
    codes[dirtyMasterIdx] = M5_MASTER[dirtyMasterIdx].code + " ";

    const rows = [];
    for (let i = 0; i < n; i++) {
      const m = M5_MASTER[i % M5_MASTER.length];
      rows.push({ ref: "TX-" + (8300 + i), code: m.code, amount: xround(rInt(r, 4000, 190000) / 100, 2) });
    }
    /* plant the three faults on known rows */
    rows[2].code = M5_MASTER[0].code + " ";   // row 4: trailing space on the transaction side
    rows[5].code = "SUP-999";                 // row 7: genuinely not in the master
    rows[7].code = M5_MASTER[dirtyMasterIdx].code;  // row 9: clean here, dirty in the master

    const sh = new Sheet("Failures", 28, 6);
    ["Ref", "Code", "Amount", "Supplier"].forEach((h, i) => sh.set(0, i, h, { hdr: true, locked: true }));
    rows.forEach((t, i) => {
      sh.set(1 + i, 0, t.ref, { locked: true });
      sh.set(1 + i, 1, t.code, { locked: true });
      sh.set(1 + i, 2, t.amount, { fmt: GBP2, locked: true });
    });

    const mStart = n + 4;
    const m = writeMaster(sh, mStart, codes, "Clean code");
    const cleanCol = "$D$" + m.first + ":$D$" + m.last;
    const mName = "$B$" + m.first + ":$B$" + m.last;

    const answers = [];
    for (let i = 0; i < n; i++) answers.push("D" + (2 + i));
    for (let i = m.first; i <= m.last; i++) answers.push("D" + i);
    lockSheet(sh, answers);
    sh.rows = m.last + 2; sh.cols = 6;

    const nameOf = c => { const f = M5_MASTER.find(x => x.code === String(c).trim()); return f ? f.name : "not on file"; };

    return {
      sheet: sh,
      maxRows: sh.rows, maxCols: 6, startRow: 1, startCol: 3,
      formatBar: false, fillBar: true,
      highlight: answers,
      brief: {
        title: "Ten payments, three of which will not match",
        body: "Write the lookup and three rows come back #N/A, for three different reasons. One code has a trailing space. " +
          "One supplier is genuinely not in the master. And one master entry is itself dirty, so the transaction is clean and the match still fails. " +
          "Build the clean-code helper column in the master first, then write a single lookup that survives all three."
      },
      hint: "Scroll down in the grid to the master. Its column D is empty and waiting for a trimmed copy of the code. Point your lookup at that, not at column A.",
      tasks: [
        { id: "t1", text: "In the master's Clean code column, cell D" + m.first + ", produce a trimmed copy of the code beside it. Fill down through the master.", cell: "D" + m.first },
        { id: "t2", text: "Check the bottom of that helper column.", cell: "D" + m.last },
        { id: "t3", text: "In D2, look the supplier up against the clean code column, trimming the transaction's code as well, and returning <strong>not on file</strong> when nothing matches. Fill down to D11.", cell: "D2" },
        { id: "t4", text: "Row 4 has a trailing space in its code. Confirm it now matches.", cell: "D4" },
        { id: "t5", text: "Row 7 is a supplier that does not exist in the master. Confirm it reads not on file.", cell: "D7" },
        { id: "t6", text: "Row 9 is clean, but its master entry is not. Confirm it matches now that you are looking at the cleaned column.", cell: "D9", ext: true }
      ],
      checks: [
        {
          cell: "D" + m.first, expect: M5_MASTER[0].code, needFormula: true, mustUse: "TRIM",
          task: "The first clean code in the master.",
          answer: "=TRIM(A" + m.first + ")",
          why: "A trimmed copy of the master's key, in a helper column beside it. This is the Module 4 habit: never clean in place, and keep the original so you can prove what changed.",
          wrongWay: "Editing the master's code column directly to remove the space. It works and it destroys the evidence that the reference data was wrong, which is the thing somebody actually needs to fix."
        },
        {
          cell: "D" + m.last, expect: M5_MASTER[M5_MASTER.length - 1].code, needFormula: true, mustUse: "TRIM",
          task: "The last clean code in the master.",
          answer: "=TRIM(A" + m.last + ")",
          why: "Filled down the whole master. Compare column A against column D and you can see exactly which entry was damaged.",
          wrongWay: "Filling only as far as the row you happened to be looking at. A join searches the whole table, so the helper has to cover the whole table."
        },
        {
          cell: "D2", expect: nameOf(rows[0].code), needFormula: true, mustUseAll: ["XLOOKUP", "TRIM"],
          task: "D2: the supplier, looked up robustly.",
          answer: '=XLOOKUP(TRIM(B2),' + cleanCol + ',' + mName + ',"not on file")',
          why: "Four things at once: trim the key on this side, search the cleaned key on the other side, return the name, and say something useful when there is no match. One formula, all three failure modes handled.",
          wrongWay: "Building it without the fourth argument and then wrapping the whole thing in IFERROR. That works and it also hides a mistyped range, which is the error you most need to see while you are still writing the formula."
        },
        {
          cell: "D4", expect: nameOf(rows[2].code), needFormula: true, mustUseAll: ["XLOOKUP", "TRIM"],
          task: "D4: the row whose own code had a trailing space.",
          answer: '=XLOOKUP(TRIM(B4),' + cleanCol + ',' + mName + ',"not on file")',
          why: "The code in B4 reads " + M5_MASTER[0].code + " and is not, because of a space you cannot see. TRIM on the lookup value fixes this one. Check it with <span class='f'>=LEN(B4)</span> against <span class='f'>=LEN(TRIM(B4))</span> if you want to see the evidence.",
          wrongWay: "Retyping the code in B4. That fixes one row of a file you will receive again next month with the same fault."
        },
        {
          cell: "D7", expect: "not on file", needFormula: true, mustUse: "XLOOKUP",
          task: "D7: the supplier that is genuinely missing.",
          answer: '=XLOOKUP(TRIM(B7),' + cleanCol + ',' + mName + ',"not on file")',
          why: "SUP-999 is not in the master at all, and no amount of trimming will find it. The formula is correct and the reference data is incomplete. The right response is to report it, and the message keeps it visible while you do.",
          wrongWay: "Returning a blank or a zero instead of a message. A blank is indistinguishable from a row nobody has filled in yet, and this row needs somebody to act on it."
        },
        {
          cell: "D9", ext: true, expect: nameOf(rows[7].code), needFormula: true, mustUseAll: ["XLOOKUP", "TRIM"],
          task: "D9: the row that was clean all along.",
          answer: '=XLOOKUP(TRIM(B9),' + cleanCol + ',' + mName + ',"not on file")',
          why: "This is the one that teaches the session. The transaction code was always correct; the master entry carried the trailing space. TRIM on the lookup value alone would still fail here, and the only fix is the cleaned helper column on the master side. When a join fails, check both sides.",
          wrongWay: "Concluding the code is wrong because the lookup failed, and editing the transaction to match the damaged master. That propagates the fault into your data instead of out of it."
        }
      ]
    };
  },
  workbook: function (seed) { const wb = new Workbook("M5S2"); wb.add(M5S2.practice(seed).sheet); return wb; }
};

    { h: "Flaw three: the last argument is optional and defaults to the dangerous value" },

    { trap: "Never omit the final FALSE on a normal lookup. Not once, not for a quick check. Every VLOOKUP you write should end in <span class='f'>,FALSE)</span> and every VLOOKUP you inherit should be checked for it." },

    { why: "Approximate matching is not a bug. It is a feature with one legitimate use and a default that applies it everywhere else. Write TRUE deliberately when you mean banding, and FALSE explicitly every other time." },
    { h: "INDEX and MATCH, once" },
    { f: "=INDEX($B$17:$B$23, MATCH(C2, $A$17:$A$23, 0))" },
    { p: "MATCH finds the position of the code within the code column. INDEX returns the value at that position in the name column. Read it inside out: work out which row, then fetch from that row." },
    { p: "It does everything VLOOKUP does without any of the three flaws, because the two ranges are independent, so it can look left and it does not break when a column is inserted. For twenty years it was the right answer, and every experienced user can read it." },
    { pro: "Write XLOOKUP. Learn to read INDEX and MATCH because inherited workbooks are full of it. Learn VLOOKUP because you will be asked to write one at an interview, and when you do, add the FALSE and mention why you would normally use XLOOKUP. That answer is better than the formula." },

  ],
  reflect: [

  /* --- m1.range --- */
  {

/* ============================================================
   Module 6: Pivot tables
   The highest-value skill in the course. The practice sessions
   drive a real pivot table with the same four field areas Excel
   has, then ask you to read the answer off it.
   ============================================================ */

const M6_FIELDS = [
  { name: "Supplier", type: "text" },
  { name: "City", type: "text" },
  { name: "Category", type: "text" },
  { name: "Date", type: "date" },
  { name: "Amount", type: "number", money: true }
];

function m6Data(seed, n) {
  return txRows(seed, n || 60).map(t => ({
    Ref: t.ref, Supplier: t.supplier, City: t.city,
    Category: t.category, Date: t.date, Amount: t.amount
  }));
}
/* Put the same records on a sheet, so the answer cells sit beside real data. */
function m6Sheet(recs, answerLabels) {
  const sh = new Sheet("Data", recs.length + 12, 6);
  ["Ref", "Supplier", "City", "Category", "Date", "Amount"].forEach((h, i) => sh.set(0, i, h, { hdr: true, locked: true }));
  recs.forEach((t, i) => {
    sh.set(1 + i, 0, t.Ref, { locked: true });
    sh.set(1 + i, 1, t.Supplier, { locked: true });
    sh.set(1 + i, 2, t.City, { locked: true });
    sh.set(1 + i, 3, t.Category, { locked: true });
    sh.set(1 + i, 4, t.Date, { fmt: DATEFMT, locked: true });
    sh.set(1 + i, 5, t.Amount, { fmt: GBP2, locked: true });
  });
  const base = recs.length + 3;
  label(sh, "A" + base, "Answers");
  const cells = [];
  answerLabels.forEach((lb, i) => {
    note(sh, "A" + (base + 1 + i), lb);
    cells.push("C" + (base + 1 + i));
  });
  sh.rows = base + answerLabels.length + 2;
  sh.cols = 6;
  return { sheet: sh, cells: cells };
}

/* ---------- small SVG specimens for the lessons ---------- */
function specimen(kind) {
  const A = "var(--accent)", L = "var(--line)", M = "var(--ink-3)";
  const bar = (vals, w, h) => {
    const max = Math.max.apply(null, vals), bw = w / vals.length;
    return vals.map((v, i) =>
      '<rect x="' + (i * bw + bw * 0.18) + '" y="' + (h - (v / max) * h) + '" width="' + (bw * 0.64) +
      '" height="' + ((v / max) * h) + '" rx="2" fill="' + A + '"/>').join("");
  };
  const line = (vals, w, h) => {
    const max = Math.max.apply(null, vals), step = w / (vals.length - 1);
    const pts = vals.map((v, i) => (i * step) + "," + (h - (v / max) * h)).join(" ");
    return '<polyline points="' + pts + '" fill="none" stroke="' + A + '" stroke-width="2.5" stroke-linejoin="round"/>';
  };
  const scatter = (pts, w, h) => pts.map(p =>
    '<circle cx="' + (p[0] * w) + '" cy="' + (h - p[1] * h) + '" r="3.2" fill="' + A + '" opacity=".75"/>').join("");
  const pie = (parts, cx, cy, r) => {
    let a0 = -Math.PI / 2, out = "";
    const tot = parts.reduce((a, b) => a + b, 0);
    parts.forEach((p, i) => {
      const a1 = a0 + (p / tot) * Math.PI * 2;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      out += '<path d="M' + cx + ' ' + cy + ' L' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 ' +
        ((a1 - a0) > Math.PI ? 1 : 0) + ' 1 ' + x1 + ' ' + y1 + ' Z" fill="' + A + '" opacity="' + (1 - i * 0.17) + '"/>';
      a0 = a1;
    });
    return out;
  };
  const frame = inner => '<svg viewBox="0 0 200 96" role="img"><g transform="translate(6,6)">' + inner + '</g></svg>';
  const axis = '<line x1="0" y1="84" x2="188" y2="84" stroke="' + L + '" stroke-width="1"/>';

  switch (kind) {
    case "bar": return frame(axis + '<g transform="translate(0,0)">' + bar([62, 88, 45, 71, 30], 188, 84) + "</g>");
    case "line": return frame(axis + line([30, 42, 38, 61, 55, 78, 90], 188, 84));
    case "scatter": return frame(axis + scatter([[.08, .18], [.2, .3], [.3, .27], [.42, .5], [.5, .44], [.62, .66], [.7, .61], [.82, .8], [.92, .86]], 188, 84));
    case "pie": return frame(pie([32, 27, 22, 19], 94, 44, 40));
    case "bar-truncated": return frame(axis +
      '<g>' + [88, 90, 86, 92].map((v, i) =>
        '<rect x="' + (i * 47 + 9) + '" y="' + (84 - (v - 84) * 10) + '" width="30" height="' + ((v - 84) * 10) + '" rx="2" fill="' + A + '"/>').join("") + "</g>" +
      '<text x="0" y="94" font-size="9" fill="' + M + '">axis starts at 84</text>');
    case "bar-zero": return frame(axis +
      '<g>' + [88, 90, 86, 92].map((v, i) =>
        '<rect x="' + (i * 47 + 9) + '" y="' + (84 - (v / 100) * 84) + '" width="30" height="' + ((v / 100) * 84) + '" rx="2" fill="' + A + '"/>').join("") + "</g>" +
      '<text x="0" y="94" font-size="9" fill="' + M + '">axis starts at 0</text>');
  }
  return "";
}
function chartCards(list) {
  const grid = el("div", { class: "chart-grid" });
  list.forEach(c => {
    const card = el("div", { class: "chart-card" + (c.verdict ? " " + c.verdict : "") });
    if (c.verdict) card.appendChild(el("div", { class: "chart-verdict", text: c.verdict === "good" ? "use this" : "avoid" }));
    card.appendChild(el("h4", { text: c.title }));
    card.appendChild(el("div", { html: specimen(c.kind) }));
    card.appendChild(el("p", { html: c.note }));
    grid.appendChild(card);
  });
  return grid;
}

/* A summary sheet with no source rows, for the judgement sessions. */
function m7SummarySheet(recs, answerLabels) {
  const sh = new Sheet("Work", answerLabels.length + 8, 6);
  label(sh, "A1", "Answers");
  const cells = [];
  answerLabels.forEach((lb, i) => {
    note(sh, "A" + (2 + i), lb);
    cells.push("C" + (2 + i));
  });
  sh.rows = answerLabels.length + 4;
  sh.cols = 6;
  return { sheet: sh, cells };
}

          [xround(rInt(r, 1200, 60000) / 100, 2), 7],
          [xround(rInt(r, 60000, 300000) / 100, 2), 2],
          [xround(rInt(r, 300000, 1400000) / 100, 2), 1]
        ])
      });

    /* the planted faults, in known quantities so the answer key is exact */
    const nUnmatched = 31, nTextAmount = 24, nSpaces = 40;
    for (let i = 0; i < nUnmatched; i++) recs[i * 13 % 500].Code = "SUP-9" + (10 + i % 80);

    const total = xround(recs.reduce((a, b) => a + b.Amount, 0), 2);
    const matched = recs.filter(x => M5_MASTER.some(m => m.code === x.Code));
    const matchedTotal = xround(matched.reduce((a, b) => a + b.Amount, 0), 2);
    const unmatchedCount = recs.length - matched.length;
    const unmatchedTotal = xround(total - matchedTotal, 2);

    const sorted = recs.slice().sort((a, b) => b.Amount - a.Amount);
    const top5 = xround(sorted.slice(0, 5).reduce((a, b) => a + b.Amount, 0), 2);

      tasks: [

        { id: "t6", text: "That city's share of matched spend, to one decimal place.", cell: cells[5] },

      ],
      checks: [

          wrongWay: "Assuming the file is the size you were told. Count it."

    /* the damaged transaction log */
    const tx = new Sheet("Transactions", recs.length + 4, 6);
    ["Ref", "Supplier code", "City", "Category", "Date", "Amount"].forEach((h, i) => tx.set(0, i, h, { hdr: true }));
    recs.forEach((t, i) => {
      const row = 1 + i;
      tx.set(row, 0, t.Ref);
      tx.set(row, 1, rWeighted(r, [[t.Code, 8], [t.Code + " ", 2], [" " + t.Code, 1], [t.Code.toLowerCase(), 1]]));
      tx.set(row, 2, rWeighted(r, [[t.City, 8], [t.City.toUpperCase(), 1], [t.City + " ", 1]]));
      tx.set(row, 3, t.Category);
      if (r() < 0.12) tx.set(row, 4, formatDate(t.Date, "dd/mm/yyyy"));
      else tx.set(row, 4, t.Date, { fmt: DATEFMT });
      if (r() < 0.05) tx.set(row, 5, "£" + t.Amount.toFixed(2));
      else if (r() < 0.05) tx.set(row, 5, t.Amount.toFixed(2) + " ");
      else tx.set(row, 5, t.Amount, { fmt: GBP2 });
    });
    tx.rows = recs.length + 1; tx.cols = 6;
    wb.add(tx);

    /* the supplier master, itself slightly dirty */
    const ms = new Sheet("Suppliers", M5_MASTER.length + 4, 4);
    ["Code", "Supplier", "City", "Risk"].forEach((h, i) => ms.set(0, i, h, { hdr: true }));

      ms.set(1 + i, 2, ["Leeds", "London", "Bristol", "Manchester", "Newcastle"][i % 5]);
      ms.set(1 + i, 3, m.risk);
    });
    ms.rows = M5_MASTER.length + 1; ms.cols = 4;
    wb.add(ms);
    return wb;
  }
};

    trap: 'Quoting the 500. <span class="f">=IF(E2>"500",...)</span> compares a number against text, and text always ranks above numbers in Excel, so every row returns OK.'
  },

  /* --- m3.quotes --- */
  {
    c: "m3.quotes", t: "pred",
    q: "C2 contains the text Leeds. What does this return?",
    formula: '=IF(C2=Leeds,1,0)',
    opts: ["1", "0", "#NAME?", "#VALUE!"],
    a: 2,
    why: "Without quotation marks Excel looks for something named Leeds, finds nothing, and returns #NAME?. Text inside a formula is always quoted.",
    trap: "It looks completely reasonable written down, which is why this is one of the two most common causes of #NAME?."
  },
  {
    c: "m3.quotes", t: "mc",
    q: 'What does <span class="f">""</span> mean inside a formula?',
    opts: ["A space", "Empty text", "A blank cell", "An error"],
    a: 1,
    why: "Two quotation marks with nothing between them mean empty text, which makes a cell look blank. It is not the same as a blank cell: the cell contains a formula, so COUNTA still counts it and ISBLANK says it is not blank.",
    trap: "Assuming a cell that looks empty is empty. This catches people in Module 4 when they go looking for gaps."
  },

  /* --- m3.compareop --- */
  {
    c: "m3.compareop", t: "mc",
    q: "A rule says payments over £500 go for review. A payment of exactly £500 arrives. Which operator is correct?",
    opts: ["=E2>500", "=E2>=500", "=E2<500", "=E2<>500"],
    a: 0,
    why: "Over £500 excludes £500 itself, so it is greater-than. If the rule was meant to include it, the rule should have said £500 and above, and you should ask rather than guess.",
    trap: "This is one row in a hundred and it is always the row somebody queries. Write down which reading you used."
  },
  {
    c: "m3.compareop", t: "mc",
    q: 'Which operator means "not equal to"?',
    opts: ["!=", "><", "<>", "=/="],
    a: 2,
    why: "Excel writes it as less-than followed by greater-than. Other languages use an exclamation mark; Excel does not.",
    trap: "Typing != , which Excel rejects outright rather than misinterpreting, so at least it fails loudly."
  },

  /* --- m3.ifnumber --- */
  {
    c: "m3.ifnumber", t: "mc",
    q: "You will need to count how many rows were flagged, and chart the flag rate by month. What should your IF return?",
    opts: ['"Yes" and "No"', "1 and 0", '"Flagged" and ""', "TRUE and FALSE"],
    a: 1,
    why: "A column of 1s and 0s can be summed to count the flags and averaged to get the rate directly. Words need a COUNTIF wrapped round them before they can do anything.",
    trap: 'Returning "" for the false case. It looks tidy and makes the column half text, which breaks averages and counts in ways that are hard to spot.'
  },
  {
    c: "m3.ifnumber", t: "pred",
    q: "A column of twenty cells each contains =IF(E2>500,1,0). What does AVERAGE over that column give you?",
    formula: "=AVERAGE(F2:F21)",
    opts: ["The average payment", "The proportion of payments over 500", "The count of payments over 500", "An error"],
    a: 1,
    why: "The mean of a column of ones and zeros is the proportion that are one. It is a genuinely useful trick and it only works if the IF returns numbers.",
    trap: "Reaching for a more complicated formula. Averaging a flag column is the shortest route to a rate."
  },

  /* --- m3.nested --- */
  {
    c: "m3.nested", t: "mc",
    q: "Where does the second IF go when you nest one inside another to get three outcomes?",
    opts: ["In the test", "In the true part", "In the false part", "After the closing bracket"],
    a: 2,
    why: "The false part is what happens when the first question fails, so that is where the next question goes. Each nesting adds one more outcome.",
    trap: "Losing track of the closing brackets. This is exactly why IFS exists."
  },

  /* --- m3.ifs --- */
  {
    c: "m3.ifs", t: "type",
    q: "Amounts are in column E. In F2, band the payment: over 1000 is <strong>High</strong>, over 500 is <strong>Medium</strong>, anything else is <strong>Low</strong>.",
    model: '=IFS(E2>1000,"High",E2>500,"Medium",TRUE,"Low")',
    check: { sheet: QSHEET, expect: "Medium", mustUse: ["IFS", "IF"] },
    why: "E2 holds 620, so it is Medium. The highest test must come first, and TRUE at the end catches everything that failed the others.",
    trap: "Putting the 500 test first, which makes the 1000 test unreachable. Every large payment is then labelled Medium and nothing errors."
  },
  {
    c: "m3.ifs", t: "mc",
    q: "What happens in IFS when a value matches none of the tests and there is no final TRUE?",
    opts: ["It returns 0", "It returns empty", "It returns #N/A", "It returns the last result"],
    a: 2,
    why: "IFS has nothing to give back, so it says so. Finishing with TRUE and a catch-all value avoids it.",
    trap: "Treating the #N/A as a bug in the data. It is IFS reporting that your bands do not cover everything."
  },

  /* --- m3.ifsorder --- */
  {
    c: "m3.ifsorder", t: "pred",
    q: "A payment of £2,000 is banded with this formula. What does it return?",
    formula: '=IFS(E2>500,"Medium", E2>1000,"High", TRUE,"Low")',
    opts: ["High", "Medium", "Low", "#N/A"],
    a: 1,
    why: "£2,000 is over 500, so the first test wins and the High test is never reached. IFS stops at the first match.",
    trap: "This is the single worst trap in the module, because it returns a plausible label for every row and never errors. Always put the extreme test first."
  },
  {
    c: "m3.ifsorder", t: "mc",
    q: "You have banded 3,000 rows with IFS and want to check the order is right. What is the quickest test?",
    opts: ["Check the first row", "Find the largest value and confirm it lands in the top band",
           "Count the bands", "Check that no row returns #N/A"],
    a: 1,
    why: "An ordering mistake makes the top band unreachable, so the largest value is where it shows. The first row tells you nothing unless it happens to be extreme.",
    trap: "Checking for errors. An ordering mistake produces no errors at all, which is precisely why it survives to the report."
  },

  /* --- m3.andor --- */
  {
    c: "m3.andor", t: "mc",
    q: "Somebody asks for payments from Leeds and Bristol. You write <span class='f'>AND(C2=\"Leeds\",C2=\"Bristol\")</span>. What comes back?",
    opts: ["Both cities", "Nothing at all", "Only Leeds", "#VALUE!"],
    a: 1,
    why: "No single row can be two cities at once, so the test is never true. They said and, meaning both in the list; the formula needs OR.",
    trap: "The English word and almost always means OR when the conditions are on the same column. Ask whether one row could satisfy both parts."
  },
  {
    c: "m3.andor", t: "type",
    q: "In F2, show <strong>Priority</strong> when the amount in E is over 500 <em>and</em> the city in C is Leeds, and leave it empty otherwise.",
    model: '=IF(AND(E2>500,C2="Leeds"),"Priority","")',
    check: { sheet: QSHEET, expect: "Priority", mustUse: "AND" },
    why: "Both conditions apply to the same row, so AND. Row 2 is £620 from Leeds, so it is Priority.",
    trap: "Using OR here, which flags every Leeds payment however small, plus every large payment from anywhere."
  },

  /* --- m3.countif --- */
  {
    c: "m3.countif", t: "type",
    q: "Cities are in C2 to C6. Write a formula for how many rows say Leeds.",
    model: '=COUNTIF(C2:C6,"Leeds")',
    check: { sheet: QSHEET, expect: 3, mustUse: "COUNTIF" },
    why: "Range first, then what to look for. Capitalisation is ignored, so LEEDS would match as well.",
    trap: "Spaces are not ignored. A city stored as \"Leeds \" with a trailing space will not match, and your count comes back short with no warning."
  },
  {
    c: "m3.countif", t: "mc",
    q: "A COUNTIF over a supplier column returns 0 when you expected several. What are the two likeliest causes?",
    opts: ["The range is empty, or the function is misspelled",
           "Trailing spaces in the data, or a missing wildcard in the criterion",
           "The column is formatted wrongly, or the sheet is protected",
           "There are too many rows"],
    a: 1,
    why: "Those two account for most surprising zeros. A partial name needs an asterisk, and imported data very often carries invisible spaces.",
    trap: "Accepting the zero as an answer. A zero from a COUNTIF and a genuine absence look identical, so it always deserves a second look."
  },

  /* --- m3.criteria --- */
  {
    c: "m3.criteria", t: "mc",
    q: "Which of these is written correctly?",
    opts: ['=COUNTIF(E2:E500, >500)', '=COUNTIF(E2:E500, ">500")',
           '=COUNTIF(E2:E500, ">"500)', '=COUNTIF(E2:E500, "500">)'],
    a: 1,
    why: "The whole criterion, operator included, travels inside one pair of quotation marks. It reads oddly and it is the thing beginners get wrong most often with this family.",
    trap: "Leaving the operator outside the quotes, which Excel rejects."
  },
  {
    c: "m3.criteria", t: "type",
    q: "Amounts are in E2 to E6. The threshold 500 sits in H1. Write a formula counting the amounts <em>above</em> the threshold, pointing at H1 rather than typing 500.",
    model: '=COUNTIF(E2:E6,">"&H1)',
    check: { sheet: Object.assign({ H1: 500 }, QSHEET), expect: 3, mustUse: "COUNTIF" },
    why: "The ampersand joins the greater-than sign to whatever is in H1, building the criterion. Now changing the threshold re-answers the question.",
    trap: "Typing 500 into the formula, which is the Module 2 hard-coding mistake wearing a different hat."
  },

  /* --- m3.countifs --- */
  {
    c: "m3.countifs", t: "mc",
    q: "You want transactions between two dates. How many conditions does the date column need?",
    opts: ["One", "Two, one for each end of the window", "Three", "None, use a filter"],
    a: 1,
    why: "There is no between in this family, so you give the same range twice: on or after the start, and on or before the end. That is normal and it is how a window is expressed.",
    trap: "Trying to write a single criterion for a month. A date is a day count and knows nothing about months."
  },
  {
    c: "m3.countifs", t: "mc",
    q: "In a COUNTIFS you use E2:E500 for the amounts and D3:D501 for the dates. What happens?",
    opts: ["#VALUE!", "It works correctly", "It compares each amount against the wrong row's date", "It returns 0"],
    a: 2,
    why: "The ranges are the same size, so Excel accepts them, and every row is tested against its neighbour's date. Mismatched sizes give #VALUE!, which is far safer because you find out.",
    trap: "Assuming Excel checks that your ranges line up. It only checks that they are the same shape."
  },

  /* --- m3.wildcard --- */
  {
    c: "m3.wildcard", t: "mc",
    q: "Which criterion counts every supplier whose name ends in Ltd?",
    opts: ['"Ltd"', '"*Ltd"', '"Ltd*"', '"?Ltd"'],
    a: 1,
    why: "The asterisk stands for any number of characters, so it matches anything finishing with Ltd. Putting it after would match names beginning with Ltd instead.",
    trap: 'The question mark stands for exactly one character, so "?Ltd" only matches four-character names such as XLtd.'
  },
  {
    c: "m3.wildcard", t: "mc",
    q: "Do wildcards work on a column of amounts?",
    opts: ["Yes", "No, they only apply to text", "Only with COUNTIFS", "Only for whole numbers"],
    a: 1,
    why: "Wildcards are a text-matching device. On numbers and dates you use comparison operators instead.",
    trap: "Trying to match numbers beginning with a digit using a wildcard. For that you need the text functions in Module 4."
  },

  /* --- m3.sumif --- */
  {
    c: "m3.sumif", t: "mc",
    q: "Why do experienced users write SUMIFS even when there is only one condition?",
    opts: ["It is faster", "It puts the range being added first, so the argument order is never in doubt",
           "SUMIF is being removed", "It handles text better"],
    a: 1,
    why: "SUMIF and SUMIFS put the range being added at opposite ends of the argument list. Using one of them always means never having to remember which you are in.",
    trap: "Learning both properly and using them interchangeably. You will eventually reverse them, and the result is a wrong number rather than an error."
  },
  {
    c: "m3.sumif", t: "type",
    q: "Cities are in C2 to C6 and amounts in E2 to E6. Write a formula totalling the Leeds amounts, using SUMIFS.",
    model: '=SUMIFS(E2:E6,C2:C6,"Leeds")',
    check: { sheet: QSHEET, expect: 2070, mustUse: "SUMIFS" },
    why: "The range being added comes first, then range and criterion pairs. Leeds rows are 620, 500 and 950, totalling 2,070.",
    trap: "Writing it in SUMIF order, which puts the amount range last and totals the wrong column."
  },

  /* --- m3.sumifs --- */
  {
    c: "m3.sumifs", t: "mc",
    q: "Can the column being totalled also be one of the columns being tested?",
    opts: ["No", "Yes, and it is common", "Only in SUMIF", "Only if it is sorted"],
    a: 1,
    why: "Totalling the amounts that are themselves over a threshold means naming the amount range twice, once as the thing added and once as the thing tested. Perfectly normal.",
    trap: "Assuming a range can only appear once. There is no such rule, and date ranges routinely appear twice as well."
  },
  {
    c: "m3.sumifs", t: "mc",
    q: "You build a summary of totals by city, one formula filled down against a list of city labels. What must be locked?",
    opts: ["Nothing", "The data ranges, but not the criterion",
           "The criterion, but not the data ranges", "Everything"],
    a: 1,
    why: "The data ranges must stay pointing at the whole dataset as the formula travels down, so they are locked. The criterion must move so each row reads the label beside it.",
    trap: "Locking the criterion too, which makes every row report the first city's total under a different label. It looks entirely correct at a glance."
  },

  /* --- m3.argorder --- */
  {
    c: "m3.argorder", t: "mc",
    q: "In SUMIF, where does the range being added go?",
    opts: ["First", "Second", "Last", "It is not needed"],
    a: 2,
    why: "SUMIF takes the range to test, the criterion, then the range to add. SUMIFS puts the range to add first. They are the opposite way round, and there is no logic to it.",
    trap: "Reversing them, which produces a number rather than an error, because both arguments are valid ranges."
  },
  {
    c: "m3.argorder", t: "mc",
    q: "Somebody hands you a sheet containing <span class='f'>=SUMIF(E2:E500,\">500\",C2:C500)</span> where E is amounts and C is city names. What is wrong?",
    opts: ["Nothing", "It totals the city column, which is text, and returns 0",
           "The criterion needs to be a number", "The ranges are different sizes"],
    a: 1,
    why: "It tests the amounts correctly and then adds up the city names, which are text, so the total is 0. No error is shown.",
    trap: "A zero total looks like nothing matched. Here everything matched and the wrong column was added."
  },

  /* --- m3.iferror --- */
  {
    c: "m3.iferror", t: "mc",
    q: "AVERAGEIFS finds no matching rows. What does it return, and why?",
    opts: ["0, because nothing is nothing", "#DIV/0!, because there is no average of no numbers",
           "Empty", "#N/A"],
    a: 1,
    why: "Returning 0 would be a lie, since 0 is a real average that some data could genuinely produce. SUMIFS in the same situation returns 0, because the total of nothing really is nothing. Both are right.",
    trap: "Assuming a summary row showing a 0 total and an errored average is broken. It is consistent."
  },
  {
    c: "m3.iferror", t: "mc",
    q: "When should IFERROR be added to a formula?",
    opts: ["While building it, so errors do not distract you",
           "Last, once the formula is known to work",
           "Never", "Around every formula as a matter of habit"],
    a: 1,
    why: "IFERROR hides every error, not only the one you expected. Wrapped around a formula with a mistyped range, it gives you your tidy message instead of the #REF! that would have told you.",
    trap: "Using it as a general tidying tool. A sheet with no visible errors and IFERROR everywhere is less trustworthy than one showing its problems."
  }
]);

/* ============================================================
   Question bank, Module 4.
   ============================================================ */

defQuestions([
  /* --- m4.trim --- */
  {
    c: "m4.trim", t: "type",
    q: "A2 holds a supplier name with stray spaces around it. Write a formula giving the tidied version.",
    model: "=TRIM(A2)",
    check: { sheet: { A2: "  Acme   Ltd  " }, expect: "Acme Ltd", mustUse: "TRIM" },
    why: "TRIM strips the ends and collapses runs of spaces in the middle down to one. It changes nothing else.",
    trap: "Expecting it to fix capitalisation too. It does not; that is PROPER, UPPER or LOWER."
  },
  {
    c: "m4.trim", t: "mc",
    q: "You run TRIM on a column copied out of a web page and nothing changes. Why?",
    opts: ["TRIM only works on numbers", "The spaces are non-breaking spaces, character 160, which TRIM ignores",
           "The column is formatted as text", "TRIM needs the range, not one cell"],
    a: 1,
    why: "Web pages use non-breaking spaces, which look identical and are a different character. Substitute them out first: =TRIM(SUBSTITUTE(A2,CHAR(160),\" \")).",
    trap: "Concluding the data is clean because TRIM did nothing. Check with LEN instead of trusting appearances."
  },

  /* --- m4.lendiag --- */
  {
    c: "m4.lendiag", t: "pred",
    q: "A2 contains a name with one trailing space. What does this return?",
    formula: "=LEN(A2)-LEN(TRIM(A2))",
    opts: ["0", "1", "#VALUE!", "The length of the name"],
    a: 1,
    why: "One character disappeared when trimmed, so there was one stray space. This is how you measure damage you cannot see.",
    trap: "Trying to spot trailing spaces by widening the column. They are invisible at any width."
  },
  {
    c: "m4.lendiag", t: "mc",
    q: "Before cleaning a column of 5,000 names, what is the useful first step?",
    opts: ["Trim them all immediately", "Count how many rows are actually damaged",
           "Sort the column", "Convert everything to capitals"],
    a: 1,
    why: "If 3 rows in 5,000 are damaged you fix them. If 4,000 are, the export itself is wrong and you go back to whoever sent it rather than papering over it.",
    trap: "Cleaning first and never finding out how bad the source was. The count is evidence you may need later."
  },

  /* --- m4.case --- */
  {
    c: "m4.case", t: "pred",
    q: "What does this return?",
    formula: '=PROPER("BBC studios")',
    opts: ["BBC Studios", "Bbc Studios", "BBC STUDIOS", "bbc studios"],
    a: 1,
    why: "PROPER lowercases everything then capitalises the first letter of each word, so genuine acronyms are destroyed. Run it, then read the column.",
    trap: "Applying PROPER to a whole company list unchecked. Acronyms and names like McLeod come out wrong."
  },
  {
    c: "m4.case", t: "mc",
    q: "Which function suits a column of email addresses?",
    opts: ["PROPER", "UPPER", "LOWER", "TRIM only"],
    a: 2,
    why: "Email addresses are conventionally lower case, and lowering them makes two spellings of the same address match.",
    trap: "Using PROPER, which capitalises the name part and makes addresses look wrong to a human even though most mail servers do not care."
  },

  /* --- m4.helper --- */
  {
    c: "m4.helper", t: "mc",
    q: "You cleaned column A into column B with formulas, then deleted column A. What happens to column B?",
    opts: ["Nothing, it keeps the clean values", "Every cell becomes #REF!",
           "It reverts to the dirty values", "Excel refuses to delete column A"],
    a: 1,
    why: "Column B is formulas pointing at column A. Deleting the source destroys them. Copy column B and Paste Values over itself first, which cuts the link and makes the cleaning permanent.",
    trap: "Forgetting Paste Values. It is the step everyone misses once, and it costs a whole cleaning pass."
  },
  {
    c: "m4.helper", t: "mc",
    q: "Why clean into a new column rather than overwriting the original?",
    opts: ["It is faster", "So you can compare the two and prove what you changed",
           "Excel requires it", "To save memory"],
    a: 1,
    why: "Cleaning is a change to evidence. Keeping the original lets you spot-check the transformation and answer the question of what exactly you did, which somebody will eventually ask.",
    trap: "Cleaning in place on the only copy of a file. There is then no way to show the change was correct."
  },

  /* --- m4.value --- */
  {
    c: "m4.value", t: "type",
    q: "A2 holds the text <span class='f'>£1,250.50</span>. Write a formula turning it into a real number.",
    model: "=VALUE(A2)",
    check: { sheet: { A2: "£1,250.50" }, expect: 1250.5, mustUse: "VALUE" },
    why: "VALUE copes with the currency symbol and the thousands separator without help.",
    trap: "Formatting the cell as currency, which changes the display and leaves the value as text."
  },
  {
    c: "m4.value", t: "mc",
    q: "VALUE returns #VALUE! on a cell containing <span class='f'>45 units</span>. Why is that the right behaviour?",
    opts: ["The cell is formatted wrongly", "There are two facts in one cell and no function can guess which you meant",
           "VALUE cannot handle spaces", "The number is too small"],
    a: 1,
    why: "One fact per cell. The number and the unit need splitting apart, which is session 3, and no conversion function can do that guessing for you.",
    trap: "Wrapping it in IFERROR to make the error go away, which leaves you with a blank where a real value should be."
  },

  /* --- m4.datevalue --- */
  {
    c: "m4.datevalue", t: "mc",
    q: "A column of text dates converts with DATEVALUE without any errors, but about a third of them look wrong. What is the likely cause?",
    opts: ["The dates are corrupt", "Regional settings are reading day and month the other way round",
           "DATEVALUE needs a format argument", "The cells need widening"],
    a: 1,
    why: "03/04/2024 is 3 April in the United Kingdom and 4 March in the United States. Only the dates where the day is 13 or above are unambiguous, which is why roughly a third look wrong.",
    trap: "The absence of errors is not evidence of correctness. Rebuild from parts with DATE if you need certainty."
  },
  {
    c: "m4.datevalue", t: "mc",
    q: "You convert a text date and the cell shows 45368. What now?",
    opts: ["The conversion failed", "It worked: format the cell as a date",
           "Divide by 1000", "Use VALUE instead"],
    a: 1,
    why: "45368 is the day count Excel stores for 17 March 2024. The conversion is complete; only the display format is missing.",
    trap: "Assuming a five-digit number means failure. It means success, shown without its costume."
  },

  /* --- m4.coerce --- */
  {
    c: "m4.coerce", t: "mc",
    q: "You meet <span class='f'>=--A2</span> in somebody else's sheet. What is it doing?",
    opts: ["Subtracting twice", "Forcing text that looks numeric to become a number",
           "Making the value negative", "Nothing"],
    a: 1,
    why: "Two negations cancel out, and the arithmetic forces a conversion on the way. It is common inside SUMPRODUCT and worth recognising.",
    trap: "Writing it yourself. VALUE says the same thing and a reader does not have to stop and decode it."
  },
  {
    c: "m4.coerce", t: "pred",
    q: "A2 contains the text 12. What does this return?",
    formula: "=A2*1",
    opts: ["12 as text", "12 as a number", "#VALUE!", "121"],
    a: 1,
    why: "Arithmetic on text that looks purely numeric forces a conversion, so the result is a real number. This is why =\"12\"+1 gives 13 while SUM over a range containing \"12\" skips it.",
    trap: "Assuming the inconsistency is a bug. It is the rule: direct arithmetic converts, ranges do not."
  },

  /* --- m4.textisoneway --- */
  {
    c: "m4.textisoneway", t: "mc",
    q: "You build a column with =TEXT(B2,\"0.00\") and then total it. What do you get?",
    opts: ["The correct total", "Zero, because TEXT produces text and SUM skips text",
           "#VALUE!", "The total rounded to 2dp"],
    a: 1,
    why: "TEXT is for labels. Its output cannot be added, averaged or sorted as a number. If the figure will be calculated with, format the cell instead and leave the value alone.",
    trap: "Using TEXT to control decimal places on data. Formatting does that without destroying the number."
  },

  /* --- m4.split --- */
  {
    c: "m4.split", t: "type",
    q: "A2 holds <span class='f'>Smith, John</span>. Write a formula giving just the surname.",
    model: '=TEXTBEFORE(A2,", ")',
    check: { sheet: { A2: "Smith, John" }, expect: "Smith", mustUse: ["TEXTBEFORE", "LEFT"] },
    why: "Everything before the first comma-space. The older equivalent is =LEFT(A2,FIND(\",\",A2)-1) and both are worth knowing.",
    trap: "Forgetting the minus one in the LEFT version, which drags the comma along and gives \"Smith,\"."
  },
  {
    c: "m4.split", t: "mc",
    q: "Why split on <span class='f'>\", \"</span> rather than just <span class='f'>\",\"</span> when taking the part after a comma?",
    opts: ["It is faster", "Splitting on the comma alone leaves a leading space on the result",
           "Excel requires two characters", "It handles missing commas better"],
    a: 1,
    why: "The space after the comma belongs to the delimiter, not to the name. Leave it in and you have created exactly the invisible fault session 1 was about.",
    trap: "The result looks perfect on screen and fails every lookup in Module 5."
  },

  /* --- m4.findsearch --- */
  {
    c: "m4.findsearch", t: "mc",
    q: "What are the two differences between FIND and SEARCH?",
    opts: ["FIND is faster, SEARCH is newer",
           "FIND is case sensitive and takes no wildcards; SEARCH ignores case and accepts them",
           "FIND works on numbers, SEARCH on text", "There is no difference"],
    a: 1,

    trap: "Deleting first. There is no undo once the file is saved and closed."

    why: "It compares only the ticked columns and keeps the first occurrence. Ticking one column on a transaction file destroys most of the data, with no record of what went.",

    q: "Why must trimming happen before deduplicating?",
    opts: ["It is faster that way", "Trailing spaces make identical rows look different, so duplicates survive",

    a: 1,
    why: "Remove Duplicates ignores capitalisation but not spaces. Run it on a dirty file and \"Acme\" and \"Acme \" are kept as two distinct rows.",
    trap: "Deduplicating a fresh export and reporting the row count as clean."

  /* --- m4.unique --- */
  {
    c: "m4.unique", t: "mc",
    q: "What is the advantage of UNIQUE over Remove Duplicates?",
    opts: ["It is faster", "It changes nothing: the source data is untouched",
           "It handles more rows", "It ignores case"],
    a: 1,
    why: "UNIQUE returns the distinct values as a live result and leaves the data alone. It should be your default, with Remove Duplicates reserved for when you genuinely mean to delete.",

  /* --- m4.blanks --- */

    a: 1,

   Question bank, Module 5.

const M5Q = {
  A2: "SUP-102",
  A10: "SUP-101", B10: "Redgate Supplies", C10: "Low",
  A11: "SUP-102", B11: "Halden & Co", C11: "Medium",
  A12: "SUP-103", B12: "Northwood Ltd", C12: "Low"
};

defQuestions([
  /* --- m5.lookupidea --- */
  {
    c: "m5.lookupidea", t: "mc",
    q: "Why does a transaction log store a supplier code rather than the supplier's name?",
    opts: ["To save disk space", "So each fact is stored once, in the place it belongs, and referred to by a key",
           "Because names are too long", "To make lookups necessary"],
    a: 1,
    why: "Duplicating the name against every transaction guarantees that one day half the rows say Redgate Supplies and half say Redgate Supplies Ltd, with no way to tell which is right.",
    trap: "Copying the names in permanently to avoid writing a lookup. You have then made the same mistake the split was designed to prevent."
  },

  /* --- m5.xlookup --- */
  {
    c: "m5.xlookup", t: "type",
    q: "A code sits in A2. The master's codes are in A10:A12 and its supplier names in B10:B12. Write the lookup for the supplier name.",
    model: "=XLOOKUP(A2,A10:A12,B10:B12)",
    check: { sheet: M5Q, expect: "Halden & Co", mustUse: "XLOOKUP" },
    why: "Three arguments in the order you would say them: what to find, where to look, what to bring back.",
    trap: "Giving it the whole master block as one range, as VLOOKUP wants. XLOOKUP takes the search column and the return column separately."
  },
  {
    c: "m5.xlookup", t: "mc",
    q: "How many arguments does XLOOKUP need for an exact match?",
    opts: ["Three", "Four, the last being FALSE", "Two", "Five"],
    a: 0,
    why: "Exact is the default, so there is no fourth argument to remember and no way to leave off a safeguard by accident. That is the main reason to prefer it over VLOOKUP.",
    trap: "Adding FALSE out of VLOOKUP habit. XLOOKUP's fourth argument is if_not_found, so a stray FALSE becomes the text shown when nothing matches."
  },

  /* --- m5.lockarrays --- */
  {
    c: "m5.lockarrays", t: "mc",
    q: "You fill a lookup down 200 rows and the lower rows return #N/A even though the codes are plainly in the master. What is wrong?",
    opts: ["The master is too small", "The master ranges were not locked, so they slid down as the formula filled",
           "The codes are numbers", "XLOOKUP cannot handle 200 rows"],
    a: 1,
    why: "Without dollar signs the master range moves with the formula, so by the bottom it is searching past the end of the table. Lock both master ranges; leave the lookup value relative.",
    trap: "Assuming the master is incomplete and asking somebody to add codes that are already there."
  },
  {
    c: "m5.lockarrays", t: "mc",
    q: "In <span class='f'>=XLOOKUP(C2,$A$17:$A$23,$B$17:$B$23)</span>, which part is meant to change as you fill down?",
    opts: ["All three", "Only C2", "Only the two ranges", "None of them"],
    a: 1,
    why: "Each row looks up its own code, so C2 must move. Both master ranges must stay pointing at the whole master, so both are locked.",
    trap: "Locking C2 as well, which makes all 200 rows report on the first transaction."
  },

  /* --- m5.returnrange --- */
  {
    c: "m5.returnrange", t: "mc",
    q: "The supplier name is in column A and the code in column C. Which will do the lookup?",
    opts: ["VLOOKUP", "XLOOKUP or INDEX with MATCH", "HLOOKUP", "None of them"],
    a: 1,
    why: "VLOOKUP can only return something to the right of the column it searches. XLOOKUP takes the search range and the return range as separate arguments, so direction does not matter.",
    trap: "Rearranging your data so VLOOKUP can cope. Restructuring a table to suit a formula is the wrong way round."
  },

  /* --- m5.na --- */
  {
    c: "m5.na", t: "mc",
    q: "A lookup returns #N/A. What has Excel told you?",
    opts: ["The formula is broken", "The value was not found in the range you searched",
           "The range is the wrong size", "A number is stored as text"],
    a: 1,
    why: "That is all it says, and it is usually true. The work is deciding which of three things caused it: the value is genuinely absent, the key is dirty on your side, or the key is dirty on the master's side.",
    trap: "Rewriting the formula first. In two of the three cases the formula was right and the data was not."
  },
  {
    c: "m5.na", t: "mc",
    q: "A code fails to match. <span class='f'>=COUNTIF(master,C5)</span> gives 0 and <span class='f'>=COUNTIF(master,\"*\"&TRIM(C5)&\"*\")</span> gives 1. What does that tell you?",
    opts: ["The code is genuinely missing", "The code is there, but one side of the join is dirty",
           "The master is sorted wrongly", "COUNTIF cannot be used this way"],
    a: 1,
    why: "The exact search finds nothing while the wildcard search finds it, so the value exists with something extra around it. That is a thirty-second diagnosis that saves an hour of guessing.",
    trap: "Skipping the diagnosis and trying fixes at random."
  },

  /* --- m5.ifnotfound --- */
  {
    c: "m5.ifnotfound", t: "type",
    q: "Look up the code in A2 against codes in A10:A12, returning the name from B10:B12, and showing <strong>not on file</strong> when nothing matches.",
    model: '=XLOOKUP(A2,A10:A12,B10:B12,"not on file")',
    check: { sheet: M5Q, expect: "Halden & Co", mustUse: "XLOOKUP" },
    why: "The fourth argument is what to return when nothing matches. No wrapper and no nesting, which is the main practical advantage of XLOOKUP.",
    trap: "Wrapping the whole thing in IFERROR instead, which also swallows a mistyped range and leaves you debugging blind."
  },
  {
    c: "m5.ifnotfound", t: "mc",
    q: "What should an unmatched lookup return on a sheet somebody else will read?",
    opts: ["A blank", "Zero", "A short message such as not on file", "#N/A, always"],
    a: 2,
    why: "A message says a lookup ran and found nothing, which is a fact somebody may need to act on. A blank is indistinguishable from a row nobody has filled in yet, and a zero will be added into totals.",
    trap: "Returning zero on a numeric lookup. It is silently wrong in every sum on the sheet."
  },

  /* --- m5.dirtykeys --- */
  {
    c: "m5.dirtykeys", t: "mc",
    q: "Which Module 4 fault most often breaks a lookup?",
    opts: ["Wrong capitalisation", "A trailing space", "Missing decimal places", "A merged cell"],
    a: 1,
    why: "Lookups ignore capitalisation, so case differences match fine. A trailing space is invisible and does not match, and it is the single commonest cause of an unexplained #N/A.",
    trap: "Trusting your eyes. Compare LEN against LEN of TRIM instead."
  },

  /* --- m5.bothsides --- */
  {
    c: "m5.bothsides", t: "mc",
    q: "You wrap your lookup value in TRIM and one row still returns #N/A. What is left to check?",
    opts: ["The formula syntax", "Whether the master's own key is dirty",
           "Whether the range is locked", "Whether the code is a number"],
    a: 1,
    why: "TRIM on the lookup value cleans your side only. If the entry in the master carries the space, the match still fails and the obvious fix appears not to work. Add a cleaned helper column to the master and search that.",
    trap: "Editing the transaction to match the damaged master, which propagates the fault into your data instead of out of it."
  },
  {
    c: "m5.bothsides", t: "mc",
    q: "Why is Module 4 taught before Module 5?",
    opts: ["Cleaning is easier", "Because a join fails on exactly the invisible faults cleaning finds",
           "Because lookups are harder", "No particular reason"],
    a: 1,
    why: "Clean both sides, then join. A lookup over dirty keys fails in a way that looks like a formula problem and is not.",
    trap: "Building the join first and then spending an afternoon on the formula."
  },

  /* --- m5.vlookup --- */
  {
    c: "m5.vlookup", t: "type",
    q: "The master occupies A10:C12, with codes in the first column and names in the second. Look up the code in A2 using VLOOKUP, exactly.",
    model: "=VLOOKUP(A2,A10:C12,2,FALSE)",
    check: { sheet: M5Q, expect: "Halden & Co", mustUse: "VLOOKUP" },
    why: "The whole block, then the column number counted from the block's left edge, then FALSE for exact.",
    trap: "Omitting the FALSE. On unsorted data that returns a real value from the wrong row, with no error."
  },
  {
    c: "m5.vlookup", t: "pred",
    q: "The master is A10:C12 with codes, names and risk. What does this return?",
    formula: "=VLOOKUP(A2,A10:C12,3,FALSE)",
    opts: ["The code", "The name", "The risk rating", "#REF!"],
    a: 2,
    why: "Column 3 of the block, counting the block's own left edge as 1. Here that is the risk column.",
    trap: "Counting from column A of the sheet rather than from the left edge of the block you supplied."
  },

  /* --- m5.vlookupflaws --- */
  {
    c: "m5.vlookupflaws", t: "mc",
    q: "Somebody inserts a column into the middle of your master. What happens to your VLOOKUPs?",
    opts: ["They error", "They return values from the wrong field, silently",
           "Excel updates the column numbers", "Nothing"],
    a: 1,
    why: "The column number is a position, not a reference, so it still says 2 and now points at something else. Nothing errors, and you have a column of city names labelled Supplier.",
    trap: "This flaw breaks a working sheet through an action taken by somebody who had no reason to think about your formula."
  },
  {
    c: "m5.vlookupflaws", t: "mc",
    q: "Which is NOT one of VLOOKUP's three flaws?",
    opts: ["It can only return values to the right of the search column",
           "The column number breaks when a column is inserted",
           "It cannot handle text values",
           "Its last argument is optional and defaults to approximate matching"],
    a: 2,
    why: "It handles text perfectly well. The other three are real, and the third is the one that produces confidently wrong answers.",
    trap: "Learning VLOOKUP as simply outdated. It is usable; it just has three specific traps you must name."
  },

  /* --- m5.approx --- */
  {
    c: "m5.approx", t: "mc",
    q: "When is approximate matching, the TRUE argument, the right choice?",
    opts: ["Never", "When looking up a code", "For banding, such as commission rates by order size",
           "When the data is unsorted"],
    a: 2,
    why: "Banding means take the row for the largest threshold not exceeding my value, which is exactly what approximate matching does. It needs the threshold column sorted ascending and starting below anything you will look up.",
    trap: "Using it anywhere else, or letting it happen by default because the FALSE was left off."
  },
  {
    c: "m5.approx", t: "mc",
    q: "A banding table starts at a threshold of 500. An order of £200 is looked up with TRUE. What comes back?",
    opts: ["0%", "The 500 band", "#N/A", "An error"],
    a: 2,
    why: "There is no row at or below 200, so there is nothing to fall back to. Banding tables must start at 0, which is why the practice table does.",
    trap: "Assuming the smallest band catches everything below it. It only catches values above its own threshold."
  },

  /* --- m5.indexmatch --- */
  {
    c: "m5.indexmatch", t: "type",
    q: "Codes are in A10:A12 and names in B10:B12. Look up the code from A2 using INDEX and MATCH.",
    model: "=INDEX(B10:B12,MATCH(A2,A10:A12,0))",
    check: { sheet: M5Q, expect: "Halden & Co", mustUseAll: ["INDEX", "MATCH"] },
    why: "MATCH finds which position the code sits at; INDEX fetches that position from the name column. Read it inside out: work out the row, then fetch from it.",
    trap: "Leaving the 0 off MATCH, which makes it approximate and, on unsorted data, wrong."
  },
  {
    c: "m5.indexmatch", t: "mc",
    q: "Why is INDEX with MATCH still worth being able to read?",
    opts: ["It is faster than XLOOKUP", "Inherited workbooks are full of it, and it has the widest version compatibility",
           "It is the only one that looks left", "It is easier"],
    a: 1,
    why: "For twenty years it was the right answer, so it is everywhere. It also works in every version of Excel, which is why it survives in files shared between organisations.",
    trap: "Writing it in new work. XLOOKUP says the same thing in a form a beginner can read."
  }
]);

   Question banks, Modules 6 and 7.

defQuestions([
  /* ---------------- Module 6 ---------------- */
  {
    c: "m6.whatitis", t: "mc",
    q: "In two verbs, what does a pivot table do?",
    opts: ["Sorts and filters", "Groups rows, then does arithmetic on each group",
           "Charts and formats", "Copies and pastes"],
    a: 1,
    why: "It finds every distinct value of the field you put in Rows, gathers the rows for each, and applies the value setting to them. That is all a pivot table is.",

  },
  {
    c: "m6.whatitis", t: "mc",
    q: "Why learn SUMIFS before pivot tables, when the pivot is faster?",

           "SUMIFS is more powerful", "Interviews only ask about SUMIFS"],
    a: 1,
    why: "When a pivot gives you an unexpected figure, the formulas are how you work out whether the source range, a filter, or the data is at fault.",

  {

    c: "m6.sourcerange", t: "mc",

  {

    a: 1,
    why: "Count tells you how many rows are behind a figure. A large total from four rows is a very different story from the same total across four hundred.",

  },
  {
    c: "m6.pctoftotal", t: "mc",
    q: "A pivot shows a supplier at 100% of spend. What must you check before reporting it?",
    opts: ["The formatting", "How many transactions are behind it",
           "The chart type", "Whether the total is rounded"],
    a: 1,
    why: "A share without its base is not a fact. One hundred per cent of two transactions and 38 per cent of six hundred are not comparable claims.",
    trap: "Percentages feel more rigorous than raw numbers and are easier to mislead with."
  },
  {
    c: "m6.columns", t: "mc",
    q: "You put City in Rows and Category in Columns. What does each inner cell show?",

    a: 2,
    why: "Rows and Columns together give a grid, and each cell is the intersection: the rows matching both. Totals run down the right and along the bottom.",

    q: "Why prefer a slicer over a filter dropdown on a report somebody else will read?",

    a: 1,
    why: "A pivot is a snapshot, not a live formula. Right-click and Refresh, or use the Refresh button on the PivotTable tab.",

  /* ---------------- Module 7 ---------------- */

  {
    c: "m7.axiszero", t: "mc",

    note: "A blank cell and a zero are not the same thing here. A blank is left out; a zero is averaged in and drags the mean down." },
  { name: "MIN", module: "m2", tags: ["smallest", "lowest"],
