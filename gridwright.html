  const s = toText(scalar(vals[0])), d = toText(scalar(vals[1])); const e = firstErr(s, d); if (e) return e;
  const i = s.indexOf(d); return i < 0 ? mkErr(ERR.NA) : s.slice(i + d.length);
});
def("CLEAN", vals => { const s = toText(scalar(vals[0])); return isErr(s) ? s : s.replace(/[\x00-\x1F\x7F]/g, ""); });

/* ---------- information ---------- */
def("ISBLANK", h => { const v = scalar(h.ev(0)); return v === null; }, { lazy: true });
def("ISNUMBER", h => { const v = scalar(h.ev(0)); return typeof v === "number"; }, { lazy: true });
def("ISTEXT", h => { const v = scalar(h.ev(0)); return typeof v === "string"; }, { lazy: true });
def("ISERROR", h => isErr(scalar(h.ev(0))), { lazy: true });
def("ISNA", h => { const v = scalar(h.ev(0)); return isErr(v) && v.err === ERR.NA; }, { lazy: true });
def("ISLOGICAL", h => typeof scalar(h.ev(0)) === "boolean", { lazy: true });
def("N", vals => { const v = scalar(vals[0]); if (typeof v === "number") return v; if (typeof v === "boolean") return v ? 1 : 0; return 0; });

/* ---------- lookup ---------- */
def("XLOOKUP", h => {
  const lv = scalar(h.ev(0));
  const la = h.ev(1), ra = h.ev(2);
  if (isErr(lv)) return lv;
  const look = cellsOf(la);
  const retGrid = asGrid(ra);
  const retIsRow = isRange(ra) && retGrid.length === 1 && retGrid[0].length > 1;
  const ret = cellsOf(ra);
  const notFound = h.n > 3 ? scalar(h.ev(3)) : undefined;
  const mode = h.n > 4 ? toNum(scalar(h.ev(4))) : 0;
  const search = h.n > 5 ? toNum(scalar(h.ev(5))) : 1;
  if (isErr(mode) || isErr(search)) return mkErr(ERR.VALUE);
  const order = search === -1 ? look.map((_, i) => look.length - 1 - i) : look.map((_, i) => i);
  let found = -1;
  if (mode === 2) {
    const m = makeMatcher(typeof lv === "string" ? lv : toText(lv));
    for (const i of order) if (m(look[i])) { found = i; break; }
  } else if (mode === 0) {
    for (const i of order) if (cmpValues(look[i], lv) === 0) { found = i; break; }
  } else if (mode === -1) {
    let best = -1, bestV = null;
    for (let i = 0; i < look.length; i++) {
      const c = cmpValues(look[i], lv);
      if (c === 0) { best = i; break; }
      if (c < 0 && (bestV === null || cmpValues(look[i], bestV) > 0)) { best = i; bestV = look[i]; }
    }
    found = best;
  } else if (mode === 1) {
    let best = -1, bestV = null;
    for (let i = 0; i < look.length; i++) {
      const c = cmpValues(look[i], lv);
      if (c === 0) { best = i; break; }
      if (c > 0 && (bestV === null || cmpValues(look[i], bestV) < 0)) { best = i; bestV = look[i]; }
    }
    found = best;
  }
  if (found < 0) return notFound === undefined ? mkErr(ERR.NA) : notFound;
  if (isRange(ra) && !retIsRow && retGrid[0] && retGrid[0].length > 1) {
    return mkRange([retGrid[found]], -1, -1, -1, -1);
  }
  return ret[found] === undefined ? mkErr(ERR.NA) : ret[found];
}, { lazy: true });

def("VLOOKUP", vals => {
  const lv = scalar(vals[0]);
  const grid = asGrid(vals[1]);
  const col = toNum(vals[2]); if (isErr(col)) return col;
  // Excel's default is TRUE: approximate match. This trips people up,
  // which is exactly why the course teaches it as a flaw.
  const approx = vals.length > 3 ? toBool(scalar(vals[3])) : true;
  if (isErr(approx)) return approx;
  if (col < 1 || (grid[0] && col > grid[0].length)) return mkErr(ERR.REF);
  if (!approx) {
    for (const row of grid) if (cmpValues(row[0], lv) === 0) return row[col - 1];
    return mkErr(ERR.NA);
  }
  let best = -1;
  for (let i = 0; i < grid.length; i++) {
    const c = cmpValues(grid[i][0], lv);
    if (c === 0) { best = i; break; }
    if (c < 0) best = i; else break;
  }
  return best < 0 ? mkErr(ERR.NA) : grid[best][col - 1];
});
def("HLOOKUP", vals => {
  const lv = scalar(vals[0]);
  const grid = asGrid(vals[1]);
  const row = toNum(vals[2]); if (isErr(row)) return row;
  const approx = vals.length > 3 ? toBool(scalar(vals[3])) : true;
  const head = grid[0] || [];
  let best = -1;
  for (let i = 0; i < head.length; i++) {
    const c = cmpValues(head[i], lv);
    if (c === 0) { best = i; break; }
    if (approx && c < 0) best = i;
  }
  if (best < 0) return mkErr(ERR.NA);
  return (grid[row - 1] || [])[best];
});
def("INDEX", vals => {
  const grid = asGrid(vals[0]);
  const rows = grid.length, cols = grid[0] ? grid[0].length : 0;
  let r = vals.length > 1 ? toNum(vals[1]) : 0;
  let c = vals.length > 2 ? toNum(vals[2]) : 0;
  if (isErr(r) || isErr(c)) return mkErr(ERR.VALUE);
  if (rows === 1 && vals.length === 2) { c = r; r = 1; }
  if (cols === 1 && vals.length === 2) { c = 1; }
  if (r === 0 && c === 0) return vals[0];
  if (r < 0 || c < 0 || r > rows || c > cols) return mkErr(ERR.REF);
  if (r === 0) return mkRange(grid.map(row => [row[c - 1]]), -1, -1, -1, -1);
  if (c === 0) return mkRange([grid[r - 1]], -1, -1, -1, -1);
  return grid[r - 1][c - 1];
});
def("MATCH", vals => {
  const lv = scalar(vals[0]);
  const arr = cellsOf(vals[1]);
  const type = vals.length > 2 ? toNum(vals[2]) : 1;
  if (isErr(type)) return type;
  if (type === 0) {
    const wild = typeof lv === "string" && /[*?]/.test(lv);
    const m = wild ? makeMatcher(lv) : null;
    for (let i = 0; i < arr.length; i++) if (m ? m(arr[i]) : cmpValues(arr[i], lv) === 0) return i + 1;
    return mkErr(ERR.NA);
  }
  if (type === 1) {
    let best = -1;
    for (let i = 0; i < arr.length; i++) { const c = cmpValues(arr[i], lv); if (c === 0) return i + 1; if (c < 0) best = i; else break; }
    return best < 0 ? mkErr(ERR.NA) : best + 1;
  }
  let best = -1;
  for (let i = 0; i < arr.length; i++) { const c = cmpValues(arr[i], lv); if (c === 0) return i + 1; if (c > 0) best = i; else break; }
  return best < 0 ? mkErr(ERR.NA) : best + 1;
});
def("CHOOSE", h => {
  const i = toNum(scalar(h.ev(0))); if (isErr(i)) return i;
  if (i < 1 || i >= h.n) return mkErr(ERR.VALUE);
  return scalar(h.ev(i));
}, { lazy: true });
def("ROW", h => {
  if (h.n === 0) return 1;
  const node = h.raw[0];
  if (node.k === "ref") return node.t.row + 1;
  if (node.k === "range") return Math.min(node.a.row, node.b.row) + 1;
  return mkErr(ERR.VALUE);
}, { lazy: true });
def("COLUMN", h => {
  if (h.n === 0) return 1;
  const node = h.raw[0];
  if (node.k === "ref") return node.t.col + 1;
  if (node.k === "range") return Math.min(node.a.col, node.b.col) + 1;
  return mkErr(ERR.VALUE);
}, { lazy: true });
def("ROWS", vals => dims(vals[0])[0]);
def("COLUMNS", vals => dims(vals[0])[1]);

/* ---------- dynamic arrays ---------- */
def("UNIQUE", vals => {
  const grid = asGrid(vals[0]);
  const byCol = grid[0] && grid[0].length === 1;
  const seen = [], out = [];
  const keyOf = v => (v === null ? "␀blank" : (typeof v === "string" ? "s:" + v.toUpperCase() : typeof v + ":" + String(v)));
  for (const row of grid) {
    const k = row.map(keyOf).join("");
    if (seen.indexOf(k) < 0) { seen.push(k); out.push(row.slice()); }
  }
  return mkRange(out, -1, -1, -1, -1);
});
def("SORT", vals => {
  const grid = asGrid(vals[0]).map(r => r.slice());
  const idx = vals.length > 1 ? toNum(vals[1]) : 1;
  const order = vals.length > 2 ? toNum(vals[2]) : 1;
  if (isErr(idx) || isErr(order)) return mkErr(ERR.VALUE);
  grid.sort((a, b) => cmpValues(a[idx - 1], b[idx - 1]) * (order < 0 ? -1 : 1));
  return mkRange(grid, -1, -1, -1, -1);
});
def("FILTER", vals => {
  const grid = asGrid(vals[0]);
  const cond = cellsOf(vals[1]);
  const out = [];
  for (let i = 0; i < grid.length; i++) {
    const c = cond[i];
    const b = (typeof c === "boolean") ? c : (typeof c === "number" ? c !== 0 : false);
    if (b) out.push(grid[i].slice());
  }
  if (!out.length) return vals.length > 2 ? scalar(vals[2]) : mkErr(ERR.CALC);
  return mkRange(out, -1, -1, -1, -1);
});

/* ---------- statistics ---------- */
function statNums(vals) { return numsFromRanges(vals); }
def("MEDIAN", vals => {
  const ns = statNums(vals); if (isErr(ns)) return ns;
  if (!ns.length) return mkErr(ERR.NUM);
  const s = ns.slice().sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
});
def("MODE.SNGL", vals => {
  const ns = statNums(vals); if (isErr(ns)) return ns;
  const counts = new Map(); let best = null, bc = 1;
  for (const n of ns) { const c = (counts.get(n) || 0) + 1; counts.set(n, c); if (c > bc) { bc = c; best = n; } }
  return best === null ? mkErr(ERR.NA) : best;
});
def(["STDEV.S", "STDEV"], vals => {
  const ns = statNums(vals); if (isErr(ns)) return ns;
  if (ns.length < 2) return mkErr(ERR.DIV0);
  const m = ns.reduce((a, b) => a + b, 0) / ns.length;
  return Math.sqrt(ns.reduce((a, b) => a + (b - m) * (b - m), 0) / (ns.length - 1));
});
def(["STDEV.P", "STDEVP"], vals => {
  const ns = statNums(vals); if (isErr(ns)) return ns;
  if (!ns.length) return mkErr(ERR.DIV0);
  const m = ns.reduce((a, b) => a + b, 0) / ns.length;
  return Math.sqrt(ns.reduce((a, b) => a + (b - m) * (b - m), 0) / ns.length);
});
def(["VAR.S", "VAR"], vals => {
  const ns = statNums(vals); if (isErr(ns)) return ns;
  if (ns.length < 2) return mkErr(ERR.DIV0);
  const m = ns.reduce((a, b) => a + b, 0) / ns.length;
  return ns.reduce((a, b) => a + (b - m) * (b - m), 0) / (ns.length - 1);
});
function percentileInc(sorted, p) {
  if (!sorted.length) return mkErr(ERR.NUM);
  if (p < 0 || p > 1) return mkErr(ERR.NUM);
  const n = sorted.length;
  const idx = p * (n - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (idx - lo) * (sorted[hi] - sorted[lo]);
}
def(["PERCENTILE.INC", "PERCENTILE"], vals => {
  const ns = statNums(vals.slice(0, 1)); if (isErr(ns)) return ns;
  const p = toNum(vals[1]); if (isErr(p)) return p;
  return percentileInc(ns.slice().sort((a, b) => a - b), p);
});
def(["QUARTILE.INC", "QUARTILE"], vals => {
  const ns = statNums(vals.slice(0, 1)); if (isErr(ns)) return ns;
  const q = toNum(vals[1]); if (isErr(q)) return q;
  if (q < 0 || q > 4) return mkErr(ERR.NUM);
  return percentileInc(ns.slice().sort((a, b) => a - b), q / 4);
});
def(["PERCENTRANK.INC", "PERCENTRANK"], vals => {
  const ns = statNums(vals.slice(0, 1)); if (isErr(ns)) return ns;
  const x = toNum(vals[1]); if (isErr(x)) return x;
  const s = ns.slice().sort((a, b) => a - b);
  let below = 0; for (const v of s) if (v < x) below++;
  let equal = 0; for (const v of s) if (v === x) equal++;
  if (!s.length) return mkErr(ERR.NUM);
  return (below + 0) / (s.length - 1 || 1);
});
def("LARGE", vals => {
  const ns = statNums(vals.slice(0, 1)); if (isErr(ns)) return ns;
  const k = toNum(vals[1]); if (isErr(k)) return k;
  const s = ns.slice().sort((a, b) => b - a);
  return (k < 1 || k > s.length) ? mkErr(ERR.NUM) : s[k - 1];
});
def("SMALL", vals => {
  const ns = statNums(vals.slice(0, 1)); if (isErr(ns)) return ns;
  const k = toNum(vals[1]); if (isErr(k)) return k;
  const s = ns.slice().sort((a, b) => a - b);
  return (k < 1 || k > s.length) ? mkErr(ERR.NUM) : s[k - 1];
});
def(["RANK.EQ", "RANK"], vals => {
  const x = toNum(vals[0]); if (isErr(x)) return x;
  const ns = statNums(vals.slice(1, 2)); if (isErr(ns)) return ns;
  const desc = vals.length > 2 ? toBool(scalar(vals[2])) : false;
  const s = ns.slice().sort((a, b) => desc ? a - b : b - a);
  const i = s.indexOf(x);
  return i < 0 ? mkErr(ERR.NA) : i + 1;
});
def("CORREL", vals => {
  const a = statNums(vals.slice(0, 1)), b = statNums(vals.slice(1, 2));
  if (isErr(a)) return a; if (isErr(b)) return b;
  const n = Math.min(a.length, b.length);
  if (n < 2) return mkErr(ERR.DIV0);
  const ma = a.slice(0, n).reduce((x, y) => x + y, 0) / n;
  const mb = b.slice(0, n).reduce((x, y) => x + y, 0) / n;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < n; i++) { const x = a[i] - ma, y = b[i] - mb; num += x * y; da += x * x; db += y * y; }
  return (da === 0 || db === 0) ? mkErr(ERR.DIV0) : num / Math.sqrt(da * db);
});
def("STANDARDIZE", vals => {
  const x = toNum(vals[0]), m = toNum(vals[1]), s = toNum(vals[2]);
  const e = firstErr(x, m, s); if (e) return e;
  return s <= 0 ? mkErr(ERR.NUM) : (x - m) / s;
});

/* ---------- dates ---------- */
def("TODAY", () => dateToSerial(new Date()));
def("NOW", () => dateToSerial(new Date()) + (new Date().getHours() * 3600 + new Date().getMinutes() * 60) / 86400);
def("DATE", vals => {
  const y = toNum(vals[0]), m = toNum(vals[1]), d = toNum(vals[2]);
  const e = firstErr(y, m, d); if (e) return e;
  return ymdToSerial(y < 1900 ? 1900 + y : y, m, d);
});
def("YEAR", vals => { const n = toNum(vals[0]); return isErr(n) ? n : serialToDate(n).getUTCFullYear(); });
def("MONTH", vals => { const n = toNum(vals[0]); return isErr(n) ? n : serialToDate(n).getUTCMonth() + 1; });
def("DAY", vals => { const n = toNum(vals[0]); return isErr(n) ? n : serialToDate(n).getUTCDate(); });
def("HOUR", vals => { const n = toNum(vals[0]); if (isErr(n)) return n; return Math.floor((n - Math.floor(n)) * 24 + 1e-9); });
def("MINUTE", vals => { const n = toNum(vals[0]); if (isErr(n)) return n; const s = Math.round((n - Math.floor(n)) * 86400); return Math.floor((s % 3600) / 60); });
def("WEEKDAY", vals => {
  const n = toNum(vals[0]); if (isErr(n)) return n;
  const type = vals.length > 1 ? toNum(vals[1]) : 1; if (isErr(type)) return type;
  const dow = serialToDate(n).getUTCDay(); // 0 = Sunday
  if (type === 1) return dow + 1;
  if (type === 2) return dow === 0 ? 7 : dow;
  if (type === 3) return dow === 0 ? 6 : dow - 1;
  return dow + 1;
});
def("EOMONTH", vals => {
  const n = toNum(vals[0]), k = toNum(vals[1]); const e = firstErr(n, k); if (e) return e;
  const d = serialToDate(n);
  return ymdToSerial(d.getUTCFullYear(), d.getUTCMonth() + 1 + k + 1, 0);
});
def("EDATE", vals => {
  const n = toNum(vals[0]), k = toNum(vals[1]); const e = firstErr(n, k); if (e) return e;
  const d = serialToDate(n);
  return ymdToSerial(d.getUTCFullYear(), d.getUTCMonth() + 1 + k, d.getUTCDate());
});
def("DAYS", vals => { const a = toNum(vals[0]), b = toNum(vals[1]); const e = firstErr(a, b); if (e) return e; return a - b; });
def("NETWORKDAYS", vals => {
  const a = toNum(vals[0]), b = toNum(vals[1]); const e = firstErr(a, b); if (e) return e;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  let n = 0;
  for (let s = Math.floor(lo); s <= Math.floor(hi); s++) { const d = serialToDate(s).getUTCDay(); if (d !== 0 && d !== 6) n++; }
  return a <= b ? n : -n;
});

/* ---------- reference-ish ---------- */
def("IFBLANK", h => { const v = scalar(h.ev(0)); return v === null ? scalar(h.ev(1)) : v; }, { lazy: true });

/* names taught in the course, for the searchable reference */
const FN_NAMES = Object.keys(FN).sort();

/* ============================================================
   Sheet model: cells, input parsing, recalculation, formatting.
   ============================================================ */

function Sheet(name, rows, cols) {
  this.name = name || "Sheet1";
  this.rows = rows || 30;
  this.cols = cols || 8;
  this.data = Object.create(null);   // "r,c" -> cell
  this.colw = {};
  this._cache = null;
  this._busy = null;
}
Sheet.prototype.key = function (r, c) { return r + "," + c; };
Sheet.prototype.cell = function (r, c) { return this.data[this.key(r, c)] || null; };
Sheet.prototype.ensure = function (r, c) {
  const k = this.key(r, c);
  if (!this.data[k]) this.data[k] = { v: null, f: null, fmt: null, locked: false, hdr: false };
  return this.data[k];
};
Sheet.prototype.clearCell = function (r, c) { delete this.data[this.key(r, c)]; this.dirty(); };
Sheet.prototype.dirty = function () { this._cache = null; };

/* ---------- writing ---------- */
Sheet.prototype.set = function (r, c, value, opts) {
  const cell = this.ensure(r, c);
  cell.v = value; cell.f = null;
  if (opts) Object.assign(cell, opts);
  this.dirty(); return cell;
};
Sheet.prototype.setFormula = function (r, c, f, opts) {
  const cell = this.ensure(r, c);
  cell.f = String(f).replace(/^=/, ""); cell.v = null;
  if (opts) Object.assign(cell, opts);
  this.dirty(); return cell;
};
/* Parse what a person types, the way Excel does. */
Sheet.prototype.input = function (r, c, text) {
  const s = String(text);
  if (s === "") { this.clearCell(r, c); return; }
  if (s[0] === "=") { this.setFormula(r, c, s.slice(1)); return; }
  if (s[0] === "'") { this.set(r, c, s.slice(1), { fmt: "@" }); return; }
  const t = s.trim();
  const up = t.toUpperCase();
  if (up === "TRUE") { this.set(r, c, true); return; }
  if (up === "FALSE") { this.set(r, c, false); return; }
  if (ERR_LIST.includes(up)) { this.set(r, c, mkErr(up)); return; }
  // percentage
  if (/^-?[\d,]*\.?\d+\s*%$/.test(t)) { this.set(r, c, parseFloat(t.replace(/[,%\s]/g, "")) / 100, { fmt: "0.00%" }); return; }
  // currency
  const cm = /^([£$€])\s*(-?[\d,]*\.?\d+)$/.exec(t);
  if (cm) { this.set(r, c, parseFloat(cm[2].replace(/,/g, "")), { fmt: cm[1] + "#,##0.00" }); return; }
  // plain number
  if (NUMRE.test(t) && t !== "" && /\d/.test(t)) { this.set(r, c, parseFloat(t.replace(/,/g, "")), { fmt: t.includes(",") ? "#,##0.##" : null }); return; }
  // date
  const d = parseDateText(t);
  if (d !== null) { this.set(r, c, d, { fmt: "dd/mm/yyyy" }); return; }
  this.set(r, c, s);
};

/* ---------- reading ---------- */
Sheet.prototype.ctx = function () {
  const self = this;
  return {
    get: function (r, c) { return self.value(r, c); },
    sheet: self
  };
};
Sheet.prototype.value = function (r, c) {
  if (r < 0 || c < 0 || r >= this.rows || c >= this.cols) return null;
  const cell = this.cell(r, c);
  if (!cell) return null;
  if (cell.f === null || cell.f === undefined) return cell.v === undefined ? null : cell.v;
  if (!this._cache) this._cache = Object.create(null);
  const k = this.key(r, c);
  if (k in this._cache) return this._cache[k];
  if (!this._busy) this._busy = Object.create(null);
  if (this._busy[k]) { this._cache[k] = mkErr(ERR.CYCLE); return this._cache[k]; }
  this._busy[k] = true;
  let out;
  try {
    out = computeFormula(cell.f, this.ctx());
    if (out && out.parseError) out = mkErr(ERR.NAME);
  } catch (e) { out = mkErr(ERR.VALUE); }
  finally { delete this._busy[k]; }
  this._cache[k] = out;
  return out;
};
Sheet.prototype.recalc = function () { this._cache = null; };

/* What the cell shows on screen. */
Sheet.prototype.display = function (r, c) {
  const cell = this.cell(r, c);
  const v = this.value(r, c);
  if (v === null || v === undefined) return "";
  if (isErr(v)) return v.err;
  if (isRange(v)) {
    const first = v.cells[0] && v.cells[0].length ? v.cells[0][0] : null;
    return first === null ? "" : this.fmtValue(first, cell && cell.fmt);
  }
  return this.fmtValue(v, cell && cell.fmt);
};
Sheet.prototype.fmtValue = function (v, fmt) {
  if (typeof v === "boolean") return v ? "TRUE" : "FALSE";
  if (typeof v === "number") {
    if (fmt) { const out = applyFormat(v, fmt); return isErr(out) ? out.err : out; }
    return numToGeneral(xround(v, 10));
  }
  return String(v);
};
Sheet.prototype.cssClass = function (r, c) {
  const cell = this.cell(r, c);
  const v = this.value(r, c);
  if (cell && cell.hdr) return "hdr";
  if (isErr(v)) return "err";
  if (typeof v === "number") return "num";
  if (typeof v === "boolean") return "bool";
  return "txt";
};
/* The text shown in the formula bar when the cell is selected. */
Sheet.prototype.editText = function (r, c) {
  const cell = this.cell(r, c);
  if (!cell) return "";
  if (cell.f) return "=" + cell.f;
  if (cell.v === null || cell.v === undefined) return "";
  if (isErr(cell.v)) return cell.v.err;
  if (typeof cell.v === "number" && cell.fmt && /[dmy]/.test(cell.fmt) && !/[#0]/.test(cell.fmt)) {
    return formatDate(cell.v, "dd/mm/yyyy");
  }
  if (typeof cell.v === "boolean") return cell.v ? "TRUE" : "FALSE";
  return String(cell.v);
};

/* Copy one cell into another, shifting relative references the way
   Excel does when you fill or copy a formula. */
Sheet.prototype.copyCell = function (fromR, fromC, toR, toC) {
  const src = this.cell(fromR, fromC);
  if (!src) { this.clearCell(toR, toC); return; }
  const dst = this.ensure(toR, toC);
  dst.fmt = src.fmt;
  dst.hdr = false;
  if (src.f) { dst.f = offsetFormula(src.f, toR - fromR, toC - fromC); dst.v = null; }
  else { dst.f = null; dst.v = src.v; }
  this.dirty();
  return dst;
};

/* ---------- bulk helpers used by the workbook generators ---------- */
Sheet.prototype.writeRow = function (r, c0, values, opts) {
  values.forEach((v, i) => {
    if (v === null || v === undefined) return;
    if (typeof v === "string" && v[0] === "=") this.setFormula(r, c0 + i, v.slice(1), opts);
    else this.set(r, c0 + i, v, opts);
  });
};
Sheet.prototype.writeTable = function (r0, c0, header, rowsData, colFmts) {
  header.forEach((h, i) => this.set(r0, c0 + i, h, { hdr: true, locked: true }));
  rowsData.forEach((row, ri) => row.forEach((v, ci) => {
    if (v === null || v === undefined) return;
    const fmt = colFmts ? colFmts[ci] : null;
    this.set(r0 + 1 + ri, c0 + ci, v, fmt ? { fmt } : null);
  }));
  this.rows = Math.max(this.rows, r0 + rowsData.length + 2);
  this.cols = Math.max(this.cols, c0 + header.length);
};
/* Flat array-of-arrays snapshot, used for .xlsx and .csv export. */
Sheet.prototype.toAOA = function (opts) {
  const raw = opts && opts.raw;
  const out = [];
  for (let r = 0; r < this.rows; r++) {
    const row = [];
    for (let c = 0; c < this.cols; c++) {
      const cell = this.cell(r, c);
      if (!cell) { row.push(null); continue; }
      if (cell.f && raw) { row.push({ f: cell.f, fmt: cell.fmt }); continue; }
      const v = raw ? cell.v : this.value(r, c);
      row.push(isErr(v) ? v.err : (isRange(v) ? (v.cells[0] ? v.cells[0][0] : null) : v));
    }
    out.push(row);
  }
  // trim trailing empty rows
  while (out.length && out[out.length - 1].every(v => v === null || v === "")) out.pop();
  return out;
};

/* ---------- a workbook is a named list of sheets ---------- */
function Workbook(name) { this.name = name; this.sheets = []; }
Workbook.prototype.add = function (sheet) { this.sheets.push(sheet); return sheet; };
Workbook.prototype.get = function (name) { return this.sheets.find(s => s.name === name); };

/* ============================================================
   GridView: the in-app practice spreadsheet.
   Behaves like Excel where it matters: click to select, type to
   replace, F2 or double-click to edit, Enter down, Tab right,
   Escape cancels, arrows navigate, Delete clears.
   ============================================================ */

function GridView(sheet, opts) {
  this.sheet = sheet;
  this.opts = opts || {};
  this.sel = { r: this.opts.startRow || 0, c: this.opts.startCol || 0 };
  this.editing = false;
  this.root = null;
  this.marks = {};        // "r,c" -> "ok" | "bad"
  this.targets = {};      // "r,c" -> true
  (this.opts.targets || []).forEach(t => {
    if (!t) return;                                   // pivot-only checks carry no cell
    const p = parseA1(typeof t === "string" ? t : t.cell);
    if (p) this.targets[p.r + "," + p.c] = true;
  });
}

/* The handful of number formats Module 1 actually needs. */
const FORMAT_PRESETS = [
  { label: "General", fmt: null, title: "No format. Excel decides how to show it." },
  { label: "1,000", fmt: "#,##0", title: "Whole number with thousand separators" },
  { label: "0.00", fmt: "0.00", title: "Two decimal places" },
  { label: "£", fmt: "£#,##0.00", title: "Pounds sterling, two decimal places" },
  { label: "%", fmt: "0.0%", title: "Percentage" },
  { label: "Date", fmt: "dd/mm/yyyy", title: "Short date, day first" },
  { label: "Text", fmt: "@", title: "Store this as text, whatever it looks like" }
];
function fmtFamily(fmt) {
  if (!fmt) return "general";
  if (fmt === "@") return "text";
  if (/[dmy]/.test(fmt) && !/[#0]/.test(fmt)) return "date";
  if (fmt.includes("%")) return "percent";
  if (/[£$€]/.test(fmt)) return "currency";
  return "number";
}

function parseA1(ref) {
  const m = /^\$?([A-Za-z]{1,3})\$?(\d{1,7})$/.exec(String(ref).trim());
  if (!m) return null;
  return { r: parseInt(m[2], 10) - 1, c: colToIndex(m[1]) };
}

/* Values spilled by a dynamic-array formula, so UNIQUE and TEXTSPLIT
   look the way they do in real Excel. */
GridView.prototype.spillMap = function () {
  const sh = this.sheet, map = Object.create(null);
  for (const k in sh.data) {
    const cell = sh.data[k];
    if (!cell.f) continue;
    const [r, c] = k.split(",").map(Number);
    const v = sh.value(r, c);
    if (!isRange(v)) continue;
    for (let i = 0; i < v.cells.length; i++) {
      for (let j = 0; j < v.cells[i].length; j++) {
        if (i === 0 && j === 0) continue;
        const tk = (r + i) + "," + (c + j);
        if (!sh.data[tk]) map[tk] = v.cells[i][j];
      }
    }
  }
  return map;
};

GridView.prototype.render = function () {
  const sh = this.sheet, o = this.opts;
  const wrap = el("div", { class: "sheet" });

  /* formula bar */
  const addr = el("div", { class: "sheet-addr", text: a1(this.sel.r, this.sel.c) });
  const fx = el("input", {
    class: "sheet-input", type: "text", spellcheck: "false",
    "aria-label": "Formula bar", value: sh.editText(this.sel.r, this.sel.c)
  });
  fx.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); this.commit(fx.value); this.move(1, 0); this.refresh(); }
    else if (e.key === "Escape") { fx.value = sh.editText(this.sel.r, this.sel.c); fx.blur(); }
  });
  fx.addEventListener("blur", () => { if (fx.value !== sh.editText(this.sel.r, this.sel.c)) { this.commit(fx.value); this.refresh(); } });
  wrap.appendChild(el("div", { class: "sheet-bar" }, [addr, el("span", { class: "sheet-fx", text: "fx" }), fx]));
  this.addrEl = addr; this.fxEl = fx;

  /* optional fill bar, standing in for Excel's fill handle */
  if (o.fillBar) {
    const fb = el("div", { class: "sheet-bar", style: "gap:6px;flex-wrap:wrap" });
    fb.appendChild(el("button", { class: "btn btn-sm", onclick: () => this.fillDownRun(), text: "Fill down ↓" }));
    fb.appendChild(el("span", { class: "tiny muted" }, [
      "copies the selected cell into the amber cells below it, exactly as dragging the fill handle would. ",
      el("kbd", { text: "Ctrl" }), " + ", el("kbd", { text: "D" }), " fills one cell from above."
    ]));
    wrap.appendChild(fb);
  }

  /* optional number-format bar, standing in for Excel's Home ribbon */
  if (o.formatBar) {
    const bar = el("div", { class: "sheet-bar", style: "gap:4px;flex-wrap:wrap" });
    bar.appendChild(el("span", { class: "tiny muted", style: "margin-right:4px", text: "Format:" }));
    FORMAT_PRESETS.forEach(p => {
      bar.appendChild(el("button", {
        class: "btn btn-sm", title: p.title,
        onclick: () => {
          const cell = this.sheet.cell(this.sel.r, this.sel.c);
          if (!cell) { toast("Select a cell that has something in it first."); return; }
          if (cell.locked && !this.opts.allowLocked) { toast("That cell is part of the data."); return; }
          if (p.fmt === "@") {
            // formatting as text in Excel converts the stored value to text
            const v = this.sheet.value(this.sel.r, this.sel.c);
            this.sheet.set(this.sel.r, this.sel.c, toText(v), { fmt: "@" });
          } else {
            cell.fmt = p.fmt;
          }
          delete this.marks[this.sel.r + "," + this.sel.c];
          this.refresh();
        },
        text: p.label
      }));
    });
    wrap.appendChild(bar);
  }

  /* table */
  const scroll = el("div", { class: "sheet-scroll" });
  const table = el("table", { class: "grid" });
  this.table = table;
  scroll.appendChild(table);
  wrap.appendChild(scroll);

  if (o.hint) wrap.appendChild(el("div", { class: "sheet-hint", html: o.hint }));

  this.root = wrap;
  this.paint();

  /* keyboard */
  scroll.tabIndex = 0;
  scroll.addEventListener("keydown", e => this.onKey(e));
  this.scrollEl = scroll;
  return wrap;
};

GridView.prototype.paint = function () {
  if (!this.table) return;              // not mounted yet
  const sh = this.sheet, o = this.opts, table = clear(this.table);
  const spill = this.spillMap();
  const nRows = Math.min(sh.rows, o.maxRows || sh.rows);
  const nCols = Math.min(sh.cols, o.maxCols || sh.cols);

  /* table-layout:fixed takes its column widths from the first row or a
     colgroup. Declaring them here rather than in CSS lets a wide sheet
     use narrower columns and still fit without a horizontal scrollbar. */
  const colW = o.colWidth || 104;
  const HDRW = 42;
  table.style.width = (HDRW + nCols * colW) + "px";
  const cg = el("colgroup");
  cg.appendChild(el("col", { style: "width:" + HDRW + "px" }));
  for (let c = 0; c < nCols; c++) cg.appendChild(el("col", { style: "width:" + colW + "px" }));
  table.appendChild(cg);

  const thead = el("thead");
  const hr = el("tr");
  hr.appendChild(el("th", { text: "" }));
  for (let c = 0; c < nCols; c++) hr.appendChild(el("th", { text: indexToCol(c) }));
  thead.appendChild(hr); table.appendChild(thead);

  const tb = el("tbody");
  for (let r = 0; r < nRows; r++) {
    const tr = el("tr");
    tr.appendChild(el("th", { text: String(r + 1) }));
    for (let c = 0; c < nCols; c++) {
      const k = r + "," + c;
      const cell = sh.cell(r, c);
      let text, cls;
      if (!cell && spill[k] !== undefined) {
        text = sh.fmtValue(spill[k], null);
        cls = typeof spill[k] === "number" ? "num" : "txt";
      } else {
        text = sh.display(r, c);
        cls = sh.cssClass(r, c);
      }
      const cv = el("div", { class: "cv", text });
      const td = el("td", { class: cls, data: { r: String(r), c: String(c) } }, [cv]);

      /* Excel lets a long label overflow into empty cells to its right.
         Doing the same keeps question labels readable without forcing
         every sheet to use wide columns. */
      if (text && (cls === "txt" || cls === "hdr") && text.length > 12) {
        let free = 0;
        for (let k = c + 1; k < nCols; k++) {
          const nb = sh.cell(r, k);
          if (nb && (nb.f || (nb.v !== null && nb.v !== ""))) break;
          if (spill[r + "," + k] !== undefined) break;
          free++;
        }
        if (free > 0) {
          td.classList.add("spill");
          cv.style.width = ((free + 1) * colW - 12) + "px";
        }
      }
      if (cell && cell.locked) td.classList.add("locked");
      if (this.targets[k]) td.classList.add("target");
      if (this.marks[k] === "ok") td.classList.add("ok-cell");
      if (this.marks[k] === "bad") td.classList.add("bad-cell");
      if (r === this.sel.r && c === this.sel.c) td.classList.add("sel");
      td.addEventListener("mousedown", e => {
        e.preventDefault();
        this.sel = { r, c }; this.editing = false; this.refresh();
        this.scrollEl.focus();
      });
      td.addEventListener("dblclick", () => this.startEdit(sh.editText(r, c)));
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  table.appendChild(tb);
};

GridView.prototype.refresh = function () {
  this.sheet.recalc();
  this.paint();
  if (this.addrEl) this.addrEl.textContent = a1(this.sel.r, this.sel.c);
  if (this.fxEl && document.activeElement !== this.fxEl) this.fxEl.value = this.sheet.editText(this.sel.r, this.sel.c);
  if (this.opts.onChange) this.opts.onChange(this);
};

GridView.prototype.selTd = function () {
  return this.table.querySelector('td[data-r="' + this.sel.r + '"][data-c="' + this.sel.c + '"]');
};

GridView.prototype.startEdit = function (initial) {
  const td = this.selTd();
  if (!td) return;
  const cell = this.sheet.cell(this.sel.r, this.sel.c);
  if (cell && cell.locked && !this.opts.allowLocked) { toast("That cell is part of the data. Work in the highlighted cells."); return; }
  this.editing = true;
  const inp = el("input", { class: "editor", type: "text", spellcheck: "false", value: initial === undefined ? "" : initial });
  td.appendChild(inp);
  inp.focus();
  if (initial && initial.length) inp.setSelectionRange(inp.value.length, inp.value.length);
  const done = (commit, dr, dc) => {
    if (!this.editing) return;
    this.editing = false;
    const val = inp.value;
    if (inp.parentNode) inp.parentNode.removeChild(inp);
    if (commit) this.commit(val);
    if (dr || dc) this.move(dr, dc);
    this.refresh();
    this.scrollEl.focus();
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); done(true, 1, 0); }
    else if (e.key === "Tab") { e.preventDefault(); done(true, 0, e.shiftKey ? -1 : 1); }
    else if (e.key === "Escape") { e.preventDefault(); done(false, 0, 0); }
    e.stopPropagation();
  });
  inp.addEventListener("blur", () => done(true, 0, 0));
};

GridView.prototype.commit = function (text) {
  const { r, c } = this.sel;
  const cell = this.sheet.cell(r, c);
  if (cell && cell.locked && !this.opts.allowLocked) return;
  const before = this.sheet.editText(r, c);
  if (String(text) === before) return;
  this.sheet.input(r, c, text);
  delete this.marks[r + "," + c];
  this.sheet.recalc();
  // surface a parse problem straight away rather than silently storing text
  const cc = this.sheet.cell(r, c);
  if (cc && cc.f) {
    const res = computeFormula(cc.f, this.sheet.ctx());
    if (res && res.parseError) toast(res.parseError, 4200);
  }
  if (this.opts.onEdit) this.opts.onEdit(this, r, c);
};

GridView.prototype.move = function (dr, dc) {
  const nR = Math.min(this.sheet.rows, this.opts.maxRows || this.sheet.rows);
  const nC = Math.min(this.sheet.cols, this.opts.maxCols || this.sheet.cols);
  this.sel.r = Math.max(0, Math.min(nR - 1, this.sel.r + dr));
  this.sel.c = Math.max(0, Math.min(nC - 1, this.sel.c + dc));
  const td = this.selTd();
  if (td && td.scrollIntoView) td.scrollIntoView({ block: "nearest", inline: "nearest" });
};

GridView.prototype.onKey = function (e) {
  if (this.editing) return;
  const k = e.key;
  if (k === "ArrowUp") { e.preventDefault(); this.move(-1, 0); this.refresh(); }
  else if (k === "ArrowDown" || k === "Enter") { e.preventDefault(); this.move(1, 0); this.refresh(); }
  else if (k === "ArrowLeft") { e.preventDefault(); this.move(0, -1); this.refresh(); }
  else if (k === "ArrowRight") { e.preventDefault(); this.move(0, 1); this.refresh(); }
  else if (k === "Tab") { e.preventDefault(); this.move(0, e.shiftKey ? -1 : 1); this.refresh(); }
  else if (k === "F2") { e.preventDefault(); this.startEdit(this.sheet.editText(this.sel.r, this.sel.c)); }
  else if ((k === "d" || k === "D") && (e.ctrlKey || e.metaKey)) {
    /* Excel's Ctrl+D: copy the cell above into this one, references and all */
    e.preventDefault();
    this.fillFromAbove();
  }
  else if (k === "Delete" || k === "Backspace") {
    e.preventDefault();
    const cell = this.sheet.cell(this.sel.r, this.sel.c);
    if (!(cell && cell.locked && !this.opts.allowLocked)) {
      this.sheet.clearCell(this.sel.r, this.sel.c);
      delete this.marks[this.sel.r + "," + this.sel.c];
      this.refresh();
    }
  }
  else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault(); this.startEdit(k);
  }
};

/* ---------- filling ---------- */
GridView.prototype.canWrite = function (r, c) {
  const cell = this.sheet.cell(r, c);
  return !(cell && cell.locked && !this.opts.allowLocked);
};
GridView.prototype.fillFromAbove = function () {
  const { r, c } = this.sel;
  if (r === 0) { toast("There is no cell above this one to fill from."); return; }
  if (!this.canWrite(r, c)) { toast("That cell is part of the data."); return; }
  const above = this.sheet.cell(r - 1, c);
  if (!above || (above.v === null && !above.f)) { toast("The cell above is empty, so there is nothing to fill down."); return; }
  this.sheet.copyCell(r - 1, c, r, c);
  delete this.marks[r + "," + c];
  this.refresh();
};
/* Does this row still belong to the table? Used to decide how far a
   fill should travel, the same way double-clicking Excel's fill handle
   stops at the end of the neighbouring data. */
GridView.prototype.rowHasData = function (r, skipCol) {
  const nCols = Math.min(this.sheet.cols, this.opts.maxCols || this.sheet.cols);
  for (let c = 0; c < nCols; c++) {
    if (c === skipCol) continue;
    const cell = this.sheet.cell(r, c);
    if (cell && (cell.f || (cell.v !== null && cell.v !== ""))) return true;
  }
  return false;
};

/* Fill the selected cell down to the end of the table. */
GridView.prototype.fillDownRun = function () {
  const { r, c } = this.sel;
  const src = this.sheet.cell(r, c);
  if (!src || (src.v === null && !src.f)) { toast("Put a formula in the top cell first, then fill it down."); return; }
  const last = Math.min(this.sheet.rows, this.opts.maxRows || this.sheet.rows) - 1;
  let n = 0;
  for (let rr = r + 1; rr <= last; rr++) {
    if (!this.canWrite(rr, c)) break;
    if (!this.rowHasData(rr, c)) break;
    this.sheet.copyCell(r, c, rr, c);
    delete this.marks[rr + "," + c];
    n++;
  }
  this.refresh();
  toast(n ? "Filled down into " + n + " " + plural(n, "cell") : "Nothing below to fill into");
};

/* ---------- answer checking ---------- */
/* A check is { cell, expect, tol, mustUse, mustNotUse, why, wrongWay } */
GridView.prototype.check = function (checks) {
  const sh = this.sheet;
  const results = [];
  this.marks = {};
  for (const chk of checks) {
    const p = parseA1(chk.cell);
    if (!p) continue;
    const cell = sh.cell(p.r, p.c);
    const got = sh.value(p.r, p.c);
    const res = { cell: chk.cell, chk, got, ok: false, note: "" };

    if (!cell || (cell.v === null && !cell.f)) {
      res.note = "Empty. Nothing typed here yet.";
    } else if (isErr(got)) {
      res.note = "This returns " + got.err + ". " + errorHelp(got.err);
    } else if (chk.expectType && !typeMatches(got, chk.expectType)) {
      res.note = "The value is stored as " + storedAs(got) + ", and this task needs it stored as " + chk.expectType +
        ". Look at which side of the cell it sits on: Excel pushes real numbers and dates to the right, and text to the left.";
    } else if (chk.expectFmt && fmtFamily(cell.fmt) !== chk.expectFmt) {
      res.note = "The underlying value is fine, but the cell is formatted as " + fmtFamily(cell.fmt) +
        " and the task asks for " + chk.expectFmt + ". Use the Format buttons above the grid.";
    } else if (chk.expect === undefined) {
      res.ok = true;
    } else {
      let ok = valueMatches(got, chk.expect, chk.tol);
      /* mustUse lists alternatives: any one of them is acceptable.
         mustUseAll lists requirements: every one must appear. */
      if (ok && chk.mustUse) {
        const f = (cell.f || "").toUpperCase();
        const need = Array.isArray(chk.mustUse) ? chk.mustUse : [chk.mustUse];
        if (!need.some(nm => f.includes(nm.toUpperCase()))) {
          ok = false;
          res.note = "The number is right, but the task asks you to use " + need.join(" or ") +
            ". Typing the answer by hand will not survive the data changing.";
        }
      }
      if (ok && chk.mustUseAll) {
        const f = (cell.f || "").toUpperCase();
        const need = Array.isArray(chk.mustUseAll) ? chk.mustUseAll : [chk.mustUseAll];
        const missing = need.filter(nm => !f.includes(nm.toUpperCase()));
        if (missing.length) {
          ok = false;
          res.note = "The number is right, but this task needs " + need.join(" and ") +
            ", and " + missing.join(" and ") + " " + (missing.length > 1 ? "are" : "is") + " missing.";
        }
      }
      if (ok && chk.mustNotUse) {
        const f = (cell.f || "").toUpperCase();
        const bad = (Array.isArray(chk.mustNotUse) ? chk.mustNotUse : [chk.mustNotUse]).filter(nm => f.includes(nm.toUpperCase()));
        if (bad.length) { ok = false; res.note = "Right answer, wrong tool here: avoid " + bad.join(", ") + " for this task."; }
      }
      if (ok && chk.needFormula && !cell.f) {
        ok = false; res.note = "That is the right number, but it is typed in as a constant. The task needs a formula, so it updates when the data does.";
      }
      res.ok = ok;
      if (!ok && !res.note) {
        res.note = "Expected " + displayExpected(chk.expect) + ", got " + sh.fmtValue(got, null) + ".";
      }
    }
    this.marks[p.r + "," + p.c] = res.ok ? "ok" : "bad";
    results.push(res);
  }
  this.paint();
  return results;
};

function typeMatches(v, want) {
  if (want === "number" || want === "date") return typeof v === "number";
  if (want === "text") return typeof v === "string";
  if (want === "boolean") return typeof v === "boolean";
  return true;
}
function storedAs(v) {
  if (typeof v === "number") return "a number";
  if (typeof v === "boolean") return "TRUE or FALSE";
  if (v === null) return "nothing";
  return "text";
}

function valueMatches(got, expect, tol) {
  if (Array.isArray(expect)) return expect.some(e => valueMatches(got, e, tol));
  if (typeof expect === "number") {
    const n = typeof got === "number" ? got : toNum(got);
    if (isErr(n) || typeof n !== "number") return false;
    return Math.abs(n - expect) <= (tol === undefined ? 0.005 : tol);
  }
  if (typeof expect === "boolean") return got === expect || String(got).toUpperCase() === String(expect).toUpperCase();
  if (expect === null) return got === null;
  return String(got == null ? "" : (typeof got === "boolean" ? (got ? "TRUE" : "FALSE") : got)).trim().toUpperCase()
       === String(expect).trim().toUpperCase();
}
function displayExpected(e) {
  if (Array.isArray(e)) return e.map(displayExpected).join(" or ");
  if (typeof e === "number") return fmtNum(e, null);
  if (typeof e === "boolean") return e ? "TRUE" : "FALSE";
  if (e === null) return "an empty cell";

}
function errorHelp(code) {

    "#DIV/0!": "Something is being divided by zero or by an empty cell.",

/* ============================================================
   Downloads: .xlsx through SheetJS when it loaded, .csv otherwise.
   Nothing in the course depends on the CDN being reachable.
   ============================================================ */

function hasXLSX() { return typeof XLSX !== "undefined" && XLSX && XLSX.utils; }
function hasChart() { return typeof Chart !== "undefined"; }

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = $("#dl");
  a.href = url; a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- CSV ---------- */
function csvCell(v, fmt) {
  if (v === null || v === undefined) return "";
  if (isErr(v)) return v.err;
  if (typeof v === "number" && fmt && /[dmy]/.test(fmt) && !/[#0]/.test(fmt)) return formatDate(v, "dd/mm/yyyy");
  let s = typeof v === "boolean" ? (v ? "TRUE" : "FALSE") : String(v);
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function sheetToCSV(sheet) {
  const lines = [];
  const aoa = sheet.toAOA();
  for (let r = 0; r < aoa.length; r++) {
    const row = [];
    for (let c = 0; c < aoa[r].length; c++) {
      const cell = sheet.cell(r, c);
      row.push(csvCell(aoa[r][c], cell && cell.fmt));
    }
    while (row.length && row[row.length - 1] === "") row.pop();
    lines.push(row.join(","));
  }
  return "﻿" + lines.join("\r\n");
}

/* ---------- XLSX ---------- */
function sheetToWS(sheet) {
  const ws = {};
  let maxR = 0, maxC = 0;
  for (let r = 0; r < sheet.rows; r++) {
    for (let c = 0; c < sheet.cols; c++) {
      const cell = sheet.cell(r, c);
      if (!cell) continue;
      const addr = XLSX.utils.encode_cell({ r, c });
      const o = {};
      if (cell.f) {
        o.f = cell.f;
        const v = sheet.value(r, c);
        if (typeof v === "number") { o.t = "n"; o.v = v; }
        else if (typeof v === "boolean") { o.t = "b"; o.v = v; }
        else if (isErr(v)) { o.t = "e"; o.v = 0; delete o.f; o.v = 0; }
        else { o.t = "s"; o.v = v == null ? "" : String(v); }
      } else {
        const v = cell.v;
        if (v === null || v === undefined) continue;
        if (typeof v === "number") { o.t = "n"; o.v = v; }
        else if (typeof v === "boolean") { o.t = "b"; o.v = v; }
        else if (isErr(v)) { o.t = "s"; o.v = v.err; }
        else { o.t = "s"; o.v = String(v); }
      }
      if (cell.fmt) o.z = cell.fmt;
      ws[addr] = o;
      if (r > maxR) maxR = r;
      if (c > maxC) maxC = c;
    }
  }
  ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(maxR, 0), c: Math.max(maxC, 0) } });
  const widths = [];
  for (let c = 0; c <= maxC; c++) {
    let w = 10;
    for (let r = 0; r <= maxR; r++) {
      const cell = sheet.cell(r, c);
      if (!cell) continue;
      const t = sheet.display(r, c);
      w = Math.max(w, Math.min(34, String(t).length + 3));
    }
    widths.push({ wch: w });
  }
  ws["!cols"] = widths;
  if (sheet.freeze) ws["!freeze"] = sheet.freeze;
  return ws;
}

function workbookToBlob(wb) {
  const out = XLSX.utils.book_new();
  wb.sheets.forEach(s => XLSX.utils.book_append_sheet(out, sheetToWS(s), s.name.slice(0, 31)));
  const wbout = XLSX.write(out, { bookType: "xlsx", type: "array" });
  return new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* Round-trips the file through SheetJS's reader before handing it over,
   so a corrupt workbook is caught here rather than by Excel. */
function validateWorkbookBlob(blob, wb) {
  return new Promise(resolve => {
    if (!hasXLSX()) return resolve({ ok: false, why: "SheetJS not loaded" });
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const back = XLSX.read(new Uint8Array(fr.result), { type: "array" });
        const names = back.SheetNames || [];
        const wantFirst = wb.sheets[0].name.slice(0, 31);
        if (names.length !== wb.sheets.length) return resolve({ ok: false, why: "sheet count " + names.length + " vs " + wb.sheets.length });
        if (names[0] !== wantFirst) return resolve({ ok: false, why: "first sheet named " + names[0] });
        const ws = back.Sheets[names[0]];
        if (!ws || !ws["!ref"]) return resolve({ ok: false, why: "first sheet has no used range" });
        resolve({ ok: true, sheets: names, ref: ws["!ref"] });
      } catch (e) { resolve({ ok: false, why: String(e && e.message || e) }); }
    };
    fr.onerror = () => resolve({ ok: false, why: "could not read back" });
    fr.readAsArrayBuffer(blob);
  });
}

/* ---------- the one call the session player uses ---------- */
function downloadWorkbook(wb, baseName) {
  if (hasXLSX()) {
    try {
      const blob = workbookToBlob(wb);
      validateWorkbookBlob(blob, wb).then(v => {
        if (!v.ok) console.warn("Workbook validation failed:", v.why);
      });
      saveBlob(blob, baseName + ".xlsx");
      return { format: "xlsx", name: baseName + ".xlsx" };
    } catch (e) {
      console.warn("xlsx build failed, falling back to csv:", e);
    }
  }
  // fallback: one csv per sheet, zipped only if there is more than one
  if (wb.sheets.length === 1) {
    saveBlob(new Blob([sheetToCSV(wb.sheets[0])], { type: "text/csv;charset=utf-8" }), baseName + ".csv");
    return { format: "csv", name: baseName + ".csv" };
  }
  let joined = "";
  wb.sheets.forEach((s, i) => {
    joined += (i ? "\r\n\r\n" : "") + "### " + s.name + "\r\n" + sheetToCSV(s).replace(/^﻿/, "");
  });
  saveBlob(new Blob(["﻿" + joined], { type: "text/csv;charset=utf-8" }), baseName + ".csv");
  return { format: "csv", name: baseName + ".csv", note: "multi-sheet CSV" };
}

/* ---------- progress export / import ---------- */
function exportProgress() {
  const payload = JSON.stringify(S, null, 2);
  saveBlob(new Blob([payload], { type: "application/json" }), APP_SLUG + "-progress-" + todayISO() + ".json");

function importProgress(file, done) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      if (!obj || typeof obj !== "object" || !("cards" in obj)) throw new Error("not a " + APP_NAME + " progress file");
      S = Object.assign(blankState(), obj);
      saveState();
      done(null);
    } catch (e) { done(e); }
  };
  fr.onerror = () => done(new Error("could not read the file"));
  fr.readAsText(file);
}

const MODULES = {};      // id -> module
const MODULE_ORDER = []; // ids in course order
const SESSIONS = {};     // id -> session
const SESSION_ORDER = [];

/* A module registers itself with its concepts, sessions and the
   functions it unlocks in the reference. */
function defModule(m) {
  MODULES[m.id] = m;
  MODULE_ORDER.push(m.id);
  if (m.concepts) defConcepts(m.id, m.concepts);
  m.sessionIds = [];
  (m.sessions || []).forEach((s, i) => {
    s.module = m.id;
    s.n = i + 1;
    s.id = s.id || (m.id + "s" + (i + 1));
    SESSIONS[s.id] = s;
    SESSION_ORDER.push(s.id);
    m.sessionIds.push(s.id);
  });
}

/* ---------- progress helpers ---------- */
function sessionDone(id) { return !!(S.sessions[id] && S.sessions[id].done); }
function moduleSessions(mid) { return (MODULES[mid] && MODULES[mid].sessionIds) || []; }
function moduleDone(mid) {
  const ss = moduleSessions(mid);
  return ss.length > 0 && ss.every(sessionDone);
}
function moduleProgress(mid) {
  const ss = moduleSessions(mid);
  if (!ss.length) return 0;
  return ss.filter(sessionDone).length / ss.length;
}
/* Modules unlock in order. Nothing is gated behind a score. */
function moduleUnlocked(mid) {
  const i = MODULE_ORDER.indexOf(mid);
  if (i <= 0) return true;
  return moduleDone(MODULE_ORDER[i - 1]);
}
function nextSessionId() {
  for (const id of SESSION_ORDER) if (!sessionDone(id)) return id;
  return null;
}
function currentModuleId() {
  const s = nextSessionId();
  return s ? SESSIONS[s].module : MODULE_ORDER[MODULE_ORDER.length - 1];
}
function drillUnlocked() { return moduleDone("m7"); }

/* Functions appear in the reference only once they have been taught. */
function unlockFns(names) {
  (names || []).forEach(n => { if (!S.fns[n]) S.fns[n] = todayISO(); });
}
function fnUnlocked(n) { return !!S.fns[n]; }

/* Every concept taught up to and including a session, for warm-up quizzes. */
function conceptsBefore(sessionId) {
  const out = [];
  for (const id of SESSION_ORDER) {
    if (id === sessionId) break;
    (SESSIONS[id].concepts || []).forEach(c => { if (out.indexOf(c) < 0) out.push(c); });
  }
  return out;
}

/* ---------- the question bank ---------- */
/* Questions are tagged with a concept id. Types:
   mc   : multiple choice
   type : type the formula you would use
   pred : predict what this formula returns          */
const QUESTIONS = [];
function defQuestions(list) { list.forEach(q => QUESTIONS.push(q)); }
function questionsFor(conceptIds) {
  return QUESTIONS.filter(q => conceptIds.indexOf(q.c) >= 0);
}

/* Pick warm-up questions: prefer concepts whose cards are due, then
   anything taught earlier. Never asks about material not yet covered. */
function pickWarmup(sessionId, count, seed) {
  const taught = conceptsBefore(sessionId);
  if (!taught.length) return [];
  const r = rng(seed || (sessionId + ":" + todayISO()));
  const due = dueCards().filter(id => taught.indexOf(id) >= 0);
  const rest = taught.filter(id => due.indexOf(id) < 0);
  const ordered = due.concat(rShuffle(r, rest));
  const picked = [];
  const usedConcepts = [];
  for (const cid of ordered) {
    if (picked.length >= count) break;
    if (usedConcepts.indexOf(cid) >= 0) continue;
    const qs = questionsFor([cid]);
    if (!qs.length) continue;
    picked.push(rPick(r, qs));
    usedConcepts.push(cid);
  }
  // top up with any taught concept if the due list was short
  if (picked.length < count) {
    const pool = rShuffle(r, questionsFor(taught).filter(q => picked.indexOf(q) < 0));
    for (const q of pool) { if (picked.length >= count) break; picked.push(q); }
  }
  return picked.slice(0, count);
}

/* ---------- gentle return after a gap ---------- */
function daysSinceLastSession() {
  const dates = Object.keys(S.sessions).map(k => S.sessions[k].at).filter(Boolean).sort();
  if (!dates.length) return null;
  return daysBetween(dates[dates.length - 1].slice(0, 10), todayISO());
}

/* ============================================================
   Session player: warm-up quiz -> lesson -> practice -> self-check
   -> concept rating. The order is the point: retrieval before new
   material, doing before checking.
   ============================================================ */

let RUN = null;

function startSession(sid, opts) {
  const s = SESSIONS[sid];
  if (!s) { toast("That session is not built yet."); return; }
  const warm = pickWarmup(sid, 4);
  RUN = {
    sid, s,
    phases: [],
    phase: 0,
    length: (opts && opts.length) || null,
    warm, wIdx: 0, wAnswers: [],
    variant: 0,
    grid: null, checks: [], results: null, checked: false,
    ratings: {},
    startedAt: Date.now(),
    reviewOnly: !!(opts && opts.reviewOnly)
  };
  RUN.phases = ["setup"].concat(warm.length ? ["warmup"] : [], ["lesson", "practice", "check", "wrap"]);
  go("session");
}

function phaseName() { return RUN.phases[RUN.phase]; }
function nextPhase() { RUN.phase = Math.min(RUN.phases.length - 1, RUN.phase + 1); go("session"); }
function prevPhase() { RUN.phase = Math.max(0, RUN.phase - 1); go("session"); }

RENDERERS.session = function (root) {
  clear(root);
  if (!RUN) { go("home"); return; }
  const s = RUN.s, m = MODULES[s.module];

    el("button", { class: "btn btn-ghost btn-sm", onclick: () => leaveSession(), text: "← Leave" }),

  ]));

  root.appendChild(rail);

  ({ setup: viewSetup, warmup: viewWarmup, lesson: viewLesson, practice: viewPractice, check: viewCheck, wrap: viewWrap })[phaseName()](root);
};

function labelFor(p) {
  return ({ setup: "getting started", warmup: "warm-up", lesson: "lesson", practice: "practice", check: "self-check", wrap: "wrap-up" })[p] || p;
}
function leaveSession() {

/* Shared question renderer, used by warm-up, review and drill. */
function renderQuestion(body, q, answered, onAnswer, onNext) {
  const concept = CONCEPTS[q.c];
  if (concept) body.appendChild(el("div", { class: "chipset", style: "margin-bottom:12px" }, [
    el("span", { class: "chip", text: concept.label })
  ]));
  body.appendChild(el("div", { class: "qstem", html: q.q }));
  if (q.formula) body.appendChild(el("code", { class: "f-blk", style: "margin-top:12px", text: q.formula }));
  if (q.data) body.appendChild(miniTable(q.data));

  if (q.t === "type") {
    const inp = el("input", { class: "qtype", style: "margin-top:14px", type: "text", spellcheck: "false", placeholder: "=", value: answered ? answered.given : "" });
    if (answered) inp.disabled = true;
    body.appendChild(inp);
    if (!answered) {
      const go1 = () => {
        const given = inp.value.trim();
        if (!given) { toast("Type a formula, or your best guess at one."); return; }
        onAnswer(gradeTyped(q, given));
      };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go1(); } });
      body.appendChild(el("div", { class: "row", style: "margin-top:12px" }, [
        el("button", { class: "btn btn-primary", onclick: go1, text: "Check" })
      ]));
      setTimeout(() => inp.focus(), 20);
    }
  } else {
    const opts = el("div", { class: "qopts" });
    q.opts.forEach((text, i) => {
      const b = el("button", { class: "qopt", disabled: !!answered }, [
        el("span", { class: "key", text: "ABCD"[i] }),
        el("span", { html: text })
      ]);
      if (answered) {
        if (i === q.a) b.classList.add("right");
        else if (i === answered.given) b.classList.add("wrong");
      } else {
        b.addEventListener("click", () => onAnswer({ given: i, correct: i === q.a }));
      }
      opts.appendChild(b);
    });
    body.appendChild(opts);
  }

  if (answered) {
    const v = el("div", { class: "verdict " + (answered.correct ? "v-good" : "v-bad") });
    v.appendChild(el("div", { class: "vh", text: answered.correct ? "Correct" : "Not this time" }));
    if (q.t === "type" && !answered.correct && answered.note) v.appendChild(el("p", { html: answered.note }));
    if (q.model) v.appendChild(el("p", { style: "margin-top:6px" }, [
      el("span", { class: "tiny muted", text: "A formula that works: " }), el("code", { class: "f", text: q.model })
    ]));
    v.appendChild(el("p", { html: q.why, style: "margin-top:8px" }));
    if (!answered.correct && q.trap) v.appendChild(el("p", { class: "small", style: "margin-top:8px", html: "<strong>The common wrong turn:</strong> " + q.trap }));
    body.appendChild(v);
    body.appendChild(el("div", { class: "row", style: "margin-top:16px" }, [
      el("button", { class: "btn btn-primary row-end", onclick: onNext, text: "Next" })
    ]));
  }
}

function miniTable(data) {
  const t = el("table", { class: "reftable", style: "margin-top:12px;font-family:var(--mono);font-size:13px" });
  const head = el("tr");
  head.appendChild(el("th", { text: "" }));
  data.cols.forEach(c => head.appendChild(el("th", { text: c })));
  t.appendChild(head);
  data.rows.forEach((r, i) => {
    const tr = el("tr");
    tr.appendChild(el("th", { text: String(data.startRow ? data.startRow + i : i + 1), style: "text-align:right;color:var(--ink-3)" }));
    r.forEach(v => tr.appendChild(el("td", { text: v === null ? "" : String(v), style: typeof v === "number" ? "text-align:right" : "" })));
    t.appendChild(tr);
  });
  return el("div", { style: "overflow-x:auto" }, [t]);
}

/* Grade a typed formula by actually running it. */
function gradeTyped(q, given) {
  const norm = given.trim();
  if (q.check) {
    const sh = new Sheet("Q", 40, 12);
    const spec = q.check.sheet || {};
    for (const ref in spec) {
      const p = parseA1(ref);
      if (!p) continue;
      const v = spec[ref];
      if (typeof v === "string" && v[0] === "=") sh.setFormula(p.r, p.c, v.slice(1));
      else sh.set(p.r, p.c, v);
    }
    const out = computeFormula(norm, sh.ctx());
    if (out && out.parseError) return { given, correct: false, note: "Excel could not read that: " + esc(out.parseError) };
    if (isErr(out)) return { given, correct: false, note: "That returns " + out.err + ". " + errorHelp(out.err) };
    let ok = valueMatches(out, q.check.expect, q.check.tol);
    let note = "";
    if (ok && q.check.mustUse) {
      const up = norm.toUpperCase();
      const need = Array.isArray(q.check.mustUse) ? q.check.mustUse : [q.check.mustUse];
      if (!need.some(n => up.includes(n.toUpperCase()))) {
        ok = false; note = "The answer is right, but the question asks for " + need.join(" or ") + ".";
      }
    }
    if (!ok && !note) note = "That gives " + (out === null ? "an empty result" : String(isRange(out) ? "a range" : out)) + ", and the answer is " + displayExpected(q.check.expect) + ".";
    return { given, correct: ok, note };
  }
  const clean = t => String(t).toUpperCase().replace(/\s+/g, "").replace(/^=/, "");
  const accepts = (q.accept || []).map(clean);
  return { given, correct: accepts.indexOf(clean(norm)) >= 0, note: "" };
}

/* Declarative lesson blocks keep every lesson to the same shape. */
function renderBlocks(target, blocks) {
  blocks.forEach(b => {
    if (typeof b === "string") { target.appendChild(el("p", { html: b })); return; }
    if (b.lead) { target.appendChild(el("p", { class: "lead-blunt", html: b.lead })); return; }
    if (b.h) { target.appendChild(el("h3", { text: b.h })); return; }
    if (b.p) { target.appendChild(el("p", { html: b.p })); return; }
    if (b.ul) { target.appendChild(el("ul", {}, b.ul.map(x => el("li", { html: x })))); return; }
    if (b.ol) { target.appendChild(el("ol", {}, b.ol.map(x => el("li", { html: x })))); return; }
    if (b.steps) { target.appendChild(el("ol", { class: "steps" }, b.steps.map(x => el("li", { html: x })))); return; }
    if (b.f) { target.appendChild(el("code", { class: "f-blk", text: b.f })); return; }
    if (b.table) { target.appendChild(miniTable(b.table)); return; }
    if (b.charts) { target.appendChild(chartCards(b.charts)); return; }
    if (b.why) target.appendChild(callout("why", "Why it works this way", b.why));
    if (b.trap) target.appendChild(callout("trap", "Where people go wrong", b.trap));
    if (b.pro) target.appendChild(callout("pro", "What professionals do", b.pro));
    if (b.web) target.appendChild(callout("web", "Excel for the web", b.web));
    if (b.desk) target.appendChild(callout("desk", "On desktop Excel, faster", b.desk));
    if (b.path) {

      b.path.forEach((x, i) => { if (i) p.appendChild(el("i", { text: "›" })); p.appendChild(el("span", { text: x })); });
      target.appendChild(p);
    }
  });
}
function callout(kind, head, body) {

/* ============================================================

   ============================================================ */
function buildPractice() {
  const s = RUN.s;
  const seed = s.id + ":" + RUN.variant;
  const p = s.practice(seed);
  RUN.practiceData = p;
  RUN.checks = p.checks.filter(c => RUN.length === "full" || !c.ext);
  RUN.tasks = p.tasks.filter(t => RUN.length === "full" || !t.ext);
  /* Highlight every cell the learner is meant to fill, not only the
     sampled ones the answer key checks. */
  const highlight = RUN.checks.map(c => c.cell).filter(Boolean)
    .concat((p.highlight || []).filter(ref => RUN.length === "full" || !p.extHighlight || p.extHighlight.indexOf(ref) < 0));
  RUN.grid = new GridView(p.sheet, {
    targets: highlight,
    maxRows: p.maxRows, maxCols: p.maxCols,
    startRow: p.startRow, startCol: p.startCol,
    hint: p.hint, formatBar: p.formatBar, fillBar: p.fillBar, colWidth: p.colWidth
  });
  RUN.pivot = p.pivot ? new PivotView(p.pivot.data, p.pivot.fields, { initial: p.pivot.initial }) : null;
  RUN.done = {};
  RUN.checked = false;
  RUN.results = null;
}

/* Checks that inspect the pivot rather than a cell. */
function checkPivot(checks) {
  const out = [];
  (checks || []).forEach(chk => {
    if (!chk.pivotSpec) return;
    const ok = RUN.pivot && RUN.pivot.matchesSpec(chk.pivotSpec);
    out.push({
      cell: "pivot", chk, ok,
      note: ok ? "" : "The pivot is not set up the way the task asked. Wanted " +
        Object.keys(chk.pivotSpec).map(k => k + " = " + chk.pivotSpec[k]).join(", ") + "."
    });
  });
  return out;
}

/* ============================================================
   A working pivot table.
   Reading about pivot tables teaches nothing, so this is the real
   thing: the same four areas as Excel's field list, the same value
   field settings, and the same date grouping. Drive it, watch the
   cross-tab rebuild, read the answer off it.
   ============================================================ */

const PIVOT_AGGS = [
  { id: "sum", label: "Sum", needsNumber: true },
  { id: "count", label: "Count", needsNumber: false },
  { id: "avg", label: "Average", needsNumber: true },
  { id: "max", label: "Max", needsNumber: true },
  { id: "min", label: "Min", needsNumber: true },
  { id: "pct", label: "% of grand total", needsNumber: true }
];

const DATE_GROUPS = [
  { id: "none", label: "each date" },
  { id: "month", label: "month" },
  { id: "year", label: "year" }
];

/* ---------- the calculation ---------- */
function pivotKey(rec, field, fields, grouping) {
  const v = rec[field];
  const meta = fields.find(f => f.name === field);
  if (meta && meta.type === "date" && typeof v === "number") {
    const d = serialToDate(v);
    if (grouping === "month") return { sort: d.getUTCFullYear() * 100 + d.getUTCMonth(), label: formatDate(v, "mmm yyyy") };
    if (grouping === "year") return { sort: d.getUTCFullYear(), label: String(d.getUTCFullYear()) };
    return { sort: v, label: formatDate(v, "dd/mm/yyyy") };
  }
  if (v === null || v === undefined || v === "") return { sort: "￿", label: "(blank)" };
  return { sort: typeof v === "number" ? v : String(v).toUpperCase(), label: String(v) };
}

function aggregate(values, agg, grand) {
  const nums = values.filter(v => typeof v === "number");
  switch (agg) {
    case "count": return values.length;
    case "sum": return nums.reduce((a, b) => a + b, 0);
    case "avg": return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
    case "max": return nums.length ? Math.max.apply(null, nums) : null;
    case "min": return nums.length ? Math.min.apply(null, nums) : null;
    case "pct": {
      const t = nums.reduce((a, b) => a + b, 0);
      return grand ? t / grand : null;
    }
  }
  return null;
}

/* spec: {rowField, colField, valueField, agg, filterField, filterValue, grouping} */
function buildPivot(data, fields, spec) {
  let recs = data;
  if (spec.filterField && spec.filterValue && spec.filterValue !== "(all)") {
    recs = recs.filter(r => String(r[spec.filterField]) === String(spec.filterValue));
  }

  const rowMap = new Map(), colMap = new Map(), cellMap = new Map();
  const push = (m, k, rec) => { if (!m.has(k.label)) m.set(k.label, { sort: k.sort, recs: [] }); m.get(k.label).recs.push(rec); };

  recs.forEach(rec => {
    const rk = spec.rowField ? pivotKey(rec, spec.rowField, fields, spec.grouping) : { sort: 0, label: "All" };
    const ck = spec.colField ? pivotKey(rec, spec.colField, fields, spec.grouping) : { sort: 0, label: "Total" };
    push(rowMap, rk, rec); push(colMap, ck, rec);
    const key = rk.label + "␀" + ck.label;
    if (!cellMap.has(key)) cellMap.set(key, []);
    cellMap.get(key).push(rec);
  });

  const cmp = (a, b) => (a[1].sort < b[1].sort ? -1 : a[1].sort > b[1].sort ? 1 : 0);
  const rowKeys = Array.from(rowMap.entries()).sort(cmp).map(e => e[0]);
  const colKeys = Array.from(colMap.entries()).sort(cmp).map(e => e[0]);

  const valuesOf = list => list.map(r => r[spec.valueField]);
  const grandVals = valuesOf(recs).filter(v => typeof v === "number");
  const grandSum = grandVals.reduce((a, b) => a + b, 0);

  const cell = (rl, cl) => {
    const list = cellMap.get(rl + "␀" + cl);
    return list ? aggregate(valuesOf(list), spec.agg, grandSum) : null;
  };
  const rowTotal = rl => aggregate(valuesOf(rowMap.get(rl).recs), spec.agg, grandSum);
  const colTotal = cl => aggregate(valuesOf(colMap.get(cl).recs), spec.agg, grandSum);
  const grand = aggregate(valuesOf(recs), spec.agg, grandSum);

  return { rowKeys, colKeys, cell, rowTotal, colTotal, grand, count: recs.length };
}

/* ---------- the view ---------- */
function PivotView(data, fields, opts) {
  this.data = data;
  this.fields = fields;
  this.opts = opts || {};
  this.spec = Object.assign({
    rowField: "", colField: "", valueField: "", agg: "sum",
    filterField: "", filterValue: "(all)", grouping: "month"
  }, this.opts.initial || {});
  this.root = null;
}

PivotView.prototype.fieldNames = function () { return this.fields.map(f => f.name); };
PivotView.prototype.numericFields = function () { return this.fields.filter(f => f.type === "number").map(f => f.name); };

PivotView.prototype.render = function () {
  const wrap = el("div", { class: "pivot" });
  this.root = wrap;
  wrap.appendChild(this.renderFieldList());
  this.tableHost = el("div", { class: "pivot-out" });
  wrap.appendChild(this.tableHost);
  this.paint();
  return wrap;
};

PivotView.prototype.sel = function (label, value, options, onChange, hint) {
  const s = el("select", { class: "pv-sel", onchange: e => { onChange(e.target.value); } });
  options.forEach(o => {
    const val = typeof o === "string" ? o : o.id;
    const txt = typeof o === "string" ? (o || "— none —") : o.label;
    const opt = el("option", { value: val, text: txt });
    if (String(val) === String(value)) opt.selected = true;
    s.appendChild(opt);
  });
  return el("label", { class: "pv-field" }, [
    el("span", { class: "pv-label", text: label }),
    s,
    hint ? el("span", { class: "pv-hint", text: hint }) : null
  ]);
};

PivotView.prototype.renderFieldList = function () {
  const box = el("div", { class: "pivot-fields" });
  const names = [""].concat(this.fieldNames());
  const dateField = this.fields.find(f => f.type === "date");
  const showGrouping = (this.spec.rowField && this.fields.find(f => f.name === this.spec.rowField && f.type === "date")) ||
                       (this.spec.colField && this.fields.find(f => f.name === this.spec.colField && f.type === "date"));

  box.appendChild(this.sel("Rows", this.spec.rowField, names, v => { this.spec.rowField = v; this.refresh(); }));
  box.appendChild(this.sel("Columns", this.spec.colField, names, v => { this.spec.colField = v; this.refresh(); }));
  box.appendChild(this.sel("Values", this.spec.valueField, [""].concat(this.fieldNames()), v => { this.spec.valueField = v; this.refresh(); }));
  box.appendChild(this.sel("Summarise by", this.spec.agg, PIVOT_AGGS, v => { this.spec.agg = v; this.refresh(); }));

  const filterVals = ["(all)"];
  if (this.spec.filterField) {
    const seen = [];
    this.data.forEach(r => { const v = String(r[this.spec.filterField]); if (seen.indexOf(v) < 0) seen.push(v); });
    seen.sort().forEach(v => filterVals.push(v));
  }
  box.appendChild(this.sel("Filter", this.spec.filterField, names, v => { this.spec.filterField = v; this.spec.filterValue = "(all)"; this.refresh(); }));
  if (this.spec.filterField) {
    box.appendChild(this.sel("Showing", this.spec.filterValue, filterVals, v => { this.spec.filterValue = v; this.refresh(); }));
  }
  if (showGrouping && dateField) {
    box.appendChild(this.sel("Group dates by", this.spec.grouping, DATE_GROUPS, v => { this.spec.grouping = v; this.refresh(); }));
  }
  return box;
};

PivotView.prototype.refresh = function () {
  clear(this.root);
  this.root.appendChild(this.renderFieldList());
  this.tableHost = el("div", { class: "pivot-out" });
  this.root.appendChild(this.tableHost);
  this.paint();
  if (this.opts.onChange) this.opts.onChange(this);
};

PivotView.prototype.fmt = function (v) {
  if (v === null || v === undefined) return "";
  if (this.spec.agg === "count") return fmtNum(v, 0);
  if (this.spec.agg === "pct") return fmtNum(xround(v * 100, 1), 1) + "%";
  const meta = this.fields.find(f => f.name === this.spec.valueField);
  if (meta && meta.money) return gbp(v);
  return fmtNum(xround(v, 2), null);
};

PivotView.prototype.paint = function () {
  const host = clear(this.tableHost);
  if (!this.spec.valueField) {
    host.appendChild(el("p", { class: "pivot-empty", text: "Choose a field to summarise under Values, and a field for Rows. An empty pivot table is not an error; it is a pivot table with nothing in it yet." }));
    return;
  }
  const p = buildPivot(this.data, this.fields, this.spec);
  this.last = p;

  const t = el("table", { class: "pivot-table" });
  const head = el("tr");
  head.appendChild(el("th", { text: this.spec.rowField || "" }));
  if (this.spec.colField) p.colKeys.forEach(c => head.appendChild(el("th", { text: c })));
  head.appendChild(el("th", { class: "tot", text: this.spec.colField ? "Total" : (PIVOT_AGGS.find(a => a.id === this.spec.agg).label + " of " + this.spec.valueField) }));
  t.appendChild(head);

  p.rowKeys.forEach(rk => {
    const tr = el("tr");
    tr.appendChild(el("th", { class: "rowhead", text: rk }));
    if (this.spec.colField) p.colKeys.forEach(ck => tr.appendChild(el("td", { text: this.fmt(p.cell(rk, ck)) })));
    tr.appendChild(el("td", { class: "tot", text: this.fmt(p.rowTotal(rk)) }));
    t.appendChild(tr);
  });

  const foot = el("tr", { class: "grand" });
  foot.appendChild(el("th", { text: "Grand total" }));
  if (this.spec.colField) p.colKeys.forEach(ck => foot.appendChild(el("td", { text: this.fmt(p.colTotal(ck)) })));
  foot.appendChild(el("td", { class: "tot", text: this.fmt(p.grand) }));
  t.appendChild(foot);

  host.appendChild(el("div", { style: "overflow-x:auto" }, [t]));
  host.appendChild(el("p", { class: "pivot-note", text: p.count + " of " + this.data.length + " rows included" +
    (this.spec.filterField && this.spec.filterValue !== "(all)" ? " (filtered to " + this.spec.filterValue + ")" : "") + "." }));
};

/* Read a figure out of the current pivot, for answer checking. */
PivotView.prototype.valueAt = function (rowLabel, colLabel) {
  if (!this.last) return null;
  if (colLabel === undefined || colLabel === null) return this.last.rowTotal(rowLabel);
  return this.last.cell(rowLabel, colLabel);
};
PivotView.prototype.grandTotal = function () { return this.last ? this.last.grand : null; };

/* Does the current configuration match what the task asked for? */
PivotView.prototype.matchesSpec = function (want) {
  for (const k in want) {
    if (String(this.spec[k] || "").toUpperCase() !== String(want[k] || "").toUpperCase()) return false;
  }
  return true;
};

/* ============================================================
   Review, progress, reference, drill, settings
   ============================================================ */

/* ---------- Review: the spaced repetition queue ---------- */
let REVIEW = null;

RENDERERS.review = function (root) {
  clear(root);
  const due = dueCards();

  if (!REVIEW) {
    if (!due.length) {
      const nextDue = Object.keys(S.cards)
        .filter(id => CONCEPTS[id] && S.cards[id].box > 0)
        .map(id => S.cards[id].due).sort()[0];
      root.appendChild(el("div", { class: "card" }, [
        el("h1", { text: "Nothing due" }),
        el("p", { class: "lede", style: "margin-top:8px", text: conceptsIntroduced().length ? "Every concept you have met is still inside its interval. Coming back early does not help; the spacing is what does the work." : "Once you finish a session, the concepts from it enter the review queue." }),
        nextDue ? el("p", { class: "small muted", style: "margin-top:10px", text: "Next review falls due on " + fmtDate(nextDue) + "." }) : null,
        el("div", { class: "row", style: "margin-top:16px" }, [
          el("button", { class: "btn btn-primary", onclick: () => go("home"), text: "Back to the course" }),
          conceptsIntroduced().length ? el("button", { class: "btn", onclick: () => startReview(true), text: "Review early anyway" }) : null
        ])
      ]));
      return;
    }
    root.appendChild(el("div", { class: "card" }, [
      el("div", { class: "eyebrow", text: "Spaced review" }),
      el("h1", { text: due.length + " " + plural(due.length, "concept") + " due", style: "margin-top:6px" }),
      el("p", { class: "lede", style: "margin-top:8px", text: "Short questions on things you learned days ago. Answer from memory. Roughly ten minutes." }),
      el("div", { class: "chipset", style: "margin-top:14px" }, due.slice(0, 12).map(id => el("span", { class: "chip", text: CONCEPTS[id].label }))),
      el("div", { class: "row", style: "margin-top:18px" }, [
        el("button", { class: "btn btn-primary btn-lg", onclick: () => startReview(false), text: "Start review" })
      ])
    ]));
    return;
  }

  /* running a review */
  const q = REVIEW.qs[REVIEW.i];
  if (!q) {
    const right = REVIEW.answers.filter(a => a.correct).length;
    const total = REVIEW.answers.length;
    root.appendChild(el("div", { class: "card" }, [
      el("h1", { text: "Review done" }),
      el("p", { class: "lede", style: "margin-top:8px", text: right + " of " + total + " from memory." }),
      el("p", { class: "small muted", style: "margin-top:8px", text: "Everything you got right has moved to a longer interval. Everything you missed comes back tomorrow." }),
      el("div", { class: "row", style: "margin-top:16px" }, [
        el("button", { class: "btn btn-primary", onclick: () => { REVIEW = null; go("home"); }, text: "Back to the course" }),
        dueCount() > 0 ? el("button", { class: "btn", onclick: () => startReview(false), text: "Keep going (" + dueCount() + " left)" }) : null
      ])
    ]));
    REVIEW = null;
    return;
  }
  const box = el("div", { class: "qbox" });
  const dots = el("div", { class: "qdots" });
  REVIEW.qs.forEach((_, i) => {
    const a = REVIEW.answers[i];
    dots.appendChild(el("i", { class: i === REVIEW.i ? "now" : (a ? (a.correct ? "done" : "miss") : "") }));
  });
  box.appendChild(el("div", { class: "qhead" }, [el("span", { class: "eyebrow", text: "Review " + (REVIEW.i + 1) + " of " + REVIEW.qs.length }), dots]));
  const body = el("div", { class: "qbody" });
  box.appendChild(body);
  renderQuestion(body, q, REVIEW.answers[REVIEW.i], res => {
    if (!REVIEW.answers[REVIEW.i]) { REVIEW.answers[REVIEW.i] = res; gradeCard(q.c, res.correct); renderNav(); }
    go("review");
  }, () => { REVIEW.i++; go("review"); });
  root.appendChild(box);
};

function startReview(early) {
  const pool = early ? conceptsIntroduced() : dueCards();
  const r = rng("review:" + todayISO() + ":" + pool.length);
  const qs = [];
  rShuffle(r, pool).forEach(cid => {
    const opts = questionsFor([cid]);
    if (opts.length) qs.push(rPick(r, opts));
  });
  if (!qs.length) { toast("No questions are written for those concepts yet."); return; }
  REVIEW = { qs: qs.slice(0, 12), i: 0, answers: [] };
  go("review");
}
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00Z");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
}

/* ---------- Progress ---------- */
