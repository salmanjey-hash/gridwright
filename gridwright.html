/* Lock every cell that currently holds something, then unlock the
   listed answer cells. Keeps practice sheets from being edited into
   nonsense while leaving the tasks writable. */
function lockSheet(sh, exceptRefs) {
  for (const k in sh.data) sh.data[k].locked = true;
  (exceptRefs || []).forEach(ref => {
    const p = parseA1(ref);
    if (!p) return;
    const c = sh.cell(p.r, p.c);
    if (c) c.locked = false;
  });
}
function put(sh, ref, value, opts) {
  const p = parseA1(ref);
  if (!p) return;
  if (typeof value === "string" && value[0] === "=") sh.setFormula(p.r, p.c, value.slice(1), opts);
  else sh.set(p.r, p.c, value, opts);
}
function label(sh, ref, text) { put(sh, ref, text, { locked: true, hdr: true }); }
function note(sh, ref, text) { put(sh, ref, text, { locked: true }); }
function valAt(sh, ref) {
  const p = parseA1(ref);
  return p ? sh.value(p.r, p.c) : null;
}

/* Compute an answer with the live engine rather than in JavaScript, so
   the key and the learner's formula are graded by the same code. If
   these ever disagree, the tests fail rather than the learner. */
function solve(sh, formula) {
  const out = computeFormula(formula, sh.ctx());
  if (out && out.parseError) throw new Error("answer key does not parse: " + formula + " (" + out.parseError + ")");
  if (isErr(out)) throw new Error("answer key errors: " + formula + " -> " + out.err);
  return isRange(out) ? (out.cells[0] ? out.cells[0][0] : null) : out;
}

const M1S2 = {
  title: "What Excel thinks your data is",
  aim: "Tell numbers, text and dates apart on sight, and stop Excel quietly changing your data behind your back.",
  why: "Roughly half of all beginner Excel problems are one problem wearing different hats: a number that Excel is storing as text. Once you can spot it in two seconds, that half disappears.",
  concepts: ["m1.types", "m1.textnum", "m1.dateserial", "m1.format"],
  unlocks: [],
  lesson: [
    { lead: "Excel decides what your data is the moment you press Enter, and it does not ask." },
    { p: "Every cell holds one of four things: a number, some text, a date or time, or a TRUE/FALSE value. Dates are really numbers in disguise, which is covered below. What matters is that Excel guesses which one you meant, and it guesses the instant you finish typing." },
    { h: "The two-second test" },
    { p: "Type something into a blank cell and look at where it lands." },
    {
      ul: [
        "It sticks to the <strong>right</strong> of the cell: Excel took it as a number or a date.",

      ]

    { p: "That is the whole test. No menus, no functions. A column of figures where one value hugs the left edge has one broken value, and you have just found it by looking." },
    { why: "The alignment is not a style choice. It is Excel showing you its decision. Right-aligned means it believes the value can be added up; left-aligned means it believes the value is a label. When you later override alignment for looks, you blind yourself to this, which is why professionals leave number alignment alone." },
    { h: "How numbers become text without you asking" },
    {
      ul: [
        "A space anywhere in the cell. <span class='f'>1250 </span> with a trailing space is text.",
        "A stray letter or symbol typed alongside, such as <span class='f'>1250 units</span> or <span class='f'>approx 1250</span>.",
        "Data pasted or imported from a website, a PDF or a bank statement. This is the usual culprit, and it usually arrives with invisible spaces.",
        "A leading apostrophe, as in <span class='f'>'0123</span>. This one is deliberate: it tells Excel to keep the value exactly as typed. It is the correct way to store a sort code, a phone number or any code with a leading zero."
      ]
    },
    { trap: "A number stored as text does not error. It sits there looking perfectly normal, and SUM silently skips it. Your total is wrong and nothing on screen says so. This is the single most expensive habit-forming mistake in Excel, and the reason this module comes before formulas." },
    { h: "Dates are numbers wearing a costume" },
    { p: "Excel stores a date as a count of days since 31 December 1899. <span class='f'>1</span> is 1 January 1900. <span class='f'>45352</span> is 1 March 2024. What you see on screen is only a format laid over that number." },
    { p: "This sounds like trivia until you need it. It is why you can subtract one date from another and get a sensible number of days. It is also why a date sometimes suddenly displays as <span class='f'>45352</span>: nothing broke, the costume just came off." },
    { f: "=DATE(2024,3,10) - DATE(2024,3,1)      gives 9" },
    { web: "Excel for the web reads dates using the region set on your Microsoft account. If yours is set to the United States, typing <span class='f'>03/04/2024</span> gives 4 March, not 3 April. Check it once under your account settings and save yourself a genuinely nasty class of error. When in doubt, type <span class='f'>2024-04-03</span>, which is unambiguous everywhere." },
    { h: "Formatting changes the costume, not the value" },
    { p: "Formatting is how a value is displayed. It never changes what is stored. Format <span class='f'>3.14159</span> to two decimal places and the cell shows <span class='f'>3.14</span>, but the cell still contains 3.14159 and every calculation still uses 3.14159." },
    { trap: "This catches people out constantly. A column formatted to zero decimal places can show 10, 10, 10 and total 31, because the real values are 10.4, 10.3 and 10.4. Nothing is broken. The display is rounded and the maths is not. If you need the stored value rounded, you need the ROUND function, which arrives in Module 2." },
    { pro: "Format for the reader at the end, not while you work. Store money as a plain number and apply a currency format on top. Never type <span class='f'>£3.20</span> as text into a cell, and never type the pound sign yourself if you can format it instead." },
    { web: "In Excel for the web the number formats sit on the Home tab: <span class='path'><span>Home</span></span> then the drop-down that reads General, plus the quick buttons for currency, percent and comma. In the practice grid below you get the same choices as buttons above the sheet." }
  ],
  reflect: [
    "Look at any spreadsheet you already have. Scan one numeric column for a value hugging the left edge.",

        { id: "t4", text: "D6 holds an amount stored as text, because a pound sign was typed into the cell. Retype it as a plain number, then format it as currency.", cell: "D6" },
        { id: "t5", text: "Format C3 as a date so it matches the others.", cell: "C3" },
        { id: "t6", text: "In E2, enter the reference code <strong>0417</strong> so that the leading zero survives.", cell: "E2" },
        { id: "t7", text: "Select C3 and press the <strong>General</strong> format button. A number appears: that is the day count Excel stores. Type it into F2, then put C3 back to <strong>Date</strong>.", cell: "F2", ext: true }
      ],
      checks: [
        {

          task: "C3: a date stored as text, made into a real date.",
          answer: "17/03/2024   (stored as 45368)",
          why: "Once it is a real date, Excel can sort it into order, subtract it from another date, and group it by month in a pivot table. As text it can do none of those, and it will sort 17/03 before 02/04 because text sorts character by character.",
          wrongWay: "Formatting the cell as a date without retyping the value. Formatting only changes the costume; a text value stays text no matter what format you put on it. You have to re-enter it."
        },

          why: "Same reasoning. Note the stored numbers: 45368 and 45384 are 16 days apart, which is exactly the gap between the two dates. That is the day-count system doing its job.",
          wrongWay: "Typing <span class='f'>2 April</span> without a year. Excel will fill in the current year silently, and your 2024 invoice quietly becomes a " + new Date().getFullYear() + " one."
        },

    { id: "m1.format", label: "Format is not value", blurb: "Display changes; the stored number does not." },
    { id: "m1.freeze", label: "Freeze panes", blurb: "Keeping headings visible while you scroll." },
    { id: "m1.sort", label: "Sorting rows", blurb: "Select one cell inside the data, then sort." },
    { id: "m1.sorttrap", label: "The single-column sort trap", blurb: "How sorting silently scrambles a file." },

/* ============================================================
   Module 2: Formulas that think
   Four sessions. Each one is made tedious on purpose so the next
   tool arrives as a relief rather than a rule: adding five cells
   by hand earns SUM, and typing the same formula six times earns
   fill-down.
   ============================================================ */

const M2_ORDER = [
  { item: "Oat milk, 12 litres", unit: 1.45 },
  { item: "Arabica beans, 1kg", unit: 18.90 },
  { item: "Paper cups, 500", unit: 24.50 },
  { item: "Sourdough loaf", unit: 3.75 },
  { item: "Butter, 250g", unit: 2.10 }
];

/* ============================================================
   Session 1
   ============================================================ */
const M2S1 = {
  title: "The equals sign, and why you never type a number twice",
  aim: "Write your first formulas, and learn the habit that separates a spreadsheet from a calculator.",
  why: "A calculator gives you an answer. A spreadsheet gives you an answer that <em>updates</em>. The difference is entirely in whether you point at cells or type numbers, and it is the single habit that makes everything later possible.",
  concepts: ["m2.equals", "m2.refnotnum", "m2.arith", "m2.brackets"],
  unlocks: [],
  lesson: [
    { lead: "A formula is a question you leave in a cell, and Excel answers it again every time the data changes." },
    { p: "Every formula starts with an equals sign. That is how Excel knows you are asking rather than typing. Without it, <span class='f'>2+2</span> is a piece of text that says 2+2. With it, <span class='f'>=2+2</span> is a cell that shows 4." },
    { h: "Point at cells, do not type numbers" },
    { p: "You could write <span class='f'>=12*1.45</span>. It gives 17.4 and it is wrong, in the way that matters." },
    { p: "Write <span class='f'>=B2*C2</span> instead. Now the cell says <em>multiply whatever is in B2 by whatever is in C2</em>. When the price changes next month you edit one cell and every total that depends on it corrects itself." },
    { why: "A typed number is a fact frozen at the moment you typed it. A reference is a live link. The moment you type a number into a formula you have created something that will silently be out of date, and nothing will tell you when it happens. Auditors call these hard-coded values, and finding them is a large part of checking somebody else's spreadsheet." },
    { pro: "The one exception professionals accept: a genuine constant that is part of the arithmetic rather than part of the data. The 2 in <span class='f'>=(A1+B1)/2</span> is fine. A VAT rate is not, because rates change; that belongs in its own cell." },
    { h: "The operators" },
    {
      ul: [
        "<span class='f'>+</span> add, <span class='f'>-</span> subtract",
        "<span class='f'>*</span> multiply. Not the letter x. Excel will not understand x.",
        "<span class='f'>/</span> divide. Not a backslash.",
        "<span class='f'>^</span> raise to a power, so <span class='f'>=3^2</span> is 9",
        "<span class='f'>&amp;</span> joins text together, which comes back in Module 4"
      ]
    },
    { h: "Order of operations, and the brackets that save you" },
    { p: "Excel does not work left to right. It does powers first, then multiplication and division, then addition and subtraction. This is the same order you were taught at school, and it is the source of a genuinely common reporting error." },
    { p: "Say five line totals sit in D2 to D6 and you want their average. Write this and you get nonsense:" },
    { f: "=D2+D3+D4+D5+D6/5        wrong" },
    { p: "Excel divides D6 by 5 first, then adds the other four to it. Put brackets round the part you want done first:" },
    { f: "=(D2+D3+D4+D5+D6)/5      right" },
    { trap: "This error does not announce itself. It returns a plausible-looking number, usually a bit too large, and it will sit in a report until somebody checks it by hand. When a figure looks slightly off rather than obviously broken, brackets are the first thing to check." },
    { h: "Reading a formula back" },
    { p: "Click a cell that contains a formula and look at the formula bar along the top. The cell shows the answer; the bar shows the question. Pressing <kbd>F2</kbd> does the same thing and also highlights each referenced cell in colour, which is the quickest way to see whether a formula is pointing where you think." },
    { web: "Excel for the web behaves identically here. One small difference: the desktop version has a Formulas tab with Trace Precedents, which draws arrows from a formula to the cells it uses. The web version does not, so <kbd>F2</kbd> and its colour highlighting is your equivalent." }
  ],
  reflect: [
    "Look back at the total you built. If a price changed, how many cells would you have to edit? If the answer is more than one, something is hard-coded.",
    "The average you calculated with brackets: try it once without them and watch how believable the wrong answer looks."
  ],

  practice: function (seed) {
    const r = rng(seed);
    const qty = M2_ORDER.map(() => rInt(r, 2, 24));
    const sh = new Sheet("Order", 16, 5);

    sh.writeTable(0, 0, ["Item", "Qty", "Unit price", "Line total"],
      M2_ORDER.map((o, i) => [o.item, qty[i], o.unit, null]), [null, null, GBP2, GBP2]);

    label(sh, "A8", "Order total");
    label(sh, "A10", "Average line total");
    note(sh, "C10", "brackets needed");
    lockSheet(sh, ["D2", "D3", "D4", "D5", "D6", "D8", "D10", "D12"]);
    ["D2", "D3", "D4", "D5", "D6", "D8", "D10", "D12"].forEach(ref => {
      const p = parseA1(ref); sh.ensure(p.r, p.c).fmt = GBP2;
    });
    label(sh, "A12", "Total after 10% discount");
    sh.cell(parseA1("A12").r, parseA1("A12").c).locked = true;
    sh.rows = 14; sh.cols = 5;

    /* Solve with the live engine so the key cannot drift from the data */
    const tmp = new Sheet("tmp", 16, 5);
    M2_ORDER.forEach((o, i) => { tmp.set(1 + i, 1, qty[i]); tmp.set(1 + i, 2, o.unit); });
    const lines = M2_ORDER.map((o, i) => xround(qty[i] * o.unit, 2));
    lines.forEach((v, i) => tmp.set(1 + i, 3, v));
    const total = solve(tmp, "=SUM(D2:D6)");
    const avg = solve(tmp, "=(D2+D3+D4+D5+D6)/5");

    return {
      sheet: sh,
      maxRows: 14, maxCols: 5, startRow: 1, startCol: 3, formatBar: false,
      brief: {
        title: "A supplier order, worked out properly",
        body: "Five items, a quantity and a unit price for each. Work out every line total, then the order total, " +
          "then the average line. Every answer must be a formula that points at cells. " +
          "If you find yourself typing a number that already exists somewhere on the sheet, stop and point at it instead."
      },
      hint: "Formulas start with <strong>=</strong>. Multiply with <strong>*</strong>. You will be typing the same shape of formula five times, which is annoying; session 3 fixes that permanently.",
      tasks: [
        { id: "t1", text: "In D2, work out the line total for the first item: quantity multiplied by unit price.", cell: "D2" },
        { id: "t2", text: "Do the same for D3, D4 and D5.", cell: "D3" },
        { id: "t3", text: "And D6, the last line.", cell: "D6" },
        { id: "t4", text: "In D8, add the five line totals together. Use the plus sign, not a function; SUM arrives next session.", cell: "D8" },
        { id: "t5", text: "In D10, work out the average line total <strong>without using a function</strong>. Add the five up and divide by 5, and think about where the brackets go.", cell: "D10" },
        { id: "t6", text: "In D12, work out the order total after a 10% discount.", cell: "D12", ext: true }
      ],
      checks: [
        {
          cell: "D2", expect: lines[0], needFormula: true, mustNotUse: ["SUM"],
          task: "D2: the first line total.",
          answer: "=B2*C2",
          why: "Quantity times unit price, pointing at both cells. Change the quantity in B2 and this corrects itself, which is the entire reason for using a spreadsheet rather than a calculator.",
          wrongWay: "Typing <span class='f'>=" + qty[0] + "*" + M2_ORDER[0].unit + "</span>, or worse, typing the answer " + lines[0].toFixed(2) + " straight in. Both are right today and wrong the moment anything changes, and neither leaves any trace that it was hard-coded."
        },
        {
          cell: "D3", expect: lines[1], needFormula: true,
          task: "D3: the second line total.",
          answer: "=B3*C3",
          why: "The same instruction, one row down. Every reference moves with it.",
          wrongWay: "Leaving this blank and jumping to the total. The order total below adds these five cells, so a gap here makes that wrong too."
        },
        {
          cell: "D4", expect: lines[2], needFormula: true,
          task: "D4: the third line total.",
          answer: "=B4*C4",
          why: "Same again. By now the repetition should be irritating, which is the point.",
          wrongWay: "Typing the answer from a calculator. It is faster for one row and useless for two hundred."
        },
        {
          cell: "D5", expect: lines[3], needFormula: true,
          task: "D5: the fourth line total.",
          answer: "=B5*C5",
          why: "Four down, one to go. Session 3 replaces all of this with one formula and a drag.",
          wrongWay: "Copying D2 by hand and forgetting to change the row numbers."
        },
        {
          cell: "D6", expect: lines[4], needFormula: true,
          task: "D6: the last line total.",
          answer: "=B6*C6",
          why: "Identical shape, one row further down. Noticing that every one of these five formulas is the same instruction moved down a row is the whole idea behind session 3.",
          wrongWay: "Copying the text of D2 by retyping it as <span class='f'>=B2*C2</span> on row 6, which totals the wrong item. Read the row number off the side of the sheet."
        },
        {
          cell: "D8", expect: total, needFormula: true, mustNotUse: ["SUM"],
          task: "D8: the order total.",
          answer: "=D2+D3+D4+D5+D6",
          why: "Adding the five line totals, not recalculating from quantities and prices. Build on figures you have already worked out, so there is one place to check if something looks wrong.",
          wrongWay: "<span class='f'>=B2*C2+B3*C3+B4*C4+B5*C5+B6*C6</span>. It gives the same number and is far harder to check, because a mistake in it is invisible. Long formulas that redo work already on the sheet are a reliable sign of trouble."
        },
        {
          cell: "D10", expect: avg, needFormula: true, tol: 0.005,
          task: "D10: the average line total, without a function.",
          answer: "=(D2+D3+D4+D5+D6)/5",
          why: "The brackets force the addition to happen before the division. Without them Excel divides D6 by 5 first and adds that to the other four, giving " + fmtNum(xround(lines[0] + lines[1] + lines[2] + lines[3] + lines[4] / 5, 2), 2) + " instead of " + fmtNum(avg, 2) + ".",
          wrongWay: "<span class='f'>=D2+D3+D4+D5+D6/5</span>. Notice how believable the wrong answer is. It is in the right ballpark, it has the right number of digits, and nothing flags it. This is why brackets are worth being fussy about."
        },
        {
          cell: "D12", ext: true, expect: xround(total * 0.9, 2), needFormula: true, tol: 0.02,
          task: "D12: the order total after a 10% discount.",
          answer: "=D8*0.9    or    =D8-D8*10%",
          why: "Both are correct. The first is shorter and most people write it. The second reads more like the sentence it came from, which matters when somebody else has to check your work six months later.",
          wrongWay: "<span class='f'>=D8-10%</span>, which subtracts nought point one from the total rather than a tenth of it. Percentages in Excel are just fractions, so 10% is 0.1, and subtracting 0.1 from a bill takes off ten pence."
        }
      ]
    };
  },
  workbook: function (seed) {
    const wb = new Workbook("M2S1");
    wb.add(M2S1.practice(seed).sheet);
    return wb;
  }
};

/* ============================================================
   Session 2
   ============================================================ */
const M2S2 = {
  title: "SUM and the family, and what COUNT quietly tells you",
  aim: "Replace hand-built arithmetic with functions, and learn to use two of them together as a data quality check.",
  why: "SUM is the first function everyone learns and the one that most often lies to them, because it skips text without saying so. The fix is not to distrust SUM; it is to put COUNT next to it.",
  concepts: ["m2.sum", "m2.avgblank", "m2.countvcounta", "m2.round"],
  unlocks: ["SUM", "AVERAGE", "MIN", "MAX", "COUNT", "COUNTA", "ROUND", "ROUNDUP", "ROUNDDOWN", "ABS"],
  lesson: [
    { lead: "A function is a formula somebody else has already written and named." },
    { p: "You write the name, open a bracket, tell it what to work on, and close the bracket. <span class='f'>=SUM(D2:D6)</span> does exactly what <span class='f'>=D2+D3+D4+D5+D6</span> did last session, and keeps doing it when you add a sixth row inside the range." },
    { h: "The six that cover most of the work" },
    {
      table: {
        cols: ["Function", "What it does", "Careful"], startRow: 1,
        rows: [
          ["SUM", "adds the numbers", "ignores text without saying so"],
          ["AVERAGE", "the mean", "ignores blanks, includes zeros"],
          ["MIN", "the smallest number", "ignores text"],
          ["MAX", "the largest number", "ignores text"],
          ["COUNT", "how many cells hold numbers", "text does not count"],
          ["COUNTA", "how many cells are not empty", "anything counts"]
        ]
      }
    },
    { h: "The blank and the zero are not the same thing" },
    { p: "AVERAGE skips empty cells entirely. It does not skip zeros. Ten sales of which two were nil is an average over ten; ten sales of which two were not recorded is an average over eight. Those are different questions and they give different answers, so the difference between a blank cell and a cell containing 0 is a real decision, not a typing preference." },
    { trap: "Filling blanks with zeros to tidy a sheet up changes every average on it. If a value is genuinely unknown, leave the cell empty. If it is genuinely nothing, type 0. Never do one to mean the other." },
    { h: "COUNT and COUNTA together, as a check" },
    { p: "Run both over the same range. COUNT tells you how many cells hold real numbers. COUNTA tells you how many hold anything at all." },
    { f: "=COUNT(B2:B13)      10\n=COUNTA(B2:B13)     11" },
    { p: "The gap is one cell that contains something which is not a number. Almost always that is a number stored as text, which means SUM has just quietly left it out of your total." },
    { pro: "Put both counts beside any total you are going to report. It costs two cells and it catches the single most common silent error in Excel. When the two numbers match, your total includes everything you think it includes." },
    { why: "This is why Module 1 spent a session on data types. The alignment test finds the broken cell; COUNT against COUNTA tells you a broken cell exists at all, on a sheet too long to scan by eye." },
    { h: "ROUND actually changes the number" },
    { p: "Formatting a cell to two decimal places changes what you see. ROUND changes what is stored." },
    { f: "=ROUND(3.14159, 2)      3.14\n=ROUND(1234, -2)        1200" },
    { p: "The second argument is how many decimal places. A negative number rounds to the left of the decimal point, so -2 rounds to the nearest hundred." },
    { trap: "Do not round as you go. Round once, at the end, in the cell somebody reads. Rounding intermediate figures and then adding them up produces totals that disagree with their own components, which is the classic way a set of numbers stops adding up in a report." },
    { web: "The AutoSum button on the Home tab writes a SUM formula for you and guesses the range. It guesses by looking for numbers directly above or to the left, and it guesses wrong whenever there is a blank row in the way. Always look at the range it chose before pressing Enter." }
  ],
  reflect: [
    "Say what the difference between COUNT and COUNTA told you about this sheet.",
    "If you had reported the SUM without checking, how far out would you have been?"
  ],

  practice: function (seed) {
    const r = rng(seed);
    const days = ["Mon 4 Mar", "Tue 5 Mar", "Wed 6 Mar", "Thu 7 Mar", "Fri 8 Mar", "Sat 9 Mar",
      "Sun 10 Mar", "Mon 11 Mar", "Tue 12 Mar", "Wed 13 Mar", "Thu 14 Mar", "Fri 15 Mar"];
    const takings = days.map(() => xround(rInt(r, 18000, 74000) / 100, 2));
    const textRow = 4;      // index into days: this one arrives as text
    const blankRow = 8;     // this one was never recorded

    const sh = new Sheet("Takings", 26, 4);
    sh.set(0, 0, "Day", { hdr: true }); sh.set(0, 1, "Takings", { hdr: true });
    days.forEach((d, i) => {
      sh.set(1 + i, 0, d);
      if (i === blankRow) return;
      if (i === textRow) sh.set(1 + i, 1, String(takings[i].toFixed(2)) + " ");   // text, trailing space
      else sh.set(1 + i, 1, takings[i], { fmt: GBP2 });
    });

    label(sh, "A15", "Total"); label(sh, "A16", "Average");
    label(sh, "A17", "Count of numbers"); label(sh, "A18", "Count of entries");
    label(sh, "A19", "Busiest day takings"); label(sh, "A20", "Quietest day takings");
    label(sh, "A21", "Average, rounded to 2dp");
    label(sh, "A23", "Cell stored as text");

    const answers = ["B15", "B16", "B17", "B18", "B19", "B20", "B21", "B23"];
    lockSheet(sh, answers);
    sh.rows = 24; sh.cols = 4;

    /* values the learner's formulas must produce, from the same sheet */
    const rng2 = "B2:B13";
    const expTotal = solve(sh, "=SUM(" + rng2 + ")");
    const expAvg = solve(sh, "=AVERAGE(" + rng2 + ")");
    const expCount = solve(sh, "=COUNT(" + rng2 + ")");
    const expCounta = solve(sh, "=COUNTA(" + rng2 + ")");
    const expMax = solve(sh, "=MAX(" + rng2 + ")");
    const expMin = solve(sh, "=MIN(" + rng2 + ")");
    const expRound = xround(expAvg, 2);
    const textCell = "B" + (2 + textRow);

    return {
      sheet: sh,
      maxRows: 24, maxCols: 4, startRow: 14, startCol: 1, formatBar: false,
      brief: {
        title: "Twelve days of takings, one of which is lying to you",
        body: "A fortnight of daily takings from the cafe. One day was never recorded and the cell is empty. " +
          "One day came in from a card terminal export and is not what it appears to be. " +
          "Build the summary below with functions, and let two of them tell you where the problem is."
      },
      hint: "Every answer is a function over the range <strong>B2:B13</strong>. Type <span class='f'>=SUM(</span> then drag or type the range, then close the bracket.",
      tasks: [
        { id: "t1", text: "In B15, total the takings.", cell: "B15" },
        { id: "t2", text: "In B16, the average daily takings.", cell: "B16" },
        { id: "t3", text: "In B17, how many cells hold a number.", cell: "B17" },
        { id: "t4", text: "In B18, how many cells hold anything at all.", cell: "B18" },
        { id: "t5", text: "Compare B17 and B18. They should not match. In B23, type the address of the cell that is stored as text.", cell: "B23" },
        { id: "t6", text: "In B19 and B20, the busiest and quietest days' takings.", cell: "B19", ext: true },
        { id: "t7", text: "In B21, the average rounded to two decimal places, as a stored value rather than a format.", cell: "B21", ext: true }
      ],
      checks: [
        {
          cell: "B15", expect: expTotal, needFormula: true, mustUse: "SUM", tol: 0.005,
          task: "B15: the total takings.",
          answer: "=SUM(B2:B13)",
          why: "Note what this total is not: it leaves out " + textCell + ", because that cell holds text. SUM gives you " + gbp(expTotal) + " and does not mention the omission. The true figure including that day is " + gbp(xround(expTotal + takings[textRow], 2)) + ".",
          wrongWay: "<span class='f'>=SUM(B2:B14)</span>, reaching one row past the data. It happens to give the same answer here because row 14 is empty, and it will quietly swallow whatever gets typed there next month."
        },
        {
          cell: "B16", expect: expAvg, needFormula: true, mustUse: "AVERAGE", tol: 0.005,
          task: "B16: the average daily takings.",
          answer: "=AVERAGE(B2:B13)",
          why: "This averages over " + expCount + " days, not 12. The empty day is skipped and the text day is skipped. Whether that is the number you want depends on the question: average takings per trading day, or average per day of the fortnight. They are different and the sheet cannot decide for you.",
          wrongWay: "Typing zeros into the blank cell to tidy it up. That would make Excel average over 12 days including a day of nil takings, dragging the figure down by a fifth for no reason other than neatness."
        },
        {
          cell: "B17", expect: expCount, needFormula: true, mustUse: "COUNT",
          task: "B17: how many cells hold a number.",
          answer: "=COUNT(B2:B13)",
          why: "COUNT only counts numbers. Twelve rows, one blank, one text, so " + expCount + ".",
          wrongWay: "Counting the rows by eye and typing 12. The whole point of this pair of cells is to catch what the eye misses."
        },
        {
          cell: "B18", expect: expCounta, needFormula: true, mustUse: "COUNTA",
          task: "B18: how many cells hold anything at all.",
          answer: "=COUNTA(B2:B13)",
          why: "COUNTA counts anything non-empty, so it sees the text day too and returns " + expCounta + ". The gap between this and B17 is exactly one, and that one cell is the problem.",
          wrongWay: "Confusing the two names. COUNTA is not <em>count all rows</em>; it is count non-empty. The blank day is missing from both."
        },
        {
          cell: "B23", expect: textCell,
          task: "B23: the address of the cell stored as text.",
          answer: textCell,
          why: "COUNT and COUNTA told you one exists. The alignment test from Module 1 tells you which: it is the takings figure sitting on the left of its cell instead of the right. In this case the cause is a trailing space from the card terminal export.",
          wrongWay: "Giving the address of the blank cell. The blank is counted by neither function, so it is not what the gap between them is pointing at."
        },
        {
          cell: "B19", ext: true, expect: expMax, needFormula: true, mustUse: "MAX", tol: 0.005,
          task: "B19: the busiest day's takings.",
          answer: "=MAX(B2:B13)",
          why: "MAX ignores the text cell as well, so if the true busiest day happens to be the broken one, this is wrong too. Every function in this family shares the same blind spot, which is why you fix the data rather than working around it.",
          wrongWay: "Sorting the column to find the largest. That reorders your data and, if you sort the one column alone, destroys the sheet. Module 1 covered why."
        },
        {
          cell: "B21", ext: true, expect: expRound, needFormula: true, mustUse: "ROUND", tol: 0.0005,
          task: "B21: the average rounded to two decimal places.",
          answer: "=ROUND(B16,2)",
          why: "This stores " + fmtNum(expRound, 2) + " rather than merely displaying it. Use it when a figure will be copied elsewhere or compared against another system, where a hidden extra decimal causes a mismatch nobody can find.",
          wrongWay: "<span class='f'>=ROUND(AVERAGE(B2:B13),2)</span> is also correct, but referring to B16 means the rounding and the average are in separate cells, each checkable on its own. Long nested formulas hide their mistakes."
        }
      ]
    };
  },
  workbook: function (seed) {
    const wb = new Workbook("M2S2");
    wb.add(M2S2.practice(seed).sheet);
    return wb;
  }
};

/* ============================================================
   Session 3
   ============================================================ */
const M2S3 = {
  title: "Filling a formula down, and the dollar signs that stop it breaking",
  aim: "Write a formula once and apply it to a thousand rows, and understand exactly what changes when you do.",
  why: "This is the moment Excel stops being a grid you type into and becomes something that scales. It is also the single most common place a beginner's sheet goes wrong, and the failure is visually obvious once you know what you are looking at.",
  concepts: ["m2.fill", "m2.relative", "m2.absolute", "m2.mixed"],
  unlocks: [],
  lesson: [
    { lead: "Excel remembers formulas as directions, not addresses." },
    { p: "When you put <span class='f'>=B2*C2</span> in D2, Excel does not really store <em>B2 times C2</em>. It stores <em>two cells to my left, times one cell to my left</em>. The address is how it is written down; the direction is what it means." },
    { p: "So when you copy that cell to D3, the directions still apply from the new position and it becomes <span class='f'>=B3*C3</span>. That is not Excel being clever. It is the only thing the stored instruction could possibly mean." },
    { h: "Filling down" },
    {
      steps: [
        "Write the formula once, in the top cell of the column.",
        "Check it. One correct formula is about to become two hundred, so check this one properly.",
        "Select that cell. A small square sits at its bottom-right corner: the fill handle.",
        "Drag the handle down to the last row, or double-click it and Excel fills down as far as the neighbouring column has data.",
        "Click a cell near the bottom and read the formula bar. Confirm it points where it should."
      ]
    },

  practice: function (seed) {

      vatCells.push("C" + (4 + i));

      sheet: sh,

          why: "The net reference must move down with the formula, so it stays relative. The rate reference must not, so both its parts are locked. Press <kbd>F4</kbd> on B1 while editing rather than typing the dollar signs.",

/* Lay the shared transaction log onto a sheet. Columns:
   A Ref, B Supplier, C City, D Date, E Amount, then whatever the
   session adds. */
function txSheet(name, rows, extraHeads) {
  const sh = new Sheet(name, rows.length + 14, 5 + (extraHeads || []).length);
  const heads = ["Ref", "Supplier", "City", "Date", "Amount"].concat(extraHeads || []);
  heads.forEach((h, i) => sh.set(0, i, h, { hdr: true, locked: true }));
  rows.forEach((t, i) => {
    sh.set(1 + i, 0, t.ref, { locked: true });
    sh.set(1 + i, 1, t.supplier, { locked: true });
    sh.set(1 + i, 2, t.city, { locked: true });
    sh.set(1 + i, 3, t.date, { fmt: DATEFMT, locked: true });
    sh.set(1 + i, 4, t.amount, { fmt: GBP2, locked: true });
  });
  return sh;
}

    { trap: 'A number in quotation marks becomes text, and text is always greater than any number in Excel\'s ordering. So <span class="f">=IF(E2&gt;"500","Review","OK")</span> returns OK for every row, including a transaction of ten thousand pounds. It never errors, and it is wrong for the whole column.' },
    { h: "Returning a number rather than a word" },
    { p: "The two outcomes do not have to be text. They can be numbers, or other formulas." },
    { f: '=IF(E2>500, E2*0.02, 0)' },
    { p: "That gives two per cent of the amount when it is over 500, and nothing otherwise. A column of these can then be totalled, which a column of the word Review cannot." },
    { pro: "If you will ever need to count or total the result, return numbers, not words. A 1 or 0 column can be summed to count the flags, averaged to get a rate, and charted. A Yes or No column can do none of those without extra work. Decide what the column is for before choosing what it returns." },
    { h: "An empty answer" },
    { p: 'Two double quotation marks with nothing between them, <span class="f">""</span>, mean empty text. <span class="f">=IF(E2&gt;500,"Review","")</span> leaves the cell looking blank when there is nothing to say, which makes the exceptions easy to spot down a long column.' },
    { trap: "The cell only looks blank. It contains a formula returning empty text, so ISBLANK says it is not blank and COUNTA counts it. That surprises people later, in Module 4." },
    { web: "Excel for the web colours each referenced cell as you type a formula and highlights the matching brackets, which is the fastest way to see whether your commas are in the right places. If a formula is rejected, it is nearly always a missing bracket or a comma in the wrong place." }
  ],
  reflect: [
    "Say the difference between &gt; and &gt;= in terms of a transaction of exactly £500.",
    "Look at your flag column and ask whether you would rather have 1 and 0 than Review and OK. What would that let you do next?"
  ],

  practice: function (seed) {
    const rows = txRows(seed, 20);
    const sh = txSheet("Transactions", rows, ["Flag", "Fee"]);
    const flagCells = [], feeCells = [];
    for (let i = 0; i < 20; i++) { flagCells.push("F" + (2 + i)); feeCells.push("G" + (2 + i)); }
    lockSheet(sh, flagCells.concat(feeCells));
    feeCells.forEach(ref => { const p = parseA1(ref); sh.ensure(p.r, p.c).fmt = GBP2; });
    sh.rows = 22; sh.cols = 7;

    const over = rows.map(t => t.amount > 500);
    const lastIdx = 19;
    const feeAt = i => (rows[i].amount > 500 ? xround(rows[i].amount * 0.02, 2) : 0);
    const nOver = over.filter(Boolean).length;

    return {
      sheet: sh,
      maxRows: 22, maxCols: 7, colWidth: 92, startRow: 1, startCol: 5,
      formatBar: false, fillBar: true,
      highlight: flagCells.concat(feeCells),
      brief: {
        title: "Twenty payments, and a rule to apply to all of them",
        body: "Compliance policy: any payment <strong>over £500</strong> goes for review. Not £500 exactly, over it. " +
          "Add a flag column that applies that rule to every row, then a fee column that charges two per cent on the flagged ones only. " +
          "Write each formula once and fill it down."
      },
      hint: "Text inside a formula needs double quotation marks. Numbers do not. Use <strong>Fill down ↓</strong> after you have checked the first row.",
      tasks: [
        { id: "t1", text: 'In F2, show <strong>Review</strong> when the amount is over 500, and <strong>OK</strong> otherwise.', cell: "F2" },
        { id: "t2", text: "Fill F2 down to F21, then check the bottom row against the amount beside it.", cell: "F21" },
        { id: "t3", text: "In G2, charge a fee of two per cent of the amount, but only on payments over 500. Anything else should be 0.", cell: "G2" },
        { id: "t4", text: "Fill G2 down to G21.", cell: "G21" },
        { id: "t5", text: "Look down column F. How many say Review? Count them by eye for now; next session gives you a formula for it.", cell: null, ext: true }
      ],
      checks: [
        {
          cell: "F2", expect: over[0] ? "Review" : "OK", needFormula: true, mustUse: "IF",
          task: "F2: the review flag for the first payment.",
          answer: '=IF(E2>500,"Review","OK")',
          why: "The first payment is " + gbp(rows[0].amount) + ", so this returns " + (over[0] ? "Review" : "OK") + ". Both outcomes are text, so both are in quotation marks.",
          wrongWay: '<span class="f">=IF(E2>"500","Review","OK")</span>. The quotation marks turn 500 into text, and in Excel any text sorts above any number, so no amount is ever greater than it. Every row returns OK and nothing warns you.'
        },
        {
          cell: "F21", expect: over[lastIdx] ? "Review" : "OK", needFormula: true, mustUse: "IF",
          task: "F21: the flag on the last row, reached by filling.",
          answer: '=IF(E21>500,"Review","OK")',
          why: "The last payment is " + gbp(rows[lastIdx].amount) + ", so it is " + (over[lastIdx] ? "Review" : "OK") + ". Checking the bottom of a filled column is the habit from Module 2 and it applies to every column you ever fill.",
          wrongWay: "Locking the reference as <span class='f'>$E$2</span> out of caution. The whole column would then report on the first payment twenty times over."
        },
        {
          cell: "G2", expect: feeAt(0), needFormula: true, mustUse: "IF", tol: 0.005,
          task: "G2: a two per cent fee on flagged payments only.",
          answer: "=IF(E2>500,E2*0.02,0)",
          why: "The outcomes here are a calculation and a number, not text, so no quotation marks. Returning 0 rather than empty text matters: a column of numbers can be totalled, and a column with blanks in it cannot be averaged reliably.",
          wrongWay: '<span class="f">=IF(E2>500,E2*0.02,"")</span>. It looks tidier and it makes the column half text, so any later total silently skips the empty ones and any average is over the wrong count.'
        },
        {
          cell: "G21", expect: feeAt(lastIdx), needFormula: true, mustUse: "IF", tol: 0.005,
          task: "G21: the last fee, reached by filling.",
          answer: "=IF(E21>500,E21*0.02,0)",
          why: "Every reference moved down nineteen rows together, which is what you want when the whole formula is about one row. Nothing here should be locked.",
          wrongWay: "Writing the 0.02 rate into twenty formulas. If the fee changes, put it in its own cell and lock the reference, exactly as you did with VAT in Module 2. This exercise keeps it inline only because it is a one-off."
        }
      ]
    };
  },
  workbook: function (seed) {
    const wb = new Workbook("M3S1");
    wb.add(M3S1.practice(seed).sheet);
    return wb;
  }

/* ============================================================

const M3S2 = {
  title: "More than two outcomes: IFS, AND, OR",
  aim: "Sort rows into three or four bands, and test two conditions at once.",
  why: "Real rules are rarely yes or no. They are low, medium and high; or over a threshold <em>and</em> from a particular place. Two tools cover almost all of it, and one of them has an ordering trap that silently ruins the answer.",
  concepts: ["m3.nested", "m3.ifs", "m3.ifsorder", "m3.andor"],
  unlocks: ["IFS", "AND", "OR", "NOT"],
  lesson: [
    { lead: "You can put an IF inside another IF, and you should stop doing it as soon as you learn IFS." },
    { h: "Nested IF" },
    { p: "The false part of an IF can be another IF. That gives three outcomes from two tests." },
    { f: '=IF(E2>1000,"High",IF(E2>500,"Medium","Low"))' },
    { p: "If it is over 1000, High. Otherwise ask a second question: if it is over 500, Medium, otherwise Low. It works, and with four or five bands it becomes a wall of brackets that nobody can read or check." },
    { h: "IFS is the same thing, readable" },
    { f: '=IFS(E2>1000,"High", E2>500,"Medium", TRUE,"Low")' },
    { p: "Pairs, all the way along: a test, then what to return if it is true. The first test that comes out true wins and the rest are never looked at." },
    { p: "The final <span class='f'>TRUE</span> is a catch-all. TRUE is always true, so anything that reached the end lands there. Without it, a value matching none of the tests returns #N/A." },
    { trap: "The order is the whole formula. Put the smallest test first and it captures everything: <span class='f'>=IFS(E2&gt;500,\"Medium\", E2&gt;1000,\"High\", TRUE,\"Low\")</span> never returns High, because anything over 1000 is also over 500 and the first match wins. It does not error. Every large transaction is quietly labelled Medium." },
    { pro: "Write the bands from the extreme inwards: highest test first when the tests use greater-than, lowest first when they use less-than. Then check one row from each band by hand before you fill it down." },
    { h: "AND and OR" },
    { p: "These take several tests and reduce them to one true or false, which you then hand to an IF." },
    {
      ul: [
        "<span class='f'>AND(a, b)</span> is true only when every test is true.",
        "<span class='f'>OR(a, b)</span> is true when at least one test is true.",
        "<span class='f'>NOT(a)</span> flips it."
      ]
    },
    { f: '=IF(AND(E2>500, C2="Leeds"), "Priority", "")' },
    { p: "Over 500 and from Leeds. Both must hold. Swap AND for OR and it flags anything that is either over 500 or from Leeds, which is a very different and much longer list." },
    { why: "The English word <em>and</em> is where this goes wrong. Somebody asks for payments from Leeds and Bristol, meaning both cities in the list. Written as <span class='f'>AND(C2=\"Leeds\", C2=\"Bristol\")</span> it returns nothing at all, because no single row can be both. What they meant was OR. Read the rule back as a test on one row: can this row be both things at once?" },
    { pro: "For more than about three OR conditions on the same column, stop and use a different approach. Module 5 has lookups against a list, which is what you actually want when the rule is really a list of accepted values." },
    { web: "IFS, AND and OR all work in Excel for the web. The desktop version adds SWITCH, which is neater when you are matching exact values rather than ranges; the web version has it too now, but it is not worth learning until you meet a case that needs it." }
  ],
  reflect: [
    "Say what happens to a £2,000 transaction if the Medium test comes before the High test.",
    "Take one rule you have been given in words and say whether it means AND or OR, by asking whether one row could satisfy both parts."
  ],

  practice: function (seed) {
    const rows = txRows(seed, 20);
    const sh = txSheet("Banding", rows, ["Band", "Priority"]);
    const bandCells = [], prioCells = [];
    for (let i = 0; i < 20; i++) { bandCells.push("F" + (2 + i)); prioCells.push("G" + (2 + i)); }
    lockSheet(sh, bandCells.concat(prioCells));
    sh.rows = 22; sh.cols = 7;

    const band = a => (a > 1000 ? "High" : (a > 500 ? "Medium" : "Low"));
    const prio = t => (t.amount > 500 && t.city === "Leeds") ? "Priority" : "";
    /* pick a row that actually lands in the High band, for the answer key note */
    const highIdx = rows.findIndex(t => t.amount > 1000);

    return {
      sheet: sh,
      maxRows: 22, maxCols: 7, colWidth: 92, startRow: 1, startCol: 5,
      formatBar: false, fillBar: true,
      highlight: bandCells.concat(prioCells),
      brief: {
        title: "Three bands and a two-part rule",
        body: "The same twenty payments. Policy now has three bands: <strong>over £1,000 is High</strong>, " +
          "<strong>over £500 is Medium</strong>, everything else is <strong>Low</strong>. " +
          "Separately, anything <strong>over £500 that also comes from Leeds</strong> is marked Priority. " +
          "Get the order of the bands right, and read the second rule carefully before you write it."
      },
      hint: "In IFS the first test that comes out true wins, so the order matters more than anything else in this exercise. Finish with <span class='f'>TRUE</span> as a catch-all.",
      tasks: [
        { id: "t1", text: "In F2, band the payment as High, Medium or Low. Think about which test has to come first.", cell: "F2" },
        { id: "t2", text: "Fill F2 down to F21. Now find a payment over £1,000 and confirm it says High, not Medium.", cell: "F21" },
        { id: "t3", text: 'In G2, show <strong>Priority</strong> when the payment is over £500 <em>and</em> from Leeds, and leave it empty otherwise.', cell: "G2" },
        { id: "t4", text: "Fill G2 down to G21.", cell: "G21" },
        { id: "t5", text: "Change the Priority rule to Leeds <em>or</em> Bristol, over £500, and watch how much longer the list gets. Then put it back.", cell: null, ext: true }
      ],
      checks: [
        {
          cell: "F2", expect: band(rows[0].amount), needFormula: true, mustUse: ["IFS", "IF"],
          task: "F2: the band for the first payment.",
          answer: '=IFS(E2>1000,"High", E2>500,"Medium", TRUE,"Low")',
          why: "The first payment is " + gbp(rows[0].amount) + ", so it is " + band(rows[0].amount) + ". The nested form <span class='f'>=IF(E2>1000,\"High\",IF(E2>500,\"Medium\",\"Low\"))</span> is equally correct and harder to read once there are four bands.",
          wrongWay: 'Putting the Medium test first. <span class="f">=IFS(E2>500,"Medium", E2>1000,"High", TRUE,"Low")</span> never returns High at all, because everything over 1000 is also over 500 and the first match wins. It produces a full column of plausible answers and no error.'
        },
        {
          cell: "F21", expect: band(rows[19].amount), needFormula: true, mustUse: ["IFS", "IF"],
          task: "F21: the band on the last row.",
          answer: '=IFS(E21>1000,"High", E21>500,"Medium", TRUE,"Low")',
          why: "The last payment is " + gbp(rows[19].amount) + ", so " + band(rows[19].amount) + "." +
            (highIdx >= 0 ? " Check row " + (highIdx + 2) + " as well, at " + gbp(rows[highIdx].amount) + ": it must read High. If it says Medium, your tests are in the wrong order." : ""),
          wrongWay: "Leaving off the final TRUE. Anything that fails every test returns #N/A, which at least shows up, unlike the ordering mistake."
        },
        {
          cell: "G2", expect: prio(rows[0]), needFormula: true, mustUse: "AND",
          task: "G2: the Priority flag.",
          answer: '=IF(AND(E2>500,C2="Leeds"),"Priority","")',
          why: "Both conditions must hold on the same row, so AND. The first payment is " + gbp(rows[0].amount) + " from " + rows[0].city + ", so it is " + (prio(rows[0]) === "Priority" ? "Priority" : "left empty") + ".",
          wrongWay: 'Using OR, which flags every Leeds payment however small, plus every large payment from anywhere. Ask whether one row has to satisfy both parts. Here it does, so AND.'
        },
        {
          cell: "G21", expect: prio(rows[19]), needFormula: true, mustUse: "AND",
          task: "G21: the Priority flag on the last row.",
          answer: '=IF(AND(E21>500,C21="Leeds"),"Priority","")',
          why: "Row 21 is " + gbp(rows[19].amount) + " from " + rows[19].city + ". City comparisons ignore capitalisation in Excel, so leeds and LEEDS would both match.",
          wrongWay: 'Writing <span class="f">=IF(AND(C21="Leeds",C21="Bristol"),...)</span> when asked for Leeds and Bristol. No row can be both cities, so it returns nothing at all. The word and in English often means OR in a formula.'
        }
      ]
    };
  },
  workbook: function (seed) {
    const wb = new Workbook("M3S2");
    wb.add(M3S2.practice(seed).sheet);
    return wb;
  }
};

   Session 3

const M3S3 = {
  title: "Counting with conditions",
  aim: "Answer questions like how many transactions over £500 happened in March, in one cell, without touching the data.",
  why: "This is the first thing anyone will ask you to do with a spreadsheet in a job, and it is the question a filter can answer once but a formula answers permanently and updates itself.",
  concepts: ["m3.countif", "m3.criteria", "m3.countifs", "m3.wildcard"],
  unlocks: ["COUNTIF", "COUNTIFS"],
  lesson: [
    { lead: "COUNTIF counts the rows that match one condition. COUNTIFS counts the rows that match several." },
    { f: '=COUNTIF(where to look, what to look for)' },
    { f: '=COUNTIF(C2:C500, "Leeds")           how many Leeds rows\n=COUNTIF(E2:E500, ">500")            how many over 500' },
    { h: "The awkward part: criteria go in quotation marks" },
    { p: "A plain value can be written bare or quoted. A comparison must be quoted, all of it, operator included." },
    { f: '=COUNTIF(E2:E500, ">500")            correct\n=COUNTIF(E2:E500, >500)              rejected' },
    { why: "The whole criterion is a single instruction handed to the function as one piece of text, so the operator has to travel inside the quotation marks with the number. It reads oddly and it is the thing beginners get wrong most often with this family of functions." },
    { h: "Comparing against a cell" },
    { p: "Hard-coding 500 into the formula is the Module 2 mistake again. Put the threshold in a cell and join it on with an ampersand." },
    { f: '=COUNTIF(E2:E500, ">"&$H$1)' },
    { p: "The ampersand joins the text <span class='f'>&gt;</span> to whatever is in H1, producing the criterion. Now the threshold is visible on the sheet and changing it re-answers the question. The dollar signs are there because this formula might be filled." },
    { h: "COUNTIFS: several conditions at once" },
    { p: "Pairs again: a range, then the criterion for that range, repeated." },
    { f: '=COUNTIFS(E2:E500, ">500",\n          D2:D500, ">="&$B$24,\n          D2:D500, "<="&$B$25)' },
    { p: "How many payments over £500 fell in March. Every condition must hold on the same row for that row to be counted. Ranges are used more than once here, which is normal: the date column is tested twice to make a window." },
    { trap: "Every range in a COUNTIFS must be the same size. Mixing <span class='f'>E2:E500</span> with <span class='f'>D2:D499</span> gives #VALUE!, which at least announces itself. Mixing <span class='f'>E2:E500</span> with <span class='f'>D3:D501</span> is the same size and silently compares each amount against the wrong row's date." },
    { h: "Dates need a window, not a month name" },
    { p: "There is no way to say in March directly, because a date is a day count and knows nothing about months. You give it a start and an end and count what falls between. Put both dates in cells, format them as dates, and refer to them." },
    { pro: "Never type a date inside a criterion string. Regional settings decide whether 03/04/2024 is March or April, and the formula will quietly give a different answer on a colleague's machine. A cell reference has no such ambiguity." },
    { h: "Wildcards for partial text" },
    {
      ul: [
        "<span class='f'>*</span> stands for any number of characters. <span class='f'>\"*Ltd\"</span> matches anything ending in Ltd.",
        "<span class='f'>?</span> stands for exactly one character. <span class='f'>\"B?ll\"</span> matches Bell and Ball but not Bill Smith.",
        "To search for a literal asterisk, put a tilde in front of it: <span class='f'>\"~*\"</span>."
      ]
    },
    { p: "Wildcards work on text only. They do nothing on a column of numbers or dates." },
    { trap: "COUNTIF ignores capitalisation, so Leeds and LEEDS both match. It does not ignore spaces. A supplier stored as <span class='f'>Redgate Supplies </span> with a trailing space will not match <span class='f'>\"Redgate Supplies\"</span>, and your count will be short by however many rows have that flaw. Module 4 is about finding and fixing exactly this." },
    { web: "The status bar at the bottom of Excel shows a count of selected non-empty cells, which is a quick sanity check on a COUNTIF you have just written. Select the column, read the count, and see whether your formula is in the right region." }
  ],
  reflect: [
    "Say why the operator has to go inside the quotation marks.",
    "If your March count looked low, what would you check first? The answer involves Module 1."
  ],

  practice: function (seed) {
    const rows = txRows(seed, 24);
    const sh = txSheet("Counting", rows, []);
    const first = 2, last = 1 + rows.length;
    const R = r => r + first - 1;

    const base = rows.length + 3;                 // first free row after the data
    label(sh, "A" + (base), "Reference values");
    note(sh, "A" + (base + 1), "Threshold");
    put(sh, "B" + (base + 1), 500, { locked: true, fmt: GBP2 });
    note(sh, "A" + (base + 2), "March starts");
    put(sh, "B" + (base + 2), MAR_START, { locked: true, fmt: DATEFMT });
    note(sh, "A" + (base + 3), "March ends");
    put(sh, "B" + (base + 3), MAR_END, { locked: true, fmt: DATEFMT });

    label(sh, "A" + (base + 5), "Answers");
    /* Short labels: the grid columns are narrow and the full wording
       is already in the task list above the sheet. */
    const qs = ["Over threshold", "In March", "Both", "From Leeds", "Ends in Ltd"];
    qs.forEach((q, i) => note(sh, "A" + (base + 6 + i), q));
    const ansCells = qs.map((q, i) => "C" + (base + 6 + i));
    lockSheet(sh, ansCells);
    sh.rows = base + 6 + qs.length + 1;
    sh.cols = 5;

    const amtR = "E" + first + ":E" + last;
    const datR = "D" + first + ":D" + last;
    const citR = "C" + first + ":C" + last;
    const supR = "B" + first + ":B" + last;
    const thr = "B" + (base + 1), ms = "B" + (base + 2), me = "B" + (base + 3);

    const eOver = solve(sh, '=COUNTIF(' + amtR + ',">"&' + thr + ')');
    const eMar = solve(sh, '=COUNTIFS(' + datR + ',">="&' + ms + ',' + datR + ',"<="&' + me + ')');
    const eBoth = solve(sh, '=COUNTIFS(' + amtR + ',">"&' + thr + ',' + datR + ',">="&' + ms + ',' + datR + ',"<="&' + me + ')');
    const eLeeds = solve(sh, '=COUNTIF(' + citR + ',"Leeds")');
    const eLtd = solve(sh, '=COUNTIF(' + supR + ',"*Ltd")');

    return {
      sheet: sh,
      maxRows: sh.rows, maxCols: 5, startRow: base + 5, startCol: 2,
      formatBar: false,
      brief: {
        title: "Five questions, five cells, no filtering",
        body: "Twenty-four payments. Answer each question with a single formula that reads the data where it sits. " +
          "The threshold and the March dates are in cells below the data; point at those rather than typing the values into your formulas, " +
          "so that changing the threshold re-answers every question at once."
      },
      hint: "Criteria go inside quotation marks, operator included. To compare against a cell, join them with an ampersand: <span class='f'>\">\"&amp;$B$" + (base + 1) + "</span>.",
      tasks: [
        { id: "t1", text: "How many payments are over the threshold?", cell: ansCells[0] },
        { id: "t2", text: "How many payments fell in March? You need two conditions on the date column: on or after the start, and on or before the end.", cell: ansCells[1] },
        { id: "t3", text: "How many were over the threshold <em>and</em> in March?", cell: ansCells[2] },
        { id: "t4", text: "How many payments came from Leeds?", cell: ansCells[3] },
        { id: "t5", text: "How many suppliers have a name ending in <strong>Ltd</strong>? Use a wildcard.", cell: ansCells[4], ext: true }
      ],
      checks: [
        {
          cell: ansCells[0], expect: eOver, needFormula: true, mustUse: "COUNTIF",
          task: "Payments over the threshold.",
          answer: '=COUNTIF(' + amtR + ',">"&' + thr + ')',
          why: "The ampersand joins the greater-than sign to the value in " + thr + ", building the criterion \">500\". Change the threshold cell and this answer changes with it, which is the whole point of not typing 500 into the formula.",
          wrongWay: '<span class="f">=COUNTIF(' + amtR + ',>' + '500)</span> without quotation marks, which Excel rejects, or <span class="f">">500"</span> typed literally, which works today and hides the threshold from anyone reading the sheet.'
        },
        {
          cell: ansCells[1], expect: eMar, needFormula: true, mustUse: "COUNTIFS",
          task: "Payments in March.",
          answer: '=COUNTIFS(' + datR + ',">="&' + ms + ',' + datR + ',"<="&' + me + ')',
          why: "The same date range appears twice, once for each end of the window. That is normal and it is how you express between in this family of functions. Note it is >= and <=, so payments on the first and last of March are included.",
          wrongWay: 'Typing the dates into the criteria as text, such as <span class="f">">=01/03/2024"</span>. Whether that means March or April depends on regional settings, so the formula gives a different answer on a colleague\'s machine and neither of you can see why.'
        },
        {
          cell: ansCells[2], expect: eBoth, needFormula: true, mustUse: "COUNTIFS",
          task: "Over the threshold and in March.",
          answer: '=COUNTIFS(' + amtR + ',">"&' + thr + ',' + datR + ',">="&' + ms + ',' + datR + ',"<="&' + me + ')',
          why: "Three conditions, all of which must hold on the same row. This is the question from the course outline, and it is the shape of most real analysis requests: a value test and a time window.",
          wrongWay: "Answering with the smaller of the two previous counts. Conditions combine by intersection, not by taking a minimum, and there is no way to reason the answer out from the other two figures."
        },
        {
          cell: ansCells[3], expect: eLeeds, needFormula: true, mustUse: "COUNTIF",
          task: "Payments from Leeds.",
          answer: '=COUNTIF(' + citR + ',"Leeds")',

/* ============================================================
   Module 4: Cleaning dirty data
   The practice files here are the filthiest in the course, on
   purpose. Cleaning is not a bonus topic; it is most of the job.

   Power Query appears only as a marked aside. It is the right
   professional tool and it hides the logic, so it is taught after
   the formulas rather than instead of them.
   ============================================================ */

const M4_NAMES = [
  "Redgate Supplies", "Halden & Co", "Northwood Ltd", "Peak Trading",
  "Mersey Print", "Calder Foods", "Ashby Motors", "Wear Valley Steel"
];

/* Break a clean name the way a real export does. */
function dirty(r, name) {
  return rWeighted(r, [
    [name, 4],
    ["  " + name, 2],
    [name + " ", 3],
    [" " + name + "  ", 1],
    [name.toUpperCase(), 2],
    [name.toLowerCase(), 1],
    [name.replace(/ /g, "  "), 1]
  ]);
}

          wrongWay: "<span class='f'>=COUNTIF(B2:B13,\"<>\"&D2:D13)</span>. COUNTIF compares a range against one criterion, not against another range row by row, so it cannot answer this."

        }
      ]
    };
  },
  workbook: function (seed) { const wb = new Workbook("M4S1"); wb.add(M4S1.practice(seed).sheet); return wb; }
};

    { pro: "The professional order is always: count, inspect, decide, then act. One click of Remove Duplicates does all four at once and shows you none of them." },
    { h: "What Excel counts as a duplicate" },
    {
      ul: [
        "It ignores capitalisation. <span class='f'>ACME</span> and <span class='f'>Acme</span> are the same row.",
        "It does not ignore spaces. <span class='f'>Acme</span> and <span class='f'>Acme </span> are different rows.",
        "It compares only the columns you tick, and it keeps the first occurrence it meets."
      ]
    },
    { trap: "The last point is the dangerous one. Tick only the supplier column on a transaction file and Excel deletes every payment to that supplier except the first, because it is comparing suppliers rather than transactions. The rows vanish, the totals drop, and there is no record of what went. This is a real way to destroy a file." },
    { why: "A duplicate is a repeat of the thing your table is about. If each row is one transaction, two rows are duplicates only when the reference, the date, the amount and the counterparty all match. Ask what one row represents before you tick a single box." },

    { p: "Because trailing spaces make identical rows look different, running Remove Duplicates on a dirty file leaves duplicates behind. Sessions 1 and 2 come first for a reason: trim, standardise case, convert types, and only then look for repeats." },
    { h: "UNIQUE, which changes nothing" },
    { f: '=UNIQUE(A2:A100)' },
    { p: "Returns the distinct values, spilling down from wherever you put it, and leaves the source alone. Use it to see the distinct list, count the categories, or build the left-hand column of a summary table. It is the safe tool and it should be your default." },
    { f: '=COUNTA(UNIQUE(A2:A100))       how many distinct suppliers' },
    { h: "Blanks" },
    { p: "COUNTBLANK counts genuinely empty cells in a range. It does not count a cell containing empty text from an IF, which looks blank and is not. That distinction was flagged in Module 3 and this is where it bites." },
    { f: '=COUNTBLANK(B2:B100)         truly empty\n=COUNTIF(B2:B100,"")         empty or empty-text' },
    { pro: "Decide what a blank means before you fill it. An unknown value should stay blank so averages exclude it. A genuine nil should be 0. Filling blanks with zeros to tidy a sheet changes every average on it, which was Module 2." },
    { web: "Remove Duplicates and Go To Special are both in Excel for the web. <span class='path'><span>Data</span><i>›</i><span>Remove Duplicates</span></span> shows the tick boxes; read them rather than accepting the default of all columns." },
    { desk: "Power Query's <span class='f'>Remove Duplicates</span> is equally destructive but non-committal: it is a step in a list you can inspect, reorder and delete, and the source table is untouched. Its <span class='f'>Group By</span> is better still, letting you collapse repeats while summing the amounts rather than discarding them, which is usually what you actually wanted." }
  ],
  reflect: [
    "Say what one row of your practice file represents, and therefore what would make two rows genuine duplicates.",

  practice: function (seed) {
    const r = rng(seed);
    const base = [];
    for (let i = 0; i < 9; i++) {
      base.push({
        ref: "TX-" + (7100 + i),
        supplier: M4_NAMES[i % M4_NAMES.length],
        amount: xround(rInt(r, 6000, 190000) / 100, 2)
      });
    }
    /* two genuine duplicates: the same transaction keyed twice */
    const rows = base.slice();
    rows.splice(4, 0, Object.assign({}, base[2]));
    rows.splice(8, 0, Object.assign({}, base[6]));

    const sh = new Sheet("Duplicates", 22, 6);
    sh.set(0, 0, "Ref", { hdr: true });
    sh.set(0, 1, "Supplier", { hdr: true });
    sh.set(0, 2, "Amount", { hdr: true });
    sh.set(0, 3, "Times ref appears", { hdr: true });
    rows.forEach((t, i) => {
      sh.set(1 + i, 0, t.ref);
      sh.set(1 + i, 1, t.supplier);
      sh.set(1 + i, 2, t.amount, { fmt: GBP2 });
    });
    const n = rows.length;

    label(sh, "A" + (n + 3), "Distinct suppliers");
    label(sh, "A" + (n + 4), "Rows that are repeats");
    label(sh, "A" + (n + 5), "Total as it stands");
    label(sh, "A" + (n + 6), "Total without the repeats");

    const answers = [];
    for (let i = 0; i < n; i++) answers.push("D" + (2 + i));
    const cDistinct = "C" + (n + 3), cRepeats = "C" + (n + 4), cTotal = "C" + (n + 5), cClean = "C" + (n + 6);
    answers.push(cDistinct, cRepeats, cTotal, cClean);
    lockSheet(sh, answers);
    [cTotal, cClean].forEach(ref => { const p = parseA1(ref); sh.ensure(p.r, p.c).fmt = GBP2; });
    sh.rows = n + 8; sh.cols = 5;

    const refR = "$A$2:$A$" + (n + 1);
    const eCount0 = solve(sh, "=COUNTIF(" + refR + ",A2)");
    const eDistinct = solve(sh, "=COUNTA(UNIQUE(B2:B" + (n + 1) + "))");
    const eTotal = solve(sh, "=SUM(C2:C" + (n + 1) + ")");
    const eRepeats = 2;
    const eClean = xround(base.reduce((a, b) => a + b.amount, 0), 2);

    return {
      sheet: sh,
      maxRows: n + 8, maxCols: 5, startRow: 1, startCol: 3,
      formatBar: false, fillBar: true,
      highlight: answers,
      brief: {
        title: "Eleven rows, nine transactions",
        body: "Two payments were keyed into the system twice, so this file overstates what was actually spent. " +
          "Find them by counting before you delete anything, then work out what the total should have been. " +
          "Each row here represents <strong>one transaction</strong>, so a repeat is a repeat of the reference, not of the supplier."
      },
      hint: "Lock the range in your COUNTIF so it does not drift as you fill, and let the criterion point at the reference beside it. Anything above 1 is a repeat.",
      tasks: [
        { id: "t1", text: "In D2, count how many times that reference appears in the whole column. Fill down.", cell: "D2" },
        { id: "t2", text: "Look down column D. Two references should show 2. Those are your duplicates.", cell: null },
        { id: "t3", text: "In " + cDistinct + ", count the distinct suppliers.", cell: cDistinct },
        { id: "t4", text: "In " + cRepeats + ", count how many rows are repeats, meaning rows whose reference appears more than once, minus the originals.", cell: cRepeats },
        { id: "t5", text: "In " + cTotal + ", total the amounts as the file stands.", cell: cTotal },
        { id: "t6", text: "In " + cClean + ", work out what the total should be with each transaction counted once.", cell: cClean, ext: true }
      ],
      checks: [
        {
          cell: "D2", expect: eCount0, needFormula: true, mustUse: "COUNTIF",
          task: "D2: how many times the first reference appears.",
          answer: "=COUNTIF(" + refR + ",A2)",
          why: "The range is locked so every row searches the whole column; the criterion is relative so each row asks about its own reference. Anything above 1 is a repeat, and you can now see them before deciding anything.",
          wrongWay: "Leaving the range relative. It shrinks as the formula fills, so the bottom rows search only the last few cells and report 1 for everything, and the duplicates disappear from your own diagnostic."
        },
        {
          cell: cDistinct, expect: eDistinct, needFormula: true, mustUse: ["UNIQUE", "SUMPRODUCT"],
          task: cDistinct + ": the number of distinct suppliers.",
          answer: "=COUNTA(UNIQUE(B2:B" + (n + 1) + "))",
          why: "UNIQUE returns the distinct list without touching the data, and COUNTA counts it. The older idiom <span class='f'>=SUMPRODUCT(1/COUNTIF(range,range))</span> does the same on versions without UNIQUE and is worth recognising.",
          wrongWay: "Running Remove Duplicates on the supplier column to count what is left. That deletes rows of real transactions to answer a question that needed no deletion at all."
        },
        {
          cell: cRepeats, expect: eRepeats, needFormula: true,
          task: cRepeats + ": how many rows are repeats.",
          answer: "=COUNTIF(D2:D" + (n + 1) + ',">1")/2',
          why: "Two references appear twice, so four rows are involved and two of them are surplus. Dividing by two converts rows-involved into rows-to-remove. <span class='f'>=" + (n) + "-" + cDistinct + "</span> would not work here, because that counts distinct suppliers rather than distinct references.",
          wrongWay: "Counting the rows where D is above 1 and reporting 4. Four rows are <em>involved</em> in duplication; only two are extra. Say which of the two numbers you mean, because they answer different questions."
        },
        {
          cell: cTotal, expect: eTotal, needFormula: true, mustUse: "SUM", tol: 0.005,
          task: cTotal + ": the total as it stands.",
          answer: "=SUM(C2:C" + (n + 1) + ")",
          why: gbp(eTotal) + ", which is what the file claims was spent and is wrong by the value of the two repeated payments.",
          wrongWay: "Reporting this figure. It is the number the file gives you and it overstates the spend."
        },
        {
          cell: cClean, ext: true, expect: eClean, needFormula: true, tol: 0.005,
          task: cClean + ": the total with each transaction counted once.",
          answer: "=SUMPRODUCT(C2:C" + (n + 1) + "/D2:D" + (n + 1) + ")",
          why: "Dividing each amount by the number of times its reference appears means a payment recorded twice contributes half from each row, and therefore its full value once. The difference from the total above is " + gbp(xround(eTotal - eClean, 2)) + ", which is real money that was never spent.",
          wrongWay: "Deleting the duplicate rows and totalling what is left. That gives the same number and destroys the evidence. In any regulated context you keep the original and show your working, because somebody will ask why the figure changed."
        }
      ]
    };
  },
  workbook: function (seed) { const wb = new Workbook("M4S4"); wb.add(M4S4.practice(seed).sheet); return wb; }
};

/* ============================================================
   Module 5: Lookups
   Three sessions. XLOOKUP is taught first because it is what you
   should use; VLOOKUP second because interviews still ask for it;
   INDEX and MATCH once, honestly.

   From this module the instructions get shorter. You have the
   habits now, and being told every keystroke past this point
   trains you to follow rather than to think.
   ============================================================ */

const M5_MASTER = [
  { code: "SUP-101", name: "Redgate Supplies", risk: "Low" },
  { code: "SUP-102", name: "Halden & Co", risk: "Medium" },
  { code: "SUP-103", name: "Northwood Ltd", risk: "Low" },
  { code: "SUP-104", name: "Peak Trading", risk: "High" },
  { code: "SUP-105", name: "Mersey Print", risk: "Medium" },
  { code: "SUP-106", name: "Calder Foods", risk: "Low" },
  { code: "SUP-107", name: "Ashby Motors", risk: "High" }
];

/* Write the supplier master below the transactions, as a second block
   on the same sheet. In a real workbook it would sit on its own sheet
   and be written Suppliers!A:C; the practice grid keeps everything in
   one place so the ranges stay readable. */
function writeMaster(sh, startRow, codes, extraHead) {
  const r0 = startRow - 1;
  label(sh, "A" + startRow, "Supplier master");
  sh.set(r0 + 1, 0, "Code", { hdr: true, locked: true });
  sh.set(r0 + 1, 1, "Supplier", { hdr: true, locked: true });
  sh.set(r0 + 1, 2, "Risk", { hdr: true, locked: true });
  if (extraHead) sh.set(r0 + 1, 3, extraHead, { hdr: true, locked: true });
  M5_MASTER.forEach((m, i) => {
    sh.set(r0 + 2 + i, 0, codes ? codes[i] : m.code, { locked: true });
    sh.set(r0 + 2 + i, 1, m.name, { locked: true });
    sh.set(r0 + 2 + i, 2, m.risk, { locked: true });
  });
  return { first: startRow + 2, last: startRow + 1 + M5_MASTER.length };
}

const M5S1 = {

    { why: "This is not an Excel idea, it is how all data is organised. Store each fact once, in the place it belongs, and refer to it by a key. Duplicating the supplier name against every transaction guarantees that one day half the rows say Redgate Supplies and half say Redgate Supplies Ltd, and no one can tell which is right." },
